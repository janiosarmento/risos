            <div
                class="fixed inset-0 bg-gray-100 dark:bg-gray-900 z-50 flex flex-col"
                @keydown.escape.window="closePost()"
            >
                <!-- Modal Header -->
                <div class="p-3 md:p-4 border-b border-gray-200 dark:border-gray-700 flex items-start md:items-center justify-between bg-white dark:bg-gray-800 flex-shrink-0 gap-2">
                    <div class="flex-1 min-w-0">
                        <h2 class="text-base md:text-lg font-bold line-clamp-2 md:truncate" x-text="currentPost.title"></h2>
                        <template x-if="currentPost.translated_title">
                            <p class="text-sm text-gray-600 dark:text-gray-400 italic mt-0.5" x-text="currentPost.translated_title"></p>
                        </template>
                        <div class="text-xs md:text-sm text-gray-500 dark:text-gray-400 flex items-center gap-1 md:gap-2 flex-wrap mt-1">
                            <a
                                :href="getFeedSiteUrl(currentPost.feed_id) || '#'"
                                x-text="getFeedTitle(currentPost.feed_id)"
                                target="_blank"
                                rel="noopener"
                                :class="getFeedSiteUrl(currentPost.feed_id) ? 'hover:text-blue-500 hover:underline cursor-pointer' : 'cursor-default'"
                                @click="!getFeedSiteUrl(currentPost.feed_id) && $event.preventDefault()"
                            ></a>
                            <span>|</span>
                            <span x-text="formatDate(currentPost.published_at || currentPost.fetched_at)"></span>
                            <template x-if="currentPost.author">
                                <span class="flex items-center gap-2">
                                    <span>|</span>
                                    <span x-text="currentPost.author"></span>
                                </span>
                            </template>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 md:gap-2 flex-shrink-0">
                        <!-- Navegacao anterior/proximo -->
                        <div class="flex items-center">
                            <button
                                @click="prevPost()"
                                class="p-1.5 md:p-2 rounded hover:bg-gray-200 dark:hover:bg-gray-700 disabled:opacity-30 disabled:cursor-not-allowed"
                                :disabled="!canGoPrev()"
                                :data-tip="t('modal.prevPost')"
                                :aria-label="t('modal.prevPost')"
                            >
                                <svg class="w-5 h-5"><use href="#icon-chevron-left"/></svg>
                            </button>
                            <button
                                @click="nextPost()"
                                class="p-1.5 md:p-2 rounded hover:bg-gray-200 dark:hover:bg-gray-700 disabled:opacity-30 disabled:cursor-not-allowed"
                                :disabled="!canGoNext()"
                                :data-tip="t('modal.nextPost')"
                                :aria-label="t('modal.nextPost')"
                            >
                                <svg class="w-5 h-5"><use href="#icon-chevron-right"/></svg>
                            </button>
                        </div>
                        <!-- Star button -->
                        <button
                            @click="toggleStar(currentPost)"
                            class="p-1.5 md:p-2 rounded hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors"
                            :data-tip="currentPost.is_starred ? t('modal.unstarPost') : t('modal.starPost')"
                            :aria-label="currentPost.is_starred ? t('modal.unstarPost') : t('modal.starPost')"
                        >
                            <svg class="w-5 h-5" :class="currentPost.is_starred ? 'text-yellow-500' : 'text-gray-400 hover:text-yellow-400'" :fill="currentPost.is_starred ? 'currentColor' : 'none'" :stroke="currentPost.is_starred ? 'none' : 'currentColor'" :stroke-width="currentPost.is_starred ? '0' : '1.5'" viewBox="0 0 20 20"><use href="#icon-star"/></svg>
                        </button>
                        <!-- Like button -->
                        <button
                            @click="toggleLike(currentPost)"
                            class="p-1.5 md:p-2 rounded hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors"
                            :data-tip="currentPost.is_liked ? t('modal.unlikePost') : t('modal.likePost')"
                            :aria-label="currentPost.is_liked ? t('modal.unlikePost') : t('modal.likePost')"
                        >
                            <svg class="w-5 h-5" :class="currentPost.is_liked ? 'text-red-500' : 'text-gray-400 hover:text-red-400'" :fill="currentPost.is_liked ? 'currentColor' : 'none'" :stroke="currentPost.is_liked ? 'none' : 'currentColor'" :stroke-width="currentPost.is_liked ? '0' : '1.5'" viewBox="0 0 20 20"><use href="#icon-heart"/></svg>
                        </button>
                        <!-- Keep unread button -->
                        <button
                            @click="toggleKeepUnread(currentPost)"
                            class="p-1.5 md:p-2 rounded hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors"
                            :data-tip="currentPost.keep_unread ? t('keepUnread.unlock') : t('keepUnread.lock')"
                            :aria-label="currentPost.keep_unread ? t('keepUnread.unlock') : t('keepUnread.lock')"
                        >
                            <svg class="w-5 h-5" :class="currentPost.keep_unread ? 'text-blue-600 dark:text-blue-400' : 'text-gray-400 hover:text-blue-400'" :fill="currentPost.keep_unread ? 'currentColor' : 'none'" :stroke="currentPost.keep_unread ? 'none' : 'currentColor'" :stroke-width="currentPost.keep_unread ? '0' : '1.5'" viewBox="0 0 24 24"><use href="#icon-lock"/></svg>
                        </button>
                        <!-- Sparkle Assistant Button -->
                        <button
                            @click="openAssistant()"
                            class="p-1.5 md:px-3 md:py-1 bg-purple-100 hover:bg-purple-200 dark:bg-purple-900/40 dark:hover:bg-purple-800/40 text-purple-700 dark:text-purple-300 rounded flex items-center gap-1 transition-colors"
                            :data-tip="t('modal.assistantTitle') + ' (I)'"
                            :aria-label="t('modal.assistantTitle')"
                        >
                            <svg class="w-5 h-5"><use href="#icon-sparkles"/></svg>
                            <span class="hidden md:inline text-sm" x-text="t('modal.assistantTitle')"></span>
                        </button>
                        <!-- Read/Unread button - icon only on mobile -->
                        <button
                            @click="toggleRead(currentPost)"
                            class="p-1.5 md:px-3 md:py-1 rounded text-white"
                            :class="currentPost.is_read ? 'bg-gray-500 dark:bg-gray-700 hover:bg-gray-600 dark:hover:bg-gray-600' : 'bg-blue-600 hover:bg-blue-700'"
                            :data-tip="currentPost.is_read ? t('modal.unread') : t('modal.read')"
                            :aria-label="currentPost.is_read ? t('modal.unread') : t('modal.read')"
                        >
                            <svg class="w-5 h-5 md:hidden"><use href="#icon-check"/></svg>
                            <span class="hidden md:inline text-sm" x-text="currentPost.is_read ? t('modal.unread') : t('modal.read')"></span>
                        </button>
                        <!-- Original link - icon only on mobile -->
                        <a
                            :href="currentPost.url"
                            target="_blank"
                            class="p-1.5 md:px-3 md:py-1 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 rounded"
                            :data-tip="t('modal.original')"
                            :aria-label="t('modal.original')"
                        >
                            <svg class="w-5 h-5 md:hidden"><use href="#icon-external-link"/></svg>
                            <span class="hidden md:inline text-sm" x-text="t('modal.original')"></span>
                        </a>
                        <button
                            @click="exportPostAsMarkdown()"
                            class="hidden md:inline-flex items-center gap-1 px-3 py-1 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 rounded"
                            :data-tip="t('modal.exportMarkdown')"
                            :aria-label="t('modal.exportMarkdown')"
                        >
                            <svg class="w-4 h-4"><use href="#icon-download"/></svg>
                            <span class="text-sm" x-text="t('modal.exportMarkdown')"></span>
                        </button>
                        <button @click="closePost()" class="p-1 text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white text-2xl" :data-tip="t('modal.close')" :aria-label="t('modal.close')">&times;</button>
                    </div>
                </div>

                <!-- Two Column Content - stacks on mobile -->
                <div class="flex-1 flex flex-col md:flex-row overflow-hidden min-h-0">
                    <!-- Left Column: Original Content -->
                    <div class="flex-1 flex flex-col md:border-r border-gray-200 dark:border-gray-700 min-h-0 md:min-h-full overflow-hidden">
                        <div class="px-4 py-2 bg-gray-50 dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 flex-shrink-0 flex items-center min-h-[42px]">
                            <h3 class="text-sm font-medium text-gray-500 dark:text-gray-400" x-text="t('modal.originalContent')"></h3>
                        </div>
                        <div class="flex-1 overflow-y-auto p-4 md:p-6 scrollbar-thin bg-white dark:bg-gray-900">
                            <template x-if="loadingContent">
                                <div class="text-center text-gray-500 py-8" x-text="t('app.loading')"></div>
                            </template>
                            <template x-if="!loadingContent">
                                <div
                                    class="post-content text-gray-800 dark:text-gray-200"
                                    x-html="currentPost.full_content || currentPost.content || t('modal.noContent')"
                                ></div>
                            </template>
                        </div>
                    </div>

                    <!-- Right Column: AI Summary -->
                    <div class="w-full md:w-1/3 flex flex-col bg-blue-50 dark:bg-slate-800 md:min-w-[300px] border-t md:border-t-0 border-gray-200 dark:border-gray-700 max-h-[40vh] md:max-h-full overflow-hidden flex-shrink-0 md:flex-shrink">
                        <div class="px-4 py-2 bg-blue-100 dark:bg-slate-700 border-b border-blue-200 dark:border-slate-600 flex-shrink-0 flex items-center justify-between min-h-[42px]">
                            <h3 class="text-sm font-medium text-blue-600 dark:text-blue-300" x-text="t('modal.aiSummary')"></h3>
                            <div class="flex items-center gap-1">
                                <!-- Copy summary -->
                                <button
                                    @click="copySummaryToClipboard()"
                                    class="text-xs px-2 py-1 rounded transition-colors bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-600 dark:text-gray-300 disabled:opacity-40 disabled:cursor-not-allowed"
                                    :disabled="!currentPost || !currentPost.summary_pt"
                                    :data-tip="t('modal.copySummary')"
                                    :aria-label="t('modal.copySummary')"
                                >
                                    <span class="flex items-center gap-1">
                                        <svg class="w-3 h-3"><use href="#icon-copy"/></svg>
                                        <span class="hidden md:inline" x-text="t('modal.copySummary').split(' (')[0]"></span>
                                    </span>
                                </button>
                                <button
                                    @click="toggleSkipSummary()"
                                    class="text-xs px-2 py-1 rounded transition-colors"
                                    :class="currentPost.skip_summary ? 'bg-red-200 dark:bg-red-900 text-red-700 dark:text-red-300' : 'bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white'"
                                    :data-tip="currentPost.skip_summary ? t('modal.skipSummaryActiveTooltip') : t('modal.skipSummaryTooltip')"
                                >
                                    <span class="flex items-center gap-1">
                                        <svg class="w-3 h-3"><use href="#icon-prohibition"/></svg>
                                        <span x-text="currentPost.skip_summary ? t('modal.skipSummaryActive') : t('modal.skipSummary')"></span>
                                    </span>
                                </button>
                                <button
                                    @click="regenerateSummary()"
                                    class="text-xs px-2 py-1 rounded transition-colors"
                                    :class="regeneratingSummary ? 'bg-gray-400 dark:bg-gray-600 text-gray-500 dark:text-gray-400 cursor-wait' : 'bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white'"
                                    :disabled="regeneratingSummary"
                                    :data-tip="t('modal.regenerate')"
                                >
                                    <span x-show="!regeneratingSummary" class="flex items-center gap-1">
                                        <svg class="w-3 h-3"><use href="#icon-refresh"/></svg>
                                        <span x-text="t('modal.regenerate')"></span>
                                    </span>
                                    <span x-show="regeneratingSummary" class="flex items-center gap-1">
                                        <svg class="animate-spin h-3 w-3"><use href="#icon-spinner"/></svg>
                                        <span x-text="t('modal.generating')"></span>
                                    </span>
                                </button>
                            </div>
                        </div>
                        <div class="flex-1 overflow-y-auto p-4 md:p-6 scrollbar-thin bg-blue-50 dark:bg-slate-800">
                            <!-- Resumo disponivel -->
                            <template x-if="currentPost.summary_status === 'ready' && currentPost.summary_pt">
                                <div>
                                    <div class="text-gray-800 dark:text-gray-100 leading-relaxed summary-content" x-html="renderMarkdown(currentPost.summary_pt)"></div>
                                    <template x-if="currentPost.tags && currentPost.tags.length > 0">
                                        <div class="mt-3 flex flex-wrap gap-1">
                                            <template x-for="tag in currentPost.tags" :key="tag">
                                                <span class="text-xs cursor-pointer px-1.5 py-0.5 rounded-full border transition-colors"
                                                    :class="isTagIgnored(tag)
                                                        ? 'line-through text-gray-400 border-gray-300 dark:border-gray-600 bg-gray-100 dark:bg-gray-800'
                                                        : isTagMatched(tag, currentPost.matched_tags)
                                                            ? 'font-bold text-purple-700 dark:text-purple-300 border-purple-300 dark:border-purple-600 bg-purple-50 dark:bg-purple-900/30'
                                                            : 'text-gray-500 dark:text-gray-400 border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700'"
                                                    :data-tip="isTagIgnored(tag) ? t('tags.ignoredTooltip') :
                                                        isTagMatched(tag, currentPost.matched_tags)
                                                            ? t('tags.profileTooltip') : t('tags.neutralTooltip')"
                                                    @click.stop="toggleTagIgnored(tag)"
                                                    x-text="tag"
                                                ></span>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            <!-- Gerando resumo -->
                            <template x-if="currentPost.summary_status === 'pending'">
                                <div class="text-gray-500 dark:text-gray-300">
                                    <p class="italic mb-4" x-text="t('modal.noSummary')"></p>
                                    <button @click="regenerateSummary()" class="mt-2 px-3 py-1 bg-blue-600 hover:bg-blue-700 rounded text-white text-sm" :disabled="regeneratingSummary" x-text="t('modal.tryGenerate')"></button>
                                </div>
                            </template>
                            <!-- Aguardando na fila -->
                            <template x-if="currentPost.summary_status === 'queued'">
                                <div class="text-gray-500 dark:text-gray-300">
                                    <p class="italic mb-4" x-text="t('modal.summaryQueued')"></p>
                                    <button
                                        @click="regenerateSummary()"
                                        class="mt-2 px-3 py-1 bg-blue-600 hover:bg-blue-700 rounded text-white text-sm"
                                        :disabled="regeneratingSummary"
                                    >
                                        <span x-show="!regeneratingSummary" x-text="t('modal.tryGenerate')"></span>
                                        <span x-show="regeneratingSummary" x-text="t('modal.generating')"></span>
                                    </button>
                                </div>
                            </template>
                            <!-- Sem resumo disponivel -->
                            <template x-if="!currentPost.summary_pt && currentPost.summary_status !== 'pending' && currentPost.summary_status !== 'queued'">
                                <div class="text-gray-500 dark:text-gray-300">
                                    <p class="italic mb-4" x-text="t('modal.generateFailed')"></p>
                                    <p class="text-sm" x-text="t('modal.antiBotReasons')"></p>
                                    <ul class="text-sm mt-2 list-disc list-inside space-y-1">
                                        <li x-text="t('modal.antiBotReason1')"></li>
                                        <li x-text="t('modal.antiBotReason2')"></li>
                                        <li x-text="t('modal.antiBot')"></li>
                                    </ul>
                                    <button
                                        @click="regenerateSummary()"
                                        class="mt-4 px-3 py-1 bg-blue-600 hover:bg-blue-700 rounded text-white text-sm"
                                        :disabled="regeneratingSummary"
                                    >
                                        <span x-show="!regeneratingSummary" x-text="t('modal.tryGenerate')"></span>
                                        <span x-show="regeneratingSummary" x-text="t('modal.generating')"></span>
                                    </button>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- Modal Footer - hidden on mobile -->
                <div class="hidden md:flex p-2 border-t border-gray-200 dark:border-gray-700 text-xs text-gray-500 justify-between bg-gray-50 dark:bg-gray-800 flex-shrink-0">
                    <span x-text="t('modal.shortcuts')"></span>
                    <span x-text="t('modal.starShortcut')"></span>
                    <span x-text="t('modal.navShortcuts')"></span>
                </div>
            </div>
