            <div
                class="mx-2 mb-2 rounded-b-[16px] shadow-md bg-[var(--md-surface)] overflow-hidden"
                @click.stop
            >
                <!-- Action row -->
                <div class="p-3 border-b border-[var(--md-outline-variant)] flex items-center justify-end gap-1 flex-wrap bg-[var(--md-surface-container-lowest)]">
                    <!-- Star button -->
                    <button
                        @click="toggleStar(currentPost)"
                        class="p-1.5 rounded-full hover:bg-[var(--md-surface-container-highest)] transition-colors"
                        :data-tip="currentPost.is_starred ? t('modal.unstarPost') : t('modal.starPost')"
                        :aria-label="currentPost.is_starred ? t('modal.unstarPost') : t('modal.starPost')"
                    >
                        <span class="msym text-[16px]" :class="currentPost.is_starred ? 'msym-fill text-yellow-500' : 'text-gray-400 hover:text-yellow-400'">star</span>
                    </button>
                    <!-- Like button -->
                    <button
                        @click="toggleLike(currentPost)"
                        class="p-1.5 rounded-full hover:bg-[var(--md-surface-container-highest)] transition-colors"
                        :data-tip="currentPost.is_liked ? t('modal.unlikePost') : t('modal.likePost')"
                        :aria-label="currentPost.is_liked ? t('modal.unlikePost') : t('modal.likePost')"
                    >
                        <span class="msym text-[16px]" :class="currentPost.is_liked ? 'msym-fill text-teal-500' : 'text-gray-400 hover:text-teal-400'">favorite</span>
                    </button>
                    <!-- Keep unread button -->
                    <button
                        @click="toggleKeepUnread(currentPost)"
                        class="p-1.5 rounded-full hover:bg-[var(--md-surface-container-highest)] transition-colors"
                        :data-tip="currentPost.keep_unread ? t('keepUnread.unlock') : t('keepUnread.lock')"
                        :aria-label="currentPost.keep_unread ? t('keepUnread.unlock') : t('keepUnread.lock')"
                    >
                        <span class="msym text-[16px]" :class="currentPost.keep_unread ? 'msym-fill text-blue-600 dark:text-blue-400' : 'text-gray-400 hover:text-blue-400'">lock</span>
                    </button>
                    <!-- Sparkle Assistant Button: the one filled-primary CTA in this row,
                         per the handoff's button component rule (one primary action per
                         section) — mockup 2c/2d show it filled, not a soft chip. -->
                    <button
                        @click="openAssistant()"
                        class="p-1.5 md:px-3 md:py-1 rounded-full bg-[var(--md-primary)] hover:opacity-90 text-[var(--md-on-primary)] flex items-center gap-1 transition-opacity"
                        :data-tip="t('modal.assistantTitle') + ' (I)'"
                        :aria-label="t('modal.assistantTitle')"
                    >
                        <span class="msym text-[16px]">auto_awesome</span>
                        <span class="hidden md:inline text-sm" x-text="t('modal.assistantTitle')"></span>
                    </button>
                    <!-- Read/Unread button - icon only on mobile -->
                    <button
                        @click="toggleRead(currentPost)"
                        class="p-1.5 md:px-3 md:py-1 rounded-full"
                        :class="currentPost.is_read ? 'bg-[var(--md-surface-container-highest)] text-[var(--md-on-surface-variant)] hover:opacity-80' : 'bg-[var(--md-primary)] text-[var(--md-on-primary)] hover:opacity-90'"
                        :data-tip="currentPost.is_read ? t('modal.unread') : t('modal.read')"
                        :aria-label="currentPost.is_read ? t('modal.unread') : t('modal.read')"
                    >
                        <span class="msym text-[16px] md:hidden">check</span>
                        <span class="hidden md:inline text-sm" x-text="currentPost.is_read ? t('modal.unread') : t('modal.read')"></span>
                    </button>
                    <!-- Original link - icon only on mobile -->
                    <a
                        :href="currentPost.url"
                        target="_blank"
                        class="p-1.5 md:px-3 md:py-1 rounded-full border border-[var(--md-outline)] text-[var(--md-primary)] hover:bg-[var(--md-primary-container)]"
                        :data-tip="t('modal.original')"
                        :aria-label="t('modal.original')"
                    >
                        <span class="msym text-[16px] md:hidden">open_in_new</span>
                        <span class="hidden md:inline text-sm" x-text="t('modal.original')"></span>
                    </a>
                    <button
                        @click="exportPostAsMarkdown()"
                        class="hidden md:inline-flex items-center gap-1 px-3 py-1 rounded-full border border-[var(--md-outline)] text-[var(--md-primary)] hover:bg-[var(--md-primary-container)]"
                        :data-tip="t('modal.exportMarkdown')"
                        :aria-label="t('modal.exportMarkdown')"
                    >
                        <span class="msym text-[16px]">download</span>
                        <span class="text-sm" x-text="t('modal.exportMarkdown')"></span>
                    </button>
                    <!-- No close button by design: clicking the post's own row closes it
                         (togglePostInline), and on desktop so does ESC, which the shortcut
                         hints footer spells out while a post is open. A × here was a third
                         way to do the same thing, in the row with the least room to
                         spare. -->
                </div>

                <!-- AI Summary (first). Marked as AI-generated with a neutral surface
                     fill plus a --md-primary accent (left border, icon, heading) instead
                     of a full tonal fill — a full-bleed --md-primary-container behind a
                     long reading block reads as an alert banner rather than content, and
                     that effect gets worse in dark mode where the container tone has to
                     contrast against a near-black surface. Small controls inside it use a
                     black/white "state layer" overlay instead of a token color, since
                     --md-* tokens are plain hex and don't support Tailwind's /opacity
                     modifier. -->
                <div class="bg-[var(--md-surface-container-low)] border-l-4 border-[var(--md-primary)]">
                    <!-- On a phone this row has ~330px of content to fit in ~328px: the
                         heading plus three labelled buttons, one of them "Regenerar
                         (Shift+R)". The labels drop below md, the same way the action row
                         above already does it — the shortcut hint is meaningless on a
                         phone anyway, and every button keeps its aria-label. -->
                    <div class="px-4 py-2 flex items-center justify-between gap-2 min-h-[42px]">
                        <h3 class="text-sm font-medium text-[var(--md-primary)] truncate flex items-center gap-1.5">
                            <span class="msym text-[16px]">auto_awesome</span>
                            <span x-text="t('modal.aiSummary')"></span>
                        </h3>
                        <div class="flex items-center gap-1 flex-shrink-0">
                            <!-- Copy summary -->
                            <button
                                @click="copySummaryToClipboard()"
                                class="text-xs px-2 py-1 rounded-full transition-colors bg-black/5 hover:bg-black/10 dark:bg-white/10 dark:hover:bg-white/20 text-[var(--md-on-surface-variant)] disabled:opacity-40 disabled:cursor-not-allowed"
                                :disabled="!currentPost || !currentPost.summary_pt"
                                :data-tip="t('modal.copySummary')"
                                :aria-label="t('modal.copySummary')"
                            >
                                <span class="flex items-center gap-1">
                                    <span class="msym text-[12px]">content_copy</span>
                                    <span class="hidden md:inline" x-text="t('modal.copySummary').split(' (')[0]"></span>
                                </span>
                            </button>
                            <button
                                @click="toggleSkipSummary()"
                                class="text-xs px-2 py-1 rounded-full transition-colors"
                                :class="currentPost.skip_summary ? 'bg-[var(--md-error-container)] text-[var(--md-on-error-container)]' : 'bg-black/5 hover:bg-black/10 dark:bg-white/10 dark:hover:bg-white/20 text-[var(--md-on-surface-variant)]'"
                                :data-tip="currentPost.skip_summary ? t('modal.skipSummaryActiveTooltip') : t('modal.skipSummaryTooltip')"
                                :aria-label="currentPost.skip_summary ? t('modal.skipSummaryActive') : t('modal.skipSummary')"
                            >
                                <span class="flex items-center gap-1">
                                    <span class="msym text-[12px]">block</span>
                                    <span class="hidden md:inline" x-text="currentPost.skip_summary ? t('modal.skipSummaryActive') : t('modal.skipSummary')"></span>
                                </span>
                            </button>
                            <button
                                @click="regenerateSummary()"
                                class="text-xs px-2 py-1 rounded-full transition-colors"
                                :class="regeneratingSummary ? 'opacity-50 cursor-wait bg-black/5 dark:bg-white/10 text-[var(--md-on-surface-variant)]' : 'bg-black/5 hover:bg-black/10 dark:bg-white/10 dark:hover:bg-white/20 text-[var(--md-on-surface-variant)]'"
                                :disabled="regeneratingSummary"
                                :data-tip="t('modal.regenerate')"
                                :aria-label="t('modal.regenerate')"
                            >
                                <span x-show="!regeneratingSummary" class="flex items-center gap-1">
                                    <span class="msym text-[12px]">refresh</span>
                                    <span class="hidden md:inline" x-text="t('modal.regenerate')"></span>
                                </span>
                                <span x-show="regeneratingSummary" class="flex items-center gap-1">
                                    <span class="msym text-[12px] animate-spin">progress_activity</span>
                                    <span class="hidden md:inline" x-text="t('modal.generating')"></span>
                                </span>
                            </button>
                        </div>
                    </div>
                    <div class="p-4 md:p-6 scrollbar-thin">
                        <!-- Resumo disponivel -->
                        <template x-if="currentPost.summary_status === 'ready' && currentPost.summary_pt">
                            <div>
                                <div class="text-[var(--md-on-surface)] leading-relaxed summary-content" x-html="renderMarkdown(currentPost.summary_pt)"></div>
                                <template x-if="currentPost.tags && currentPost.tags.length > 0">
                                    <div class="mt-3 flex flex-wrap gap-1">
                                        <template x-for="tag in currentPost.tags" :key="tag">
                                            <span class="text-xs cursor-pointer px-1.5 py-0.5 rounded-full transition-colors"
                                                :class="isTagIgnored(tag)
                                                    ? 'line-through opacity-60 bg-black/10 dark:bg-white/10 text-[var(--md-on-surface)]'
                                                    : isTagMatched(tag, currentPost.matched_tags)
                                                        ? 'font-bold bg-[var(--md-primary)] text-[var(--md-on-primary)]'
                                                        : 'bg-black/10 dark:bg-white/15 text-[var(--md-on-surface)] hover:bg-black/20 dark:hover:bg-white/25'"
                                                :data-tip="isTagIgnored(tag) ? t('tags.ignoredTooltip') :
                                                    isTagMatched(tag, currentPost.matched_tags)
                                                        ? t('tags.profileTooltip') : t('tags.neutralTooltip')"
                                                @click.stop="toggleTagIgnored(tag)"
                                                x-text="tag"
                                            ></span>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <!-- Gerando resumo -->
                        <template x-if="currentPost.summary_status === 'pending'">
                            <div class="text-[var(--md-on-surface)]">
                                <p class="italic mb-4 opacity-80" x-text="t('modal.noSummary')"></p>
                                <button @click="regenerateSummary()" class="mt-2 px-3 py-1 rounded-full bg-[var(--md-primary)] text-[var(--md-on-primary)] hover:opacity-90 text-sm" :disabled="regeneratingSummary" x-text="t('modal.tryGenerate')"></button>
                            </div>
                        </template>
                        <!-- Aguardando na fila -->
                        <template x-if="currentPost.summary_status === 'queued'">
                            <div class="text-[var(--md-on-surface)]">
                                <p class="italic mb-4 opacity-80" x-text="t('modal.summaryQueued')"></p>
                                <button
                                    @click="regenerateSummary()"
                                    class="mt-2 px-3 py-1 rounded-full bg-[var(--md-primary)] text-[var(--md-on-primary)] hover:opacity-90 text-sm"
                                    :disabled="regeneratingSummary"
                                >
                                    <span x-show="!regeneratingSummary" x-text="t('modal.tryGenerate')"></span>
                                    <span x-show="regeneratingSummary" x-text="t('modal.generating')"></span>
                                </button>
                            </div>
                        </template>
                        <!-- Sem resumo disponivel -->
                        <template x-if="!currentPost.summary_pt && currentPost.summary_status !== 'pending' && currentPost.summary_status !== 'queued'">
                            <div class="text-[var(--md-on-surface)]">
                                <p class="italic mb-4 opacity-80" x-text="t('modal.generateFailed')"></p>
                                <p class="text-sm opacity-80" x-text="t('modal.antiBotReasons')"></p>
                                <ul class="text-sm mt-2 list-disc list-inside space-y-1 opacity-80">
                                    <li x-text="t('modal.antiBotReason1')"></li>
                                    <li x-text="t('modal.antiBotReason2')"></li>
                                    <li x-text="t('modal.antiBot')"></li>
                                </ul>
                                <button
                                    @click="regenerateSummary()"
                                    class="mt-4 px-3 py-1 rounded-full bg-[var(--md-primary)] text-[var(--md-on-primary)] hover:opacity-90 text-sm"
                                    :disabled="regeneratingSummary"
                                >
                                    <span x-show="!regeneratingSummary" x-text="t('modal.tryGenerate')"></span>
                                    <span x-show="regeneratingSummary" x-text="t('modal.generating')"></span>
                                </button>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Original content (below the summary) -->
                <div class="border-t border-[var(--md-outline-variant)]">
                    <div class="px-4 py-2 bg-[var(--md-surface-container-low)] border-b border-[var(--md-outline-variant)] flex items-center min-h-[42px]">
                        <h3 class="text-sm font-medium text-[var(--md-on-surface-variant)]" x-text="t('modal.originalContent')"></h3>
                    </div>
                    <div class="p-4 md:p-6 bg-[var(--md-surface)]">
                        <template x-if="loadingContent">
                            <div class="text-center text-[var(--md-on-surface-variant)] py-8" x-text="t('app.loading')"></div>
                        </template>
                        <template x-if="!loadingContent">
                            <div
                                class="post-content text-[var(--md-on-surface)]"
                                x-html="currentPost.full_content || currentPost.content || t('modal.noContent')"
                            ></div>
                        </template>
                    </div>
                </div>
            </div>
