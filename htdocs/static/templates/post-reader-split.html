                                <div class="flex-1 flex flex-col overflow-hidden">
                                    <!-- Compact header -->
                                    <div class="p-3 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between bg-white dark:bg-gray-800 flex-shrink-0 gap-2">
                                        <div class="flex-1 min-w-0">
                                            <h2 class="font-bold truncate" x-text="currentPost.title"></h2>
                                            <template x-if="currentPost.translated_title">
                                                <p class="text-sm text-gray-600 dark:text-gray-400 italic truncate" x-text="currentPost.translated_title"></p>
                                            </template>
                                            <div class="text-xs text-gray-500 dark:text-gray-400 flex items-center gap-2 mt-1">
                                                <span x-text="getFeedTitle(currentPost.feed_id)"></span>
                                                <span>|</span>
                                                <span x-text="formatDate(currentPost.published_at || currentPost.fetched_at)"></span>
                                            </div>
                                        </div>
                                        <!-- Action buttons -->
                                        <div class="flex items-center gap-1 flex-shrink-0">
                                            <!-- Nav buttons -->
                                            <button @click="prevPost()" :disabled="!canGoPrev()" class="p-1.5 rounded hover:bg-gray-200 dark:hover:bg-gray-700 disabled:opacity-30" :data-tip="t('modal.prevPost')" :aria-label="t('modal.prevPost')">
                                                <svg class="w-4 h-4"><use href="#icon-chevron-left"/></svg>
                                            </button>
                                            <button @click="nextPost()" :disabled="!canGoNext()" class="p-1.5 rounded hover:bg-gray-200 dark:hover:bg-gray-700 disabled:opacity-30" :data-tip="t('modal.nextPost')" :aria-label="t('modal.nextPost')">
                                                <svg class="w-4 h-4"><use href="#icon-chevron-right"/></svg>
                                            </button>
                                            <!-- Star -->
                                            <button @click="toggleStar(currentPost)" class="p-1.5 rounded hover:bg-gray-200 dark:hover:bg-gray-700" :data-tip="currentPost.is_starred ? t('modal.unstarPost') : t('modal.starPost')" :aria-label="currentPost.is_starred ? t('modal.unstarPost') : t('modal.starPost')">
                                                <svg class="w-4 h-4" :class="currentPost.is_starred ? 'text-yellow-500' : 'text-gray-400'" fill="currentColor" viewBox="0 0 20 20"><use href="#icon-star"/></svg>
                                            </button>
                                            <!-- Like -->
                                            <button @click="toggleLike(currentPost)" class="p-1.5 rounded hover:bg-gray-200 dark:hover:bg-gray-700" :data-tip="currentPost.is_liked ? t('modal.unlikePost') : t('modal.likePost')" :aria-label="currentPost.is_liked ? t('modal.unlikePost') : t('modal.likePost')">
                                                <svg class="w-4 h-4" :class="currentPost.is_liked ? 'text-red-500' : 'text-gray-400'" fill="currentColor" viewBox="0 0 20 20"><use href="#icon-heart"/></svg>
                                            </button>
                                            <!-- Keep unread -->
                                            <button @click="toggleKeepUnread(currentPost)" class="p-1.5 rounded hover:bg-gray-200 dark:hover:bg-gray-700" :data-tip="currentPost.keep_unread ? t('keepUnread.unlock') : t('keepUnread.lock')" :aria-label="currentPost.keep_unread ? t('keepUnread.unlock') : t('keepUnread.lock')">
                                                <svg class="w-4 h-4" :class="currentPost.keep_unread ? 'text-blue-600 dark:text-blue-400' : 'text-gray-400'" :fill="currentPost.keep_unread ? 'currentColor' : 'none'" :stroke="currentPost.keep_unread ? 'none' : 'currentColor'" :stroke-width="currentPost.keep_unread ? '0' : '1.5'" viewBox="0 0 24 24"><use href="#icon-lock"/></svg>
                                            </button>
                                            <!-- Read/Unread -->
                                            <button @click="toggleRead(currentPost)" class="p-1.5 rounded" :class="currentPost.is_read ? 'bg-gray-200 dark:bg-gray-700' : 'bg-blue-600 text-white'" :data-tip="currentPost.is_read ? t('modal.markUnread') : t('modal.markRead')" :aria-label="currentPost.is_read ? t('modal.markUnread') : t('modal.markRead')">
                                                <svg class="w-4 h-4"><use href="#icon-check"/></svg>
                                            </button>
                                            <!-- Original link -->
                                            <a :href="currentPost.url" target="_blank" class="p-1.5 rounded hover:bg-gray-200 dark:hover:bg-gray-700" :data-tip="t('modal.original')" :aria-label="t('modal.original')">
                                                <svg class="w-4 h-4"><use href="#icon-external-link"/></svg>
                                            </a>
                                            <!-- Export -->
                                            <button @click="exportPostAsMarkdown()" class="p-1.5 rounded hover:bg-gray-200 dark:hover:bg-gray-700" :data-tip="t('modal.exportMarkdown')" :aria-label="t('modal.exportMarkdown')">
                                                <svg class="w-4 h-4"><use href="#icon-download"/></svg>
                                            </button>
                                            <!-- Close -->
                                            <button @click="currentPost = null" class="p-1 text-gray-500 hover:text-gray-900 dark:hover:text-white text-xl" :data-tip="t('modal.closeEsc')" :aria-label="t('modal.closeEsc')">&times;</button>
                                        </div>
                                    </div>

                                    <!-- Two Column Content -->
                                    <div class="flex-1 flex flex-row overflow-hidden min-h-0">
                                        <!-- Left: Original Content -->
                                        <div class="flex-1 flex flex-col border-r border-gray-200 dark:border-gray-700 min-h-0 overflow-hidden">
                                            <div class="px-3 py-1.5 bg-gray-50 dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 flex-shrink-0">
                                                <h3 class="text-xs font-medium text-gray-500" x-text="t('modal.originalContent')"></h3>
                                            </div>
                                            <div class="flex-1 overflow-y-auto p-4 scrollbar-thin bg-white dark:bg-gray-900">
                                                <template x-if="loadingContent">
                                                    <div class="text-center text-gray-500 py-8" x-text="t('app.loading')"></div>
                                                </template>
                                                <template x-if="!loadingContent">
                                                    <div class="post-content text-gray-800 dark:text-gray-200" x-html="currentPost.full_content || currentPost.content || t('modal.noContent')"></div>
                                                </template>
                                            </div>
                                        </div>

                                        <!-- Right: AI Summary -->
                                        <div class="w-1/3 flex flex-col bg-blue-50 dark:bg-slate-800 min-w-[280px] overflow-hidden flex-shrink-0">
                                            <div class="px-3 py-1.5 bg-blue-100 dark:bg-slate-700 border-b border-blue-200 dark:border-slate-600 flex-shrink-0 flex items-center justify-between">
                                                <h3 class="text-xs font-medium text-blue-600 dark:text-blue-300" x-text="t('modal.aiSummary')"></h3>
                                                <div class="flex items-center gap-1">
                                                    <!-- Copy summary -->
                                                    <button
                                                        @click="copySummaryToClipboard()"
                                                        class="text-xs px-2 py-0.5 rounded transition-colors bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-600 dark:text-gray-300 disabled:opacity-40 disabled:cursor-not-allowed"
                                                        :disabled="!currentPost || !currentPost.summary_pt"
                                                        :data-tip="t('modal.copySummary')"
                                                        :aria-label="t('modal.copySummary')"
                                                    >
                                                        <span class="flex items-center gap-1">
                                                            <svg class="w-3 h-3"><use href="#icon-copy"/></svg>
                                                        </span>
                                                    </button>
                                                    <button @click="toggleSkipSummary()" class="text-xs px-2 py-0.5 rounded transition-colors" :class="currentPost.skip_summary ? 'bg-red-200 dark:bg-red-900 text-red-700 dark:text-red-300' : 'bg-gray-200 dark:bg-gray-700 hover:bg-gray-300'" :data-tip="currentPost.skip_summary ? t('modal.skipSummaryActiveTooltip') : t('modal.skipSummaryTooltip')">
                                                        <span class="flex items-center gap-1">
                                                            <svg class="w-3 h-3"><use href="#icon-prohibition"/></svg>
                                                        </span>
                                                    </button>
                                                    <button @click="regenerateSummary()" class="text-xs px-2 py-0.5 rounded transition-colors" :class="regeneratingSummary ? 'bg-gray-400 cursor-wait' : 'bg-gray-200 dark:bg-gray-700 hover:bg-gray-300'" :disabled="regeneratingSummary" :data-tip="t('modal.regenerate')">
                                                        <span x-show="!regeneratingSummary" class="flex items-center gap-1">
                                                            <svg class="w-3 h-3"><use href="#icon-refresh"/></svg>
                                                        </span>
                                                        <span x-show="regeneratingSummary"><svg class="animate-spin h-3 w-3"><use href="#icon-spinner"/></svg></span>
                                                    </button>
                                                </div>
                                            </div>
                                            <div class="flex-1 overflow-y-auto p-4 scrollbar-thin">
                                                <template x-if="currentPost.summary_status === 'ready' && currentPost.summary_pt">
                                                    <div>
                                                        <div class="text-gray-800 dark:text-gray-100 leading-relaxed summary-content" x-html="renderMarkdown(currentPost.summary_pt)"></div>
                                                        <template x-if="currentPost.tags && currentPost.tags.length > 0">
                                                            <div class="mt-3 flex flex-wrap gap-1">
                                                                <template x-for="tag in currentPost.tags" :key="tag">
                                                                    <span class="text-xs cursor-pointer px-1.5 py-0.5 rounded-full border transition-colors"
                                                                        :class="isTagIgnored(tag)
                                                                            ? 'line-through text-gray-400 border-gray-300 dark:border-gray-600 bg-gray-100 dark:bg-gray-800'
                                                                            : isTagMatched(tag, currentPost.matched_tags)
                                                                                ? 'font-bold text-purple-700 dark:text-purple-300 border-purple-300 dark:border-purple-600 bg-purple-50 dark:bg-purple-900/30'
                                                                                : 'text-gray-500 dark:text-gray-400 border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700'"
                                                                        :data-tip="isTagIgnored(tag) ? t('tags.ignoredTooltip') :
                                                                            isTagMatched(tag, currentPost.matched_tags)
                                                                                ? t('tags.profileTooltip') : t('tags.neutralTooltip')"
                                                                        @click.stop="toggleTagIgnored(tag)"
                                                                        x-text="tag"
                                                                    ></span>
                                                                </template>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>
                                                <template x-if="currentPost.summary_status === 'pending'">
                                                    <div class="text-gray-500 text-sm">
                                                        <p class="italic mb-2" x-text="t('modal.noSummary')"></p>
                                                        <button @click="regenerateSummary()" class="px-2 py-1 bg-blue-600 hover:bg-blue-700 rounded text-white text-xs" :disabled="regeneratingSummary" x-text="t('modal.tryGenerate')"></button>
                                                    </div>
                                                </template>
                                                <template x-if="currentPost.summary_status === 'queued'">
                                                    <div class="text-gray-500 text-sm">
                                                        <p class="italic mb-2" x-text="t('modal.summaryQueued')"></p>
                                                        <button @click="regenerateSummary()" class="px-2 py-1 bg-blue-600 hover:bg-blue-700 rounded text-white text-xs" :disabled="regeneratingSummary" x-text="t('modal.tryGenerate')"></button>
                                                    </div>
                                                </template>
                                                <template x-if="!currentPost.summary_pt && currentPost.summary_status !== 'pending' && currentPost.summary_status !== 'queued'">
                                                    <div class="text-gray-500 text-sm">
                                                        <p class="italic mb-2" x-text="t('modal.generateFailed')"></p>
                                                        <button @click="regenerateSummary()" class="px-2 py-1 bg-blue-600 hover:bg-blue-700 rounded text-white text-xs" :disabled="regeneratingSummary" x-text="t('modal.tryGenerate')"></button>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </div>
                                </div>
