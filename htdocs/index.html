                    </div>

                    <!-- Read Status Filters -->
                    <div class="px-4 py-2 border-b border-[var(--md-outline-variant)] flex flex-wrap items-center gap-x-4 gap-y-2 text-xs">
                        <span class="font-semibold text-[var(--md-on-surface-variant)]" x-text="t('modal.assistantFilters')"></span>
                        <label class="flex items-center gap-1.5 cursor-pointer select-none">
                            <input
                                type="checkbox"
                                x-model="assistantIncludeRead"
                                class="rounded accent-[var(--md-primary)]"
                            >
                            <span class="text-[var(--md-on-surface)]" x-text="t('modal.assistantIncludeRead')"></span>
                        </label>
                        <label class="flex items-center gap-1.5 cursor-pointer select-none">
                            <input
                                type="checkbox"
                                x-model="assistantIncludeUnread"
                                class="rounded accent-[var(--md-primary)]"
                            >
                            <span class="text-[var(--md-on-surface)]" x-text="t('modal.assistantIncludeUnread')"></span>
                        </label>
                        <label class="flex items-center gap-1.5 cursor-pointer select-none">
                            <input
                                type="checkbox"
                                x-model="assistantIncludeZeroCommonTags"
                                class="rounded accent-[var(--md-primary)]"
                            >
                            <span class="text-[var(--md-on-surface)]" x-text="t('modal.assistantIncludeZeroCommonTags')"></span>
                        </label>
                        <label class="flex items-center gap-1.5 cursor-pointer select-none" :title="t('modal.assistantUseTagFallbackDesc')">
                            <input
                                type="checkbox"
                                x-model="assistantUseTagFallback"
                                class="rounded accent-[var(--md-primary)]"
                            >
                            <span class="text-[var(--md-on-surface)]" x-text="t('modal.assistantUseTagFallback')"></span>
                        </label>
                        <button
                            @click="loadRelatedPosts()"
                            :disabled="assistantLoading"
                            class="ml-auto px-3 py-1.5 rounded-full bg-[var(--md-primary)] text-[var(--md-on-primary)] hover:opacity-90 disabled:opacity-50 flex items-center gap-1 text-xs font-medium transition-colors"
                        >
                            <span x-show="assistantLoading" class="msym text-[12px] animate-spin">progress_activity</span>
                            <span x-text="t('modal.assistantSearch')"></span>
                        </button>
                    </div>

                    <!-- Body -->
                    <div class="flex-1 overflow-y-auto p-4 space-y-4">
                        <!-- Loading State -->
                        <div x-show="assistantLoading" class="flex flex-col items-center justify-center py-12 space-y-3">
                            <span class="msym text-[32px] animate-spin text-[var(--md-primary)]">progress_activity</span>
                            <span class="text-sm text-[var(--md-on-surface-variant)]" x-text="t('app.loading')"></span>
                        </div>

                        <!-- Main Content (when not loading) -->
                        <div x-show="!assistantLoading" class="space-y-4">
                            <!-- Empty State -->
                            <div x-show="relatedPosts.length === 0" class="text-center py-8 text-[var(--md-on-surface-variant)] text-sm" x-text="t('modal.noRelatedPosts')"></div>

                            <!-- List of posts (when available) -->
                            <div x-show="relatedPosts.length > 0" class="space-y-2">
                                <!-- Selection actions -->
                                <div class="flex items-center justify-between text-xs pb-2 border-b border-[var(--md-outline-variant)]">
                                    <button
                                        @click="toggleAllRelatedPosts()"
                                        class="text-[var(--md-primary)] hover:underline font-medium"
                                        x-text="selectedRelatedPosts.size === relatedPosts.length ? t('settings.tagMerge.selectNone') : t('settings.tagMerge.selectAll')"
                                    ></button>
                                    <span class="text-[var(--md-on-surface-variant)]">
                                        <span x-text="selectedRelatedPosts.size"></span> / <span x-text="relatedPosts.length"></span> <span x-text="t('posts.selected')"></span>
                                    </span>
                                </div>

                                <!-- Posts Scrollable List -->
                                <div class="max-h-[30vh] overflow-y-auto pr-1 space-y-1.5 scrollbar-thin">
                                    <template x-for="p in relatedPosts" :key="p.id">
                                        <label class="flex items-start gap-2.5 p-2 bg-[var(--md-surface-container)] hover:bg-[var(--md-primary-container)] rounded-lg cursor-pointer transition-colors">
                                            <input
                                                type="checkbox"
                                                :checked="selectedRelatedPosts.has(p.id)"
                                                @change="toggleRelatedPostSelection(p.id)"
                                                class="mt-1 rounded accent-[var(--md-primary)]"
                                            >
                                            <div class="text-xs md:text-sm font-medium text-[var(--md-on-surface)] leading-tight">
                                                <button
                                                    @click.stop="goToRelatedPost(p)"
                                                    class="text-left hover:text-[var(--md-primary)] hover:underline transition-colors"
                                                    :data-tip="t('modal.goToPost')"
                                                    x-text="p.title"
                                                ></button>
                                                <span class="text-xs text-[var(--md-on-surface-variant)] font-normal ml-1" x-text="'(' + p.feed_title + ' • ' + t('modal.commonTags').replace('{count}', p.common_tags_count) + ')'"></span>
                                            </div>
                                        </label>
                                    </template>
                                </div>

                                <!-- Action Buttons -->
                                <div class="pt-2 border-t border-[var(--md-outline-variant)] flex flex-wrap items-center justify-between gap-2">
                                    <button
                                        @click="markProcessedAsRead()"
                                        :disabled="selectedRelatedPosts.size === 0 || assistantMarkingRead"
                                        class="px-3 py-1.5 rounded-full border border-[var(--md-outline)] text-[var(--md-on-surface-variant)] hover:bg-[var(--md-surface-container-highest)] disabled:opacity-40 disabled:cursor-not-allowed text-sm flex items-center gap-1.5 transition-colors"
                                    >
                                        <span x-show="assistantMarkingRead" class="msym text-[16px] animate-spin">progress_activity</span>
                                        <span x-show="!assistantMarkingRead" class="msym text-[16px]">check</span>
                                        <span x-text="t('modal.markAsRead')"></span>
                                    </button>
                                    <button
                                        @click="processRelatedPosts()"
                                        :disabled="selectedRelatedPosts.size === 0 || assistantGenerating"
                                        class="px-4 py-2 rounded-full bg-[var(--md-primary)] hover:opacity-90 disabled:opacity-40 disabled:cursor-not-allowed text-[var(--md-on-primary)] font-medium text-sm flex items-center gap-1.5 transition-all active:scale-[0.98]"
                                    >
                                        <span x-show="assistantGenerating" class="msym text-[16px] animate-spin">progress_activity</span>
                                        <span x-show="!assistantGenerating" class="msym text-[16px]">auto_awesome</span>
                                        <span x-text="assistantGenerating ? t('modal.processing') : t('modal.process')"></span>
                                    </button>
                                </div>
                            </div>

                            <!-- LLM Response consolidated summary: same flat primary-container
                                 block + black/white state-layer buttons as the post-detail AI
                                 summary panel (step 7) — --md-* tokens don't support Tailwind's
                                 /opacity modifier, hence the black/5-white/10 overlay trick. -->
                            <div
                                x-show="assistantSummary || assistantGenerating"
                                class="mt-4 p-4 rounded-2xl bg-[var(--md-primary-container)]"
                            >
                                <div class="flex items-center justify-between mb-2">
                                    <h3 class="text-xs md:text-sm font-bold text-[var(--md-on-primary-container)] flex items-center gap-1.5">
                                        <span class="msym text-[16px]">auto_awesome</span>
                                        <span x-text="t('modal.consolidatedSummary')"></span>
                                    </h3>
                                    <div class="flex items-center gap-2" x-show="assistantSummary">
                                        <button
                                            @click="copyAssistantSummary()"
                                            class="text-xs px-2.5 py-1 rounded-full transition-colors bg-black/5 hover:bg-black/10 dark:bg-white/10 dark:hover:bg-white/20 text-[var(--md-on-primary-container)]"
                                            x-text="t('modal.copyConsolidated')"
                                        ></button>
                                    </div>
                                </div>

                                <!-- Generating Spinner State -->
                                <div x-show="assistantGenerating" class="flex flex-col items-center justify-center py-6 space-y-2">
                                    <span class="msym text-[24px] animate-spin text-[var(--md-on-primary-container)]">progress_activity</span>
                                    <span class="text-xs text-[var(--md-on-primary-container)] font-medium" x-text="t('modal.generating')"></span>
                                </div>

                                <!-- Rendered Markdown result -->
                                <div
                                    x-show="assistantSummary"
                                    class="text-xs md:text-sm text-[var(--md-on-primary-container)] leading-relaxed max-h-[30vh] overflow-y-auto pr-1 summary-content scrollbar-thin"
                                    x-html="renderMarkdown(assistantSummary || '')"
                                ></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- Settings Modal -->
        <template x-if="showSettings">
            <div
                class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4"
                @click.self="closeSettings()"
                @keydown.escape.window="closeSettings()"
            >
                <!-- Settings shell (M3 redesign step 11, docs/specs/MATERIAL3_REDESIGN_PLAN.md —
                     2f: a left nav rail replaces the old horizontal tab strip on desktop; the
                     same nav collapses into a horizontal scrollable pill row on narrow
                     viewports rather than a second, mobile-only markup block. 28px dialog
                     radius and surface-container-high fill match the confirm modal (step 8). -->
                <div
                    class="bg-[var(--md-surface-container-high)] rounded-[28px] shadow-xl w-full max-w-4xl min-w-0 h-[90vh] md:h-[80vh] flex flex-col"
                    role="dialog"
                    aria-modal="true"
                    aria-labelledby="settings-dialog-title"
                >
                    <!-- Header -->
                    <div class="p-4 border-b border-[var(--md-outline-variant)] flex items-center justify-between flex-none">
                        <h2 id="settings-dialog-title" class="text-lg font-bold text-[var(--md-on-surface)]" x-text="t('settings.title')"></h2>
                        <button @click="closeSettings()" class="text-[var(--md-on-surface-variant)] hover:text-[var(--md-on-surface)]" :aria-label="t('settings.close')">
                            <span class="msym text-[24px]">close</span>
                        </button>
                    </div>

                    <!-- Nav rail + content -->
                    <div class="flex flex-col md:flex-row flex-1 min-h-0 min-w-0">
                        <!-- Nav rail: horizontal pill row on mobile, vertical rail on md+. min-w-0 keeps
                             the row's own intrinsic (unwrapped) width from forcing the whole dialog
                             wider than the screen — without it, a flex item's default min-width:auto
                             defeats overflow-x-auto and the row just bleeds past the viewport instead
                             of scrolling within itself. -->
                        <nav class="flex md:flex-col gap-1 overflow-x-auto md:overflow-visible p-2 md:p-3 md:w-[200px] md:flex-none min-w-0 border-b md:border-b-0 md:border-r border-[var(--md-outline-variant)]">
                            <button
                                @click="settingsTab = 'categories'"
                                class="flex items-center gap-2 px-3 py-2 rounded-[24px] text-sm whitespace-nowrap"
                                :class="settingsTab === 'categories' ? 'bg-[var(--md-secondary-container)] text-[var(--md-on-secondary-container)] font-medium' : 'text-[var(--md-on-surface-variant)] hover:bg-[var(--md-surface-container-highest)]'"
                            >
                                <span class="msym text-[18px]">folder</span>
                                <span x-text="t('settings.tabs.categories')"></span>
                            </button>
                            <button
                                @click="settingsTab = 'feeds'"
                                class="flex items-center gap-2 px-3 py-2 rounded-[24px] text-sm whitespace-nowrap"
                                :class="settingsTab === 'feeds' ? 'bg-[var(--md-secondary-container)] text-[var(--md-on-secondary-container)] font-medium' : 'text-[var(--md-on-surface-variant)] hover:bg-[var(--md-surface-container-highest)]'"
                            >
                                <span class="msym text-[18px]">rss_feed</span>
                                <span x-text="t('settings.tabs.feeds')"></span>
                            </button>
                            <button
                                @click="settingsTab = 'opml'"
                                class="flex items-center gap-2 px-3 py-2 rounded-[24px] text-sm whitespace-nowrap"
                                :class="settingsTab === 'opml' ? 'bg-[var(--md-secondary-container)] text-[var(--md-on-secondary-container)] font-medium' : 'text-[var(--md-on-surface-variant)] hover:bg-[var(--md-surface-container-highest)]'"
                            >
                                <span class="msym text-[18px]">import_export</span>
                                <span x-text="t('settings.tabs.opml')"></span>
                            </button>
                            <button
                                @click="settingsTab = 'ai'"
                                class="flex items-center gap-2 px-3 py-2 rounded-[24px] text-sm whitespace-nowrap"
                                :class="settingsTab === 'ai' ? 'bg-[var(--md-secondary-container)] text-[var(--md-on-secondary-container)] font-medium' : 'text-[var(--md-on-surface-variant)] hover:bg-[var(--md-surface-container-highest)]'"
                            >
                                <span class="msym text-[18px]">auto_awesome</span>
                                <span x-text="t('settings.tabs.ai')"></span>
                            </button>
                            <button
                                @click="settingsTab = 'topics'; loadTopics()"
                                class="flex items-center gap-2 px-3 py-2 rounded-[24px] text-sm whitespace-nowrap"
                                :class="settingsTab === 'topics' ? 'bg-[var(--md-secondary-container)] text-[var(--md-on-secondary-container)] font-medium' : 'text-[var(--md-on-surface-variant)] hover:bg-[var(--md-surface-container-highest)]'"
                            >
                                <span class="msym text-[18px]">label</span>
                                <span x-text="t('settings.tabs.topics')"></span>
                            </button>
                            <button
                                @click="settingsTab = 'general'"
                                class="flex items-center gap-2 px-3 py-2 rounded-[24px] text-sm whitespace-nowrap"
                                :class="settingsTab === 'general' ? 'bg-[var(--md-secondary-container)] text-[var(--md-on-secondary-container)] font-medium' : 'text-[var(--md-on-surface-variant)] hover:bg-[var(--md-surface-container-highest)]'"
                            >
                                <span class="msym text-[18px]">tune</span>
                                <span x-text="t('settings.tabs.general')"></span>
                            </button>
                            <button
                                @click="settingsTab = 'status'; loadSystemStatus()"
                                class="flex items-center gap-2 px-3 py-2 rounded-[24px] text-sm whitespace-nowrap"
                                :class="settingsTab === 'status' ? 'bg-[var(--md-secondary-container)] text-[var(--md-on-secondary-container)] font-medium' : 'text-[var(--md-on-surface-variant)] hover:bg-[var(--md-surface-container-highest)]'"
                            >
                                <span class="msym text-[18px]">monitor_heart</span>
                                <span x-text="t('settings.tabs.status')"></span>
                            </button>
                        </nav>

                    <!-- Content -->
                    <div id="settings-content" class="flex-1 min-w-0 overflow-y-auto p-4"
                        @dragover="if (dragTagName) {
                            const rect = $el.getBoundingClientRect();
                            const y = $event.clientY;
                            const edge = 40;
                            if (y - rect.top < edge) $el.scrollBy(0, -8);
                            else if (rect.bottom - y < edge) $el.scrollBy(0, 8);
                        }"
                    >
                        <!-- Categories Tab -->
                        <div x-show="settingsTab === 'categories'">
                            <!-- Add Category -->
                            <form @submit.prevent="createCategory()" class="mb-4 flex gap-2">
                                <input
                                    type="text"
                                    x-model="newCategoryName"
                                    :placeholder="t('categories.newPlaceholder')"
                                    class="flex-1 min-w-0 px-3 py-2 bg-[var(--md-surface)] border border-[var(--md-outline)] rounded-lg text-[var(--md-on-surface)] focus:outline-none focus:border-[var(--md-primary)]"
                                >
                                <button
                                    type="submit"
                                    class="px-4 py-2 rounded-full bg-[var(--md-primary)] hover:opacity-90 text-[var(--md-on-primary)] font-medium transition-colors"
                                    :disabled="savingCategory || !newCategoryName.trim()"
                                >
                                    <span x-show="!savingCategory" x-text="t('categories.create')"></span>
                                    <span x-show="savingCategory">...</span>
                                </button>
                            </form>

                            <!-- Categories List -->
                            <div class="space-y-2">
                                <template x-for="category in categories" :key="category.id">
                                    <div class="bg-[var(--md-surface-container)] rounded-2xl p-3">
                                        <!-- View Mode -->
                                        <div x-show="!editingCategory || editingCategory.id !== category.id" class="flex items-center justify-between">
                                            <div class="flex items-center gap-2 min-w-0">
                                                <span class="msym text-[16px] text-[var(--md-on-surface-variant)] flex-shrink-0">folder</span>
                                                <span x-text="category.name" class="font-medium text-[var(--md-on-surface)] truncate"></span>
                                                <span class="text-[var(--md-on-surface-variant)] text-sm flex-shrink-0" x-text="'(' + feeds.filter(f => f.category_id === category.id).length + ' feeds)'"></span>
                                            </div>
                                            <div class="flex items-center gap-1 flex-shrink-0">
                                                <button
                                                    @click="startEditCategory(category)"
                                                    class="p-1.5 rounded-full hover:bg-[var(--md-surface-container-highest)] text-[var(--md-on-surface-variant)]"
                                                    :data-tip="t('categories.edit')"
                                                    :aria-label="t('categories.edit')"
                                                >
                                                    <span class="msym text-[18px]">edit</span>
                                                </button>
                                                <button
                                                    @click="deleteCategory(category)"
                                                    class="p-1.5 rounded-full hover:bg-[var(--md-error-container)] hover:text-[var(--md-on-error-container)] text-[var(--md-on-surface-variant)] transition-colors"
                                                    :data-tip="t('categories.delete')"
                                                    :aria-label="t('categories.delete')"
                                                >
                                                    <span class="msym text-[18px]">delete</span>
                                                </button>
                                            </div>
                                        </div>
                                        <!-- Edit Mode -->
                                        <template x-if="editingCategory && editingCategory.id === category.id">
                                            <div class="flex gap-2">
                                                <input
                                                    type="text"
                                                    x-model="editingCategory.name"
                                                    class="flex-1 min-w-0 px-3 py-1 bg-[var(--md-surface)] border border-[var(--md-outline)] rounded-lg text-[var(--md-on-surface)] focus:outline-none focus:border-[var(--md-primary)]"
                                                >
                                                <button
                                                    @click="saveCategory()"
                                                    class="px-3 py-1 rounded-full bg-[var(--md-primary)] hover:opacity-90 text-[var(--md-on-primary)] text-sm font-medium transition-colors"
                                                    :disabled="savingCategory"
                                                    x-text="t('categories.save')"
                                                ></button>
                                                <button
                                                    @click="cancelEditCategory()"
                                                    class="px-3 py-1 rounded-full border border-[var(--md-outline)] text-[var(--md-primary)] hover:bg-[var(--md-primary-container)] text-sm font-medium transition-colors"
                                                    x-text="t('categories.cancel')"
                                                ></button>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                                <template x-if="categories.length === 0">
                                    <div class="text-[var(--md-on-surface-variant)] text-center py-4" x-text="t('categories.noCategories')"></div>
                                </template>
                            </div>
                        </div>

                        <!-- Feeds Tab -->
                        <div x-show="settingsTab === 'feeds'">
                            <!-- Add Feed -->
                            <form @submit.prevent="createFeed()" class="mb-4 space-y-2">
                                <!-- flex-col below sm: the select's intrinsic (content-based) width and
                                     the button's min-w-[120px] don't shrink, so in one row on a narrow
                                     phone the URL input — the only flexible item — got squeezed down to
                                     almost nothing. Stacked, each control gets the full row width. -->
                                <div class="flex flex-col sm:flex-row gap-2">
                                    <input
                                        type="url"
                                        x-model="newFeed.url"
                                        :placeholder="t('feeds.urlPlaceholder')"
                                        class="w-full sm:flex-1 sm:min-w-0 px-3 py-2 bg-[var(--md-surface)] border border-[var(--md-outline)] rounded-lg text-[var(--md-on-surface)] focus:outline-none focus:border-[var(--md-primary)]"
                                    >
                                    <select
                                        x-model="newFeed.category_id"
                                        class="w-full sm:w-auto px-3 py-2 bg-[var(--md-surface)] border border-[var(--md-outline)] rounded-lg text-[var(--md-on-surface)] focus:outline-none focus:border-[var(--md-primary)]"
                                        required
                                    >
                                        <option value="" disabled selected x-text="t('feeds.selectCategory')"></option>
                                        <template x-for="cat in categories" :key="cat.id">
                                            <option :value="cat.id" x-text="cat.name"></option>
                                        </template>
                                    </select>
                                    <button
                                        type="submit"
                                        class="w-full sm:w-auto px-4 py-2 rounded-full bg-[var(--md-primary)] hover:opacity-90 text-[var(--md-on-primary)] font-medium transition-colors whitespace-nowrap sm:min-w-[120px]"
                                        :disabled="savingFeed || !newFeed.url.trim() || !newFeed.category_id"
                                    >
                                        <span x-show="!savingFeed" x-text="t('feeds.add')"></span>
                                        <span x-show="savingFeed" x-text="t('feeds.adding')"></span>
                                    </button>
                                </div>
                            </form>

                            <!-- Feeds List -->
                            <div class="space-y-2">
                                <template x-for="feed in feeds" :key="feed.id">
                                    <div class="bg-[var(--md-surface-container)] rounded-2xl p-3">
                                        <!-- View Mode -->
                                        <div x-show="!editingFeed || editingFeed.id !== feed.id">
                                            <div class="flex items-start justify-between">
                                                <div class="flex-1 min-w-0">
                                                    <div class="flex items-center gap-2">
                                                        <span class="msym text-[12px] text-[var(--md-on-surface-variant)] flex-shrink-0">rss_feed</span>
                                                        <span x-text="feed.title" class="font-medium text-[var(--md-on-surface)] truncate"></span>
                                                        <span x-show="feed.error_count > 0" class="text-[var(--md-error)] text-xs flex-shrink-0" :data-tip="feed.last_error || t('sidebar.feedError')">!</span>
                                                    </div>
                                                    <div class="text-sm text-[var(--md-on-surface-variant)] truncate mt-1" x-text="feed.url"></div>
                                                    <div class="text-xs text-[var(--md-on-surface-variant)] mt-1">
                                                        <span x-text="categories.find(c => c.id === feed.category_id)?.name || t('sidebar.noCategory')"></span>
                                                        <span> | </span>
                                                        <span x-text="feed.unread_count + ' ' + t('feeds.unreadCount')"></span>
                                                    </div>
                                                </div>
                                                <div class="flex items-center gap-1 ml-2 flex-shrink-0">
                                                    <button
                                                        @click="startEditFeed(feed)"
                                                        class="p-1.5 rounded-full hover:bg-[var(--md-surface-container-highest)] text-[var(--md-on-surface-variant)]"
                                                        :data-tip="t('feeds.edit')"
                                                        :aria-label="t('feeds.edit')"
                                                    >
                                                        <span class="msym text-[18px]">edit</span>
                                                    </button>
                                                    <button
                                                        x-show="!feed.starred_count"
                                                        @click="deleteFeed(feed)"
                                                        class="p-1.5 rounded-full hover:bg-[var(--md-error-container)] hover:text-[var(--md-on-error-container)] text-[var(--md-on-surface-variant)] transition-colors"
                                                        :data-tip="t('feeds.delete')"
                                                        :aria-label="t('feeds.delete')"
                                                    >
                                                        <span class="msym text-[18px]">delete</span>
                                                    </button>
                                                    <span
                                                        x-show="feed.starred_count > 0"
                                                        class="text-amber-500 dark:text-amber-400"
                                                        :data-tip="t('feeds.hasStarredPosts')"
                                                    >&#9733;</span>
                                                </div>
                                            </div>
                                        </div>
                                        <!-- Edit Mode -->
                                        <template x-if="editingFeed && editingFeed.id === feed.id">
                                            <div class="space-y-2">
                                                <input
                                                    type="url"
                                                    x-model="editingFeed.url"
                                                    :placeholder="t('feeds.urlPlaceholder')"
                                                    class="w-full px-3 py-1 bg-[var(--md-surface)] border border-[var(--md-outline)] rounded-lg text-[var(--md-on-surface)] focus:outline-none focus:border-[var(--md-primary)] font-mono text-sm"
                                                >
                                                <input
                                                    type="text"
                                                    x-model="editingFeed.title"
                                                    :placeholder="t('feeds.titlePlaceholder')"

                                    class="px-4 py-2 rounded-full border border-[var(--md-outline)] text-[var(--md-primary)] hover:bg-[var(--md-primary-container)] font-medium transition-colors"
