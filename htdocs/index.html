<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risos</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20260913l">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png?v=20260913l">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16.png?v=20260913l">

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png?v=20260913l">

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json?v=20260913l">
    <meta name="theme-color" content="#2563eb">

    <!-- iOS meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Risos">

    <script>
        // Suppress Tailwind CDN production warning
        const origWarn = console.warn;
        console.warn = (...args) => {
            if (args[0]?.includes?.('cdn.tailwindcss.com')) return;
            origWarn.apply(console, args);
        };
        // Apply theme before page renders to prevent flash
        (function() {
            const stored = localStorage.getItem('rss_theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = stored || (prefersDark ? 'dark' : 'light');
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    // Material 3 redesign step 1 (docs/specs/MATERIAL3_REDESIGN_PLAN.md):
                    // Roboto everywhere per the M3 baseline — Google Sans from the
                    // design handoff is proprietary and not self-hostable.
                    fontFamily: {
                        sans: ['Roboto', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <!-- Vendored locally (not CDN) so CSP script-src can drop jsdelivr/unpkg and SRI stays meaningful -->
    <script src="/static/vendor/marked.min.js?v=20260913l"></script>
    <script src="/static/vendor/popper.min.js?v=20260913l"></script>
    <script src="/static/vendor/tippy-bundle.umd.min.js?v=20260913l"></script>
    <script src="/static/vendor/purify.min.js?v=20260913l"></script>
    <!-- App version — single source of truth. Assembler replaces 20260913l in all ?v= below -->
    <script>var APP_VERSION = '20260913l';</script>
    <link rel="stylesheet" href="/static/css/app.css?v=20260913l">

    <!-- App scripts: defer preserves execution order; declared before Alpine so stores/mixins register first -->
    <script defer src="/static/js/stores/auth.js?v=20260913l"></script>
    <script defer src="/static/js/stores/i18n.js?v=20260913l"></script>
    <script defer src="/static/js/stores/ui.js?v=20260913l"></script>
    <script defer src="/static/js/stores/prefs.js?v=20260913l"></script>
    <script defer src="/static/js/components/postDetail.js?v=20260913l"></script>
    <script defer src="/static/js/components/settings.js?v=20260913l"></script>
    <script defer src="/static/js/components/curation.js?v=20260913l"></script>
    <script defer src="/static/js/app.js?v=20260913l"></script>

    <!-- Alpine (deferred after local scripts — executes last, triggers alpine:init) -->
    <script defer src="https://unpkg.com/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Locale preload (synchronous — uses APP_VERSION var defined above) -->
    <script>
      (function() {
        var locale = localStorage.getItem('rss_locale') || 'pt-BR';
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'fetch';
        link.crossOrigin = 'anonymous';
        link.href = '/static/locales/' + locale + '.json?v=' + APP_VERSION;
        document.head.appendChild(link);
      })();
    </script>
</head>
<body class="bg-[var(--md-surface)] text-[var(--md-on-surface)] transition-colors">
    <!-- SVG Sprite Sheet — Material 3 redesign step 2 (docs/specs/MATERIAL3_REDESIGN_PLAN.md)
         replaced every generic icon with Material Symbols (.msym spans, see app.css).
         Brand logos have no Material Symbol equivalent, so icon-github stays here. -->
    <svg xmlns="http://www.w3.org/2000/svg" class="hidden">
        <symbol id="icon-github" viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.17 6.839 9.49.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.604-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.464-1.11-1.464-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.115 2.504.337 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.167 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
        </symbol>
    </svg>

    <div id="i18n-loading" class="h-screen flex items-center justify-center bg-gray-100 dark:bg-gray-900">
        <svg class="w-8 h-8 animate-spin text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
    </div>

    <div id="app-root" x-data="app()" x-init="init()" x-cloak style="display:none" class="h-screen flex flex-col">

        <!-- Health Warning Banner -->
        <div x-show="healthWarning" class="bg-yellow-600 text-yellow-100 px-4 py-2 text-sm flex items-center justify-between">
            <span x-text="healthWarning"></span>
            <button @click="healthWarning = null" class="ml-4 hover:text-white">&times;</button>
        </div>

        <!-- Login Screen -->
        <template x-if="!$store.auth.authenticated">
            <main class="flex-1 flex items-center justify-center">
                <div class="bg-[var(--md-surface-container-high)] p-8 rounded-[28px] shadow-xl w-full max-w-sm">
                    <h1 class="text-2xl font-bold mb-6 text-center" x-text="t('app.title')"></h1>
                    <form @submit.prevent="login()">
                        <div class="mb-4">
                            <label for="auth-password" class="block text-sm font-medium mb-2" x-text="t('auth.password')"></label>
                            <div class="relative" x-data="{ showPw: false }">
                                <input
                                    id="auth-password"
                                    :type="showPw ? 'text' : 'password'"
                                    x-model="password"
                                    class="w-full px-4 py-2 pr-10 bg-[var(--md-surface)] border border-[var(--md-outline)] rounded-[8px] focus:outline-none focus:ring-2 focus:ring-[var(--md-primary)]"
                                    :placeholder="t('auth.password')"
                                    autofocus
                                >
                                <button
                                    type="button"
                                    @click="showPw = !showPw"
                                    class="absolute inset-y-0 right-0 flex items-center pr-3 text-[var(--md-on-surface-variant)] hover:text-[var(--md-on-surface)]"
                                    tabindex="-1"
                                    :data-tip="showPw ? t('auth.hidePassword') : t('auth.showPassword')"
                                    :aria-label="showPw ? t('auth.hidePassword') : t('auth.showPassword')"
                                >
                                    <span x-show="!showPw" class="msym text-[20px]">visibility</span>
                                    <span x-show="showPw" class="msym text-[20px]">visibility_off</span>
                                </button>
                            </div>
                        </div>
                        <div x-show="loginError" class="mb-4 text-[var(--md-error)] text-sm" x-text="loginError"></div>
                        <button
                            type="submit"
                            class="w-full bg-[var(--md-primary)] hover:opacity-90 text-[var(--md-on-primary)] py-2 rounded-full font-medium transition"
                            :disabled="logging"
                        >
                            <span x-show="!logging" x-text="t('auth.login')"></span>
                            <span x-show="logging" x-text="t('auth.loggingIn')"></span>
                        </button>
                    </form>
                    <p class="mt-4 text-xs text-[var(--md-on-surface-variant)] text-center md:hidden" x-text="t('auth.mobileHint')"></p>
                </div>
            </main>
        </template>

        <!-- Main App -->
        <template x-if="$store.auth.authenticated">
            <div class="flex-1 flex overflow-hidden relative">

                <!-- Mobile Sidebar Overlay -->
                <div
                    x-show="sidebarOpen"
                    x-transition:enter="transition-opacity ease-out duration-300"
                    x-transition:enter-start="opacity-0"
                    x-transition:enter-end="opacity-100"
                    x-transition:leave="transition-opacity ease-in duration-200"
                    x-transition:leave-start="opacity-100"
                    x-transition:leave-end="opacity-0"
                    @click="sidebarOpen = false"
                    class="fixed inset-0 bg-black/50 z-40 md:hidden"
                ></div>

                <!-- Sidebar -->
                <aside
                    class="w-64 bg-[var(--md-surface-container-low)] flex flex-col border-r border-[var(--md-outline-variant)] fixed md:relative inset-y-0 left-0 z-50 transform transition-all duration-300 ease-in-out overflow-hidden"
                    :class="[
                        sidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0',
                        desktopSidebarOpen ? 'md:w-64' : 'md:w-0 md:border-r-0'
                    ]"
                >
                    <!-- Header -->
                    <header class="p-4 border-b border-[var(--md-outline-variant)] flex items-center justify-between">
                        <h1 class="font-bold text-lg" x-text="t('app.title')"></h1>
                        <div class="flex items-center gap-2">
                            <div class="hidden md:flex items-center gap-1">
                                <button @click="decreaseFontScale()" :disabled="fontScaleMin" class="text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full hover:bg-[var(--md-surface-container-highest)] disabled:opacity-30 disabled:cursor-not-allowed text-[var(--md-on-surface-variant)]">A-</button>
                                <button @click="increaseFontScale()" :disabled="fontScaleMax" class="text-sm font-bold w-6 h-6 flex items-center justify-center rounded-full hover:bg-[var(--md-surface-container-highest)] disabled:opacity-30 disabled:cursor-not-allowed text-[var(--md-on-surface-variant)]">A+</button>
                            </div>
                            <button @click="openSettings()" class="text-[var(--md-on-surface-variant)] hover:text-[var(--md-on-surface)]" :data-tip="t('sidebar.settings')" :aria-label="t('sidebar.settings')">
                                <span class="msym text-[20px]">settings</span>
                            </button>
                            <button @click="logout()" class="text-[var(--md-on-surface-variant)] hover:text-[var(--md-on-surface)] text-sm hidden md:block" x-text="t('app.logout')"></button>
                            <!-- Mobile close button -->
                            <button @click="sidebarOpen = false" class="md:hidden text-[var(--md-on-surface-variant)] hover:text-[var(--md-on-surface)]" :data-tip="t('sidebar.closeMenu')" :aria-label="t('sidebar.closeMenu')">
                                <span class="msym text-[24px]">close</span>
                            </button>
                        </div>
                    </header>

                    <!-- Actions -->
                    <div class="p-2 border-b border-[var(--md-outline-variant)] flex gap-2">
                        <div class="flex-1 relative" x-data="{ markOpen: false }">
                            <button
                                @click="markOpen = !markOpen"
                                class="w-full text-xs border border-[var(--md-outline)] text-[var(--md-on-surface-variant)] hover:bg-[var(--md-surface-container-highest)] px-2 py-1 rounded-full flex items-center justify-between"
                            >
                                <span x-text="t('posts.markAsRead')"></span>
                                <span class="msym text-[12px] ml-1">expand_more</span>
                            </button>
                            <div
                                x-show="markOpen"
                                @click.away="markOpen = false"
                                x-transition
                                class="absolute left-0 right-0 top-full mt-1 bg-[var(--md-surface-container)] border border-[var(--md-outline-variant)] rounded-[16px] overflow-hidden shadow-lg z-50"
                            >
                                <button
                                    @click="markAllRead(); markOpen = false"
                                    class="w-full text-left text-xs px-3 py-2 hover:bg-[var(--md-surface-container-highest)]"
                                >
                                    <span x-text="t('posts.markAllRead')"></span>
                                    <span class="hidden lg:inline opacity-60"> (A)</span>
                                </button>
                                <button
                                    @click="markAllRead(true); markOpen = false"
                                    class="w-full text-left text-xs px-3 py-2 hover:bg-[var(--md-surface-container-highest)] border-t border-[var(--md-outline-variant)]"
                                >
                                    <span x-text="t('posts.markBlockedRead')"></span>
                                    <span class="hidden lg:inline opacity-60"> (N)</span>
                                    <template x-if="blockedUnreadCount > 0">
                                        <span class="ml-1 px-1.5 py-0.5 text-[10px] bg-[var(--md-error-container)] text-[var(--md-on-error-container)] rounded-full" x-text="blockedUnreadCount"></span>
                                    </template>
                                </button>
                            </div>
                        </div>
                        <button
                            @click="refreshFeeds()"
                            class="text-xs border border-[var(--md-outline)] text-[var(--md-on-surface-variant)] hover:bg-[var(--md-surface-container-highest)] px-2 py-1 rounded-full"
                            :disabled="refreshing"
                            :data-tip="t('sidebar.refresh') + ' (R)'"
                            :aria-label="t('sidebar.refresh')"
                        >
                            <span x-show="!refreshing" class="msym text-[16px]">refresh</span>
                            <span x-show="refreshing" class="msym text-[16px] animate-spin">progress_activity</span>
                        </button>
                    </div>

                    <!-- Filters (M3 redesign step 5, docs/specs/MATERIAL3_REDESIGN_PLAN.md —
                         2a/2b: nav items are 24px-radius pills; the active state is
                         secondary-container for a plain filter, primary-container for
                         Suggested — the handoff's own "destaque IA" component rule. -->
                    <div class="p-2 border-b border-[var(--md-outline-variant)]">
                        <button
                            @click="postFilter = 'unread'; setFilter('unread')"
                            class="w-full text-left px-3 py-2 rounded-[24px] text-sm"
                            :class="filter === 'unread' && postFilter === 'unread' && !selectedTopicId ? 'bg-[var(--md-secondary-container)] text-[var(--md-on-secondary-container)]' : 'hover:bg-[var(--md-surface-container-highest)]'"
                        >
                            <span x-text="t('sidebar.unread')"></span>
                            <span
                                class="float-right"
                                :class="filter === 'unread' && postFilter === 'unread' && !selectedTopicId ? 'text-[var(--md-on-secondary-container)]' : 'text-[var(--md-on-surface-variant)]'"
                                x-text="totalUnread"
                            ></span>
                        </button>
                        <!-- Suggested posts -->
                        <div class="flex items-center gap-1">
                            <button
                                @click="postFilter = 'unread'; setFilter('suggested')"
                                class="flex-1 text-left px-3 py-2 rounded-[24px] text-sm flex items-center gap-2"
                                :class="filter === 'suggested' ? 'bg-[var(--md-primary-container)] text-[var(--md-on-primary-container)]' : 'hover:bg-[var(--md-surface-container-highest)]'"
                            >
                                <span class="msym text-[16px]" :class="filter === 'suggested' ? 'text-[var(--md-on-primary-container)]' : 'text-[var(--md-primary)]'">auto_awesome</span>
                                <span x-text="t('sidebar.suggested')"></span>
                                <span
                                    x-show="suggestedCount > 0"
                                    class="ml-auto"
                                    :class="filter === 'suggested' ? 'text-[var(--md-on-primary-container)]' : 'text-[var(--md-primary)]'"
                                    x-text="suggestedCount"
                                ></span>
                            </button>
                            <button
                                @click.stop="regenerateSuggestions()"
                                :disabled="regeneratingSuggestions"
                                class="p-1.5 rounded-full hover:bg-[var(--md-surface-container-highest)] text-[var(--md-on-surface-variant)]"
                                :data-tip="regeneratingSuggestions ? t('sidebar.regenerating') : t('sidebar.regenerateSuggestions')"
                                :aria-label="regeneratingSuggestions ? t('sidebar.regenerating') : t('sidebar.regenerateSuggestions')"
                            >
                                <span class="msym text-[16px]" :class="regeneratingSuggestions ? 'animate-spin' : ''">refresh</span>
                            </button>
                        </div>
                    </div>

                    <!-- Top Tags (collapsible, desktop only, hidden during search) -->
                    <div x-show="!searchQuery.trim()" class="hidden md:block p-2 border-b border-[var(--md-outline-variant)]">
                        <button
                            @click="toggleTopTags()"
                            class="w-full text-left px-2 py-1.5 rounded-[24px] text-sm font-medium flex items-center gap-1.5 hover:bg-[var(--md-surface-container-highest)]"
                        >
                            <span class="msym text-[12px] transition-transform duration-200" :class="topTagsExpanded ? 'rotate-90' : ''">chevron_right</span>
                            <span class="msym text-[16px] text-[var(--md-on-surface-variant)]">label</span>
                            <span x-text="t('sidebar.topTags')"></span>
                        </button>
                        <div
                            x-show="topTagsExpanded"
                            x-transition:enter="transition ease-out duration-200"
                            x-transition:enter-start="opacity-0 -translate-y-2"
                            x-transition:enter-end="opacity-100 translate-y-0"
                            x-transition:leave="transition ease-in duration-150"
                            x-transition:leave-start="opacity-100 translate-y-0"
                            x-transition:leave-end="opacity-0 -translate-y-2"
                            class="mt-1 flex flex-wrap gap-1 px-2"
                        >
                            <template x-for="item in popularTags" :key="item.tag">
                                <button
                                    @click="filterByTag(item.tag)"
                                    class="text-xs px-2 py-0.5 rounded-full border transition-colors flex items-center gap-1"
                                    :class="tagFilter === item.tag
                                        ? 'bg-[var(--md-primary)] text-[var(--md-on-primary)] border-[var(--md-primary)]'
                                        : 'text-[var(--md-on-surface-variant)] border-[var(--md-outline)] hover:bg-[var(--md-surface-container-highest)]'"
                                >
                                    <span x-text="item.tag"></span>
                                    <span class="opacity-60" x-text="item.count"></span>
                                </button>
                            </template>
                        </div>
                    </div>

                    <!-- Categories & Feeds Tree (the Topics folder shares this scroll area) -->
                    <nav id="sidebar-nav" class="flex-1 overflow-y-auto scrollbar-thin p-2">
                        <!-- Topics: a pseudo-category holding the topic list, desktop only -->
                        <div class="hidden md:block mb-1">
                            <div class="w-full text-left px-2 py-1.5 rounded-[24px] text-sm font-medium flex items-center gap-1 hover:bg-[var(--md-surface-container-highest)] transition-colors duration-150">
                                <button
                                    @click.stop="toggleTopics()"
                                    class="p-0.5 -ml-1 hover:bg-[var(--md-surface-container-high)] rounded-full transition-transform"
                                    :data-tip="t('sidebar.topics')"
                                    :aria-label="t('sidebar.topics')"
                                >
                                    <span class="msym text-[12px] transition-transform duration-200" :class="topicsExpanded ? 'rotate-90' : ''">chevron_right</span>
                                </button>
                                <span class="msym text-[16px] text-[var(--md-primary)] flex-shrink-0">folder</span>
                                <button @click="toggleTopics()" class="flex-1 truncate text-left" x-text="t('sidebar.topics')"></button>
                            </div>
                            <!-- Topics inside the folder -->
                            <div
                                x-show="topicsExpanded"
                                x-transition:enter="transition ease-out duration-200"
                                x-transition:enter-start="opacity-0 -translate-y-2"
                                x-transition:enter-end="opacity-100 translate-y-0"
                                x-transition:leave="transition ease-in duration-150"
                                x-transition:leave-start="opacity-100 translate-y-0"
                                x-transition:leave-end="opacity-0 -translate-y-2"
                                class="ml-4 border-l border-[var(--md-outline-variant)] pl-2"
                            >
                                <template x-for="topic in topics" :key="topic.id">
                                    <button
                                        @click="selectTopic(topic.id)"
                                        :data-nav-id="'topic-' + topic.id"
                                        class="w-full text-left px-2 py-1 rounded-[24px] text-sm flex items-center gap-2 transition-colors"
                                        :class="selectedTopicId === topic.id
                                            ? 'bg-[var(--md-secondary-container)] text-[var(--md-on-secondary-container)]'
                                            : 'text-[var(--md-on-surface-variant)] hover:bg-[var(--md-surface-container-highest)]'"
                                    >
                                        <span class="msym text-[12px] flex-shrink-0" :class="selectedTopicId === topic.id ? 'text-[var(--md-on-secondary-container)]' : 'text-[var(--md-primary)]'">label</span>
                                        <span class="flex-1 truncate" x-text="topic.name"></span>
                                        <span
                                            x-show="topic.unread_count > 0"
                                            class="text-xs flex-shrink-0"
                                            :class="selectedTopicId === topic.id ? 'text-[var(--md-on-secondary-container)]' : 'text-[var(--md-primary)]'"
                                            x-text="topic.unread_count"
                                        ></span>
                                    </button>
                                </template>
                                <div
                                    x-show="topicsLoaded && topics.length === 0"
                                    class="px-2 py-1 text-xs text-[var(--md-on-surface-variant)]"
                                    x-text="t('topics.empty')"
                                ></div>
                            </div>
                        </div>

                        <template x-for="category in categories" :key="category.id">
                            <div class="mb-1">
                                <!-- Category header -->
                                <div
                                    :data-nav-id="'category-' + category.id"
                                    class="w-full text-left px-2 py-1.5 rounded-[24px] text-sm font-medium flex items-center gap-1 transition-colors duration-150"
                                    :class="{
                                        'bg-[var(--md-secondary-container)] text-[var(--md-on-secondary-container)]': filter === 'category' && filterId === category.id,
                                        'hover:bg-[var(--md-surface-container-highest)]': !(filter === 'category' && filterId === category.id),
                                        'ring-2 ring-[var(--md-primary)] bg-[var(--md-primary-container)]': dragOverCategoryId === category.id
                                    }"
                                    @dragover.prevent="onCategoryDragOver($event, category.id)"
                                    @dragleave="onCategoryDragLeave($event, category.id)"
                                    @drop="onCategoryDrop($event, category.id)"
                                >
                                    <!-- Chevron toggle -->
                                    <button
                                        @click.stop="toggleCategoryCollapse(category.id)"
                                        class="p-0.5 -ml-1 hover:bg-[var(--md-surface-container-high)] rounded-full transition-transform"
                                        :data-tip="t('sidebar.toggleCategory')"
                                        :aria-label="t('sidebar.toggleCategory')"
                                    >
                                        <span class="msym text-[12px] transition-transform duration-200" :class="isCategoryCollapsed(category.id) ? '' : 'rotate-90'">chevron_right</span>
                                    </button>
                                    <!-- Folder icon -->
                                    <span class="msym text-[16px] text-[var(--md-on-surface-variant)] flex-shrink-0" :class="filter === 'category' && filterId === category.id ? 'text-[var(--md-on-secondary-container)]' : ''">folder</span>
                                    <!-- Category name (clickable to filter) -->
                                    <button
                                        @click="setFilter('category', category.id)"
                                        class="flex-1 truncate text-left"
                                        x-text="category.name"
                                    ></button>
                                    <span
                                        x-show="getCategoryUnread(category.id) > 0"
                                        class="text-xs"
                                        :class="filter === 'category' && filterId === category.id ? 'text-[var(--md-on-secondary-container)]' : 'text-[var(--md-primary)]'"
                                        x-text="getCategoryUnread(category.id)"
                                    ></span>
                                </div>
                                <!-- Feeds inside category -->
                                <div
                                    x-show="!isCategoryCollapsed(category.id)"
                                    x-transition:enter="transition ease-out duration-200"
                                    x-transition:enter-start="opacity-0 -translate-y-2"
                                    x-transition:enter-end="opacity-100 translate-y-0"
                                    x-transition:leave="transition ease-in duration-150"
                                    x-transition:leave-start="opacity-100 translate-y-0"
                                    x-transition:leave-end="opacity-0 -translate-y-2"
                                    class="ml-4 border-l border-[var(--md-outline-variant)] pl-2"
                                >
                                    <template x-for="feed in feeds.filter(f => f.category_id === category.id)" :key="feed.id">
                                        <button
                                            @click="setFilter('feed', feed.id)"
                                            :data-nav-id="'feed-' + feed.id"
                                            class="w-full text-left px-2 py-1 rounded-[24px] text-sm truncate flex items-center gap-2"
                                            :class="filter === 'feed' && filterId === feed.id ? 'bg-[var(--md-secondary-container)] text-[var(--md-on-secondary-container)]' : 'text-[var(--md-on-surface-variant)] hover:bg-[var(--md-surface-container-highest)]'"
                                            :draggable="window.innerWidth >= 1024 ? 'true' : 'false'"
                                            @dragstart="window.innerWidth >= 1024 && onFeedDragStart($event, feed.id)"
                                            @dragend="onFeedDragEnd($event)"
                                        >
                                            <span class="msym text-[12px] text-[var(--md-on-surface-variant)] flex-shrink-0">rss_feed</span>
                                            <span class="flex-1 truncate" x-text="feed.title"></span>
                                            <span
                                                x-show="feed.unread_count > 0"
                                                class="text-xs flex-shrink-0"
                                                :class="filter === 'feed' && filterId === feed.id ? 'text-[var(--md-on-secondary-container)]' : 'text-[var(--md-primary)]'"
                                                x-text="feed.unread_count"
                                            ></span>
                                            <span
                                                x-show="feed.error_count > 0"
                                                class="text-[var(--md-error)] text-xs flex-shrink-0"
                                                :data-tip="feed.last_error || t('sidebar.feedError')"
                                            >!</span>
                                        </button>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </nav>

                    <!-- Sidebar Footer -->
                    <div class="flex-shrink-0 p-3 border-t border-[var(--md-outline-variant)] flex items-center justify-between">
                        <a
                            href="https://github.com/janiosarmento/risos"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors"
                        >
                            <svg class="w-5 h-5"><use href="#icon-github"/></svg>
                            <span>Github</span>
                        </a>
                        <span class="text-xs text-gray-400 dark:text-gray-500" x-text="appVersion"></span>
                    </div>
                </aside>

                <!-- Main Content -->
                <main class="flex-1 flex flex-col overflow-hidden">
                    <!-- Post List Header -->
                    <div class="p-4 border-b border-[var(--md-outline-variant)] bg-[var(--md-surface)]">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <!-- Hamburger menu button (mobile only) -->
                                <button
                                    @click="sidebarOpen = true"
                                    class="md:hidden p-1 -ml-1 text-[var(--md-on-surface-variant)] hover:text-[var(--md-on-surface)]"
                                    :data-tip="t('sidebar.openMenu')"
                                    :aria-label="t('sidebar.openMenu')"
                                >
                                    <span class="msym text-[24px]">menu</span>
                                </button>
                                <!-- Sidebar toggle (desktop only) -->
                                <button
                                    @click="toggleDesktopSidebar()"
                                    class="hidden md:flex p-1 -ml-1 text-[var(--md-on-surface-variant)] hover:text-[var(--md-on-surface)]"
                                    :data-tip="desktopSidebarOpen ? t('sidebar.collapseMenu') : t('sidebar.openMenu')"
                                    :aria-label="desktopSidebarOpen ? t('sidebar.collapseMenu') : t('sidebar.openMenu')"
                                >
                                    <span class="msym text-[20px]" x-text="desktopSidebarOpen ? 'chevron_left' : 'chevron_right'"></span>
                                </button>
                                <h2 class="font-medium">
                                    <a
                                        x-show="filter === 'feed' && getFeedSiteUrl(filterId)"
                                        :href="getFeedSiteUrl(filterId)"
                                        x-text="getFilterTitle()"
                                        target="_blank"
                                        rel="noopener"
                                        class="hover:text-[var(--md-primary)] hover:underline"
                                    ></a>
                                    <span
                                        x-show="filter !== 'feed' || !getFeedSiteUrl(filterId)"
                                        x-text="getFilterTitle()"
                                    ></span>
                                </h2>
                                <!-- Tag filter indicator -->
                                <template x-if="tagFilter">
                                    <span class="inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full bg-[var(--md-secondary-container)] text-[var(--md-on-secondary-container)]">
                                        <span class="msym text-[12px]">label</span>
                                        <span x-text="tagFilter"></span>
                                        <span class="opacity-60" x-text="'(' + tagFilterCount + ')'"></span>
                                        <!-- Add to topic dropdown -->
                                        <span x-show="topics.length > 0" class="relative" x-data="{ open: false }">
                                            <button @click="open = !open" class="hover:opacity-70 ml-0.5" :data-tip="t('topics.addToTopic')" :aria-label="t('topics.addToTopic')">
                                                <span class="msym text-[12px]">folder</span>
                                            </button>
                                            <div x-show="open" @click.away="open = false" class="absolute top-full left-0 mt-1 bg-[var(--md-surface-container)] border border-[var(--md-outline-variant)] rounded-[16px] overflow-hidden shadow-lg z-50 min-w-[160px]">
                                                <template x-for="topic in topics" :key="topic.id">
                                                    <button
                                                        @click="addTagFilterToTopic(topic.id); open = false"
                                                        class="w-full text-left px-3 py-1.5 text-xs text-[var(--md-on-surface)] hover:bg-[var(--md-surface-container-highest)] truncate"
                                                        x-text="topic.name"
                                                    ></button>
                                                </template>
                                            </div>
                                        </span>
                                        <button @click="clearTagFilter()" class="hover:opacity-70 ml-0.5" :data-tip="t('tags.clearFilter')" :aria-label="t('tags.clearFilter')">&times;</button>
                                    </span>
                                </template>
                                <!-- Topic filter indicator -->
                                <template x-if="selectedTopicId">
                                    <span class="inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full bg-[var(--md-primary-container)] text-[var(--md-on-primary-container)]">
                                        <span class="msym text-[12px]">folder</span>
                                        <span x-text="getSelectedTopicName()"></span>
                                        <button @click="clearTopicFilter()" class="hover:opacity-70 ml-0.5" :data-tip="t('topics.clearFilter')" :aria-label="t('topics.clearFilter')">&times;</button>
                                    </span>
                                </template>
                                <!-- Refresh feed button -->
                                <button
                                    x-show="filter === 'feed'"
                                    @click="refreshFeed(filterId)"
                                    :disabled="refreshingFeed"
                                    class="p-1 text-[var(--md-on-surface-variant)] hover:text-[var(--md-primary)] disabled:opacity-50"
                                    :data-tip="t('feeds.refresh')"
                                    :aria-label="t('feeds.refresh')"
                                >
                                    <span class="msym text-[16px]" :class="refreshingFeed && 'animate-spin'">refresh</span>
                                </button>
                            </div>
                            <div class="flex items-center gap-1 md:gap-2 text-xs md:text-sm">
                                <!-- Search -->
                                <div class="relative flex items-center">
                                    <span class="msym text-[14px] absolute left-3 text-[var(--md-on-surface-variant)] pointer-events-none">search</span>
                                    <input
                                        id="search-input"
                                        type="text"
                                        x-model="searchQuery"
                                        @input="onSearchInput()"
                                        @keydown.escape="$el.blur(); clearSearch()"
                                        :placeholder="t('search.placeholder')"
                                        data-tip="/ to focus"
                                        class="w-24 md:w-40 pl-8 pr-6 py-1.5 text-xs rounded-full border border-[var(--md-outline)] bg-[var(--md-surface-container-highest)] text-[var(--md-on-surface)] focus:outline-none focus:ring-2 focus:ring-[var(--md-primary)] placeholder-[var(--md-on-surface-variant)]"
                                    />
                                    <button
                                        x-show="searchQuery"
                                        @click="clearSearch()"
                                        class="absolute right-2 text-[var(--md-on-surface-variant)] hover:text-[var(--md-on-surface)]"
                                    >&times;</button>
                                </div>
                                <span class="text-[var(--md-outline-variant)] hidden md:inline">|</span>
                                <button
                                    @click="toggleSelectMode()"
                                    class="px-2 md:px-3 py-1 rounded-full"
                                    :class="selectMode ? 'bg-[var(--md-primary)] text-[var(--md-on-primary)]' : 'text-[var(--md-on-surface-variant)] hover:bg-[var(--md-surface-container-highest)]'"
                                ><span x-text="t('posts.select')"></span><span class="hidden lg:inline opacity-60"> (X)</span></button>
                                <span class="text-[var(--md-outline-variant)] hidden md:inline">|</span>
                                <!-- Post filter: Unread -->
                                <button
                                    @click="clearCuration(); postFilter = 'unread'; loadPosts(true)"
                                    class="px-2 md:px-3 py-1 rounded-full flex items-center gap-1"
                                    :class="postFilter === 'unread' ? 'bg-[var(--md-primary)] text-[var(--md-on-primary)]' : 'text-[var(--md-on-surface-variant)] hover:bg-[var(--md-surface-container-highest)]'"
                                    :data-tip="t('sidebar.unread')"
                                    :aria-label="t('sidebar.unread')"
                                >
                                    <!-- Circle icon (unread) - mobile only -->
                                    <span class="msym text-[16px] md:hidden">circle</span>
                                    <span class="hidden md:inline" x-text="t('sidebar.unread')"></span>
                                </button>
                                <!-- Post filter: All -->
                                <button
                                    @click="clearCuration(); postFilter = 'all'; loadPosts(true)"
                                    class="px-2 md:px-3 py-1 rounded-full flex items-center gap-1"
                                    :class="postFilter === 'all' ? 'bg-[var(--md-primary)] text-[var(--md-on-primary)]' : 'text-[var(--md-on-surface-variant)] hover:bg-[var(--md-surface-container-highest)]'"
                                    :data-tip="t('sidebar.all')"
                                    :aria-label="t('sidebar.all')"
                                >
                                    <!-- List icon (all) - mobile only -->
                                    <span class="msym text-[16px] md:hidden">menu</span>
                                    <span class="hidden md:inline" x-text="t('sidebar.all')"></span>
                                </button>
                                <!-- Post filter: Starred -->
                                <button
                                    @click="postFilter = 'starred'; loadPosts(true)"
                                    class="px-2 md:px-3 py-1 rounded-full flex items-center gap-1"
                                    :class="postFilter === 'starred' ? 'bg-[var(--md-primary)] text-[var(--md-on-primary)]' : 'text-[var(--md-on-surface-variant)] hover:bg-[var(--md-surface-container-highest)]'"
                                    :data-tip="t('sidebar.starred')"
                                    :aria-label="t('sidebar.starred')"
                                >
                                    <!-- Star icon (starred) - mobile only -->
                                    <span class="msym text-[16px] md:hidden">star</span>
                                    <!-- Mobile: show count after star icon -->
                                    <span class="md:hidden" x-show="starredCount > 0" x-text="starredCount"></span>
                                    <!-- Desktop: label + count as separate elements — a trailing
                                         number, not "(N)" glued onto the label text, matching how
                                         every other count in the app reads since step 5. -->
                                    <span class="hidden md:inline" x-text="t('sidebar.starred')"></span>
                                    <span class="hidden md:inline opacity-80" x-show="starredCount > 0" x-text="starredCount"></span>
                                </button>
                                <!-- Export starred -->
                                <button
                                    x-show="starredCount > 0 && postFilter === 'starred'"
                                    @click="exportStarred()"
                                    class="px-1 py-1 text-[var(--md-on-surface-variant)] hover:text-[var(--md-on-surface)]"
                                    :data-tip="t('posts.exportStarred')"
                                    :aria-label="t('posts.exportStarred')"
                                >
                                    <span class="msym text-[16px]">download</span>
                                </button>
                                <!-- Curate button -->
                                <button
                                    x-show="starredCount > 0 && postFilter === 'starred'"
                                    @click="curatePosts()"
                                    :disabled="curatingPosts"
                                    class="px-2.5 py-1 text-xs rounded-full border border-[var(--md-outline)] text-[var(--md-primary)] hover:bg-[var(--md-primary-container)] disabled:opacity-50 hidden md:flex items-center gap-1"
                                    :data-tip="t('curation.curate')"
                                >
                                    <span x-show="curatingPosts" class="msym text-[12px] animate-spin">progress_activity</span>
                                    <span x-show="!curatingPosts" class="msym text-[12px]">auto_awesome</span>
                                    <span x-text="t('curation.curate')"></span>
                                </button>
                            </div>
                        </div>
                        <!-- Selection toolbar (M3 redesign step 18) -->
                        <div x-show="selectMode" class="mt-3 flex items-center gap-3 text-sm">
                            <button
                                @click="selectAllVisible()"
                                class="text-[var(--md-primary)] hover:underline"
                                x-text="t('posts.selectAll')"
                            ></button>
                            <button
                                @click="deselectAll()"
                                class="text-[var(--md-on-surface-variant)] hover:text-[var(--md-on-surface)]"
                                x-text="t('posts.clear')"
                            ></button>
                            <span class="text-[var(--md-on-surface-variant)]" x-text="selectedPosts.size + ' ' + t('posts.selected')"></span>
                            <button
                                @click="markSelectedAsRead()"
                                class="ml-auto px-3 py-1 rounded-full bg-[var(--md-primary)] text-[var(--md-on-primary)] hover:opacity-90 transition-colors"
                                :disabled="selectedPosts.size === 0"
                                :class="selectedPosts.size === 0 ? 'opacity-50 cursor-not-allowed' : ''"
                            ><span x-text="t('posts.markAsRead')"></span><span class="hidden lg:inline opacity-60"> (M)</span></button>
                        </div>
                        <!-- Curation results panel (M3 redesign step 4, docs/specs/
                             MATERIAL3_REDESIGN_PLAN.md — mockup 2e). Badge colors follow
                             the app's own color discipline (see risos-visual-cohesion-pass
                             memory): essential = solid primary (like the suggestion-score
                             badge), redundant = error container (red means "skip this"
                             here, same as elsewhere), situational = secondary container. -->
                        <div x-show="curationResults" class="mt-2 space-y-2 rounded-2xl p-3 bg-[var(--md-surface-container-low)]">
                            <!-- Disclaimer -->
                            <p class="text-[11px] text-[var(--md-on-surface-variant)] italic" x-text="t('curation.disclaimer')"></p>
                            <!-- Stats + actions -->
                            <div class="flex flex-wrap items-center gap-2 text-xs">
                                <span class="text-[var(--md-on-surface-variant)]" x-text="t('curation.postsAnalyzed').replace('{count}', curationStats.total)"></span>
                                <span class="inline-flex items-center gap-1 px-2 py-1 rounded-lg bg-[var(--md-primary)] text-[var(--md-on-primary)]" :data-tip="t('curation.essential')">
                                    <span class="msym msym-fill text-[13px]">star</span><span x-text="curationStats.essential"></span>
                                </span>
                                <span class="inline-flex items-center gap-1 px-2 py-1 rounded-lg bg-[var(--md-secondary-container)] text-[var(--md-on-secondary-container)]" :data-tip="t('curation.situational')">
                                    <span class="msym text-[13px]">info</span><span x-text="curationStats.situational"></span>
                                </span>
                                <span class="inline-flex items-center gap-1 px-2 py-1 rounded-lg bg-[var(--md-error-container)] text-[var(--md-on-error-container)]" :data-tip="t('curation.redundant')">
                                    <span class="msym text-[13px]">block</span><span x-text="curationStats.redundant"></span>
                                </span>
                                <span x-show="curationStats.unclassified > 0" class="inline-flex items-center gap-1 px-2 py-1 rounded-lg bg-[var(--md-surface-container-highest)] text-[var(--md-on-surface-variant)]" :data-tip="t('curation.unclassifiedReason')">
                                    <span>—</span> <span x-text="curationStats.unclassified"></span>
                                </span>
                                <button
                                    @click="selectRedundantPosts()"
                                    x-show="curationStats.redundant > 0 && !selectMode"
                                    class="px-3 py-1 rounded-full text-xs font-medium border border-[var(--md-outline)] text-[var(--md-primary)] hover:bg-[var(--md-primary-container)]"
                                    x-text="t('curation.selectRedundant')"
                                ></button>
                                <button
                                    @click="exportSelection()"
                                    x-show="selectedPosts.size > 0"
                                    class="px-3 py-1 rounded-full text-xs font-medium border border-[var(--md-outline)] text-[var(--md-primary)] hover:bg-[var(--md-primary-container)]"
                                    x-text="t('curation.downloadSelected')"
                                ></button>
                                <button
                                    @click="batchUnstar()"
                                    x-show="selectedPosts.size > 0"
                                    class="px-3 py-1 rounded-full text-xs font-medium bg-[var(--md-error)] text-white hover:opacity-90"
                                    x-text="t('curation.archiveSelected')"
                                ></button>
                                <button
                                    @click="clearCuration()"
                                    class="ml-auto px-2 py-1 text-[var(--md-on-surface-variant)] hover:text-[var(--md-on-surface)]"
                                    x-text="t('curation.clear')"
                                ></button>
                            </div>
                        </div>
                    </div>

                    <!-- Post list container (fills all remaining height) -->
                    <div id="split-container" class="flex-1 flex flex-col overflow-hidden min-h-0">
                        <!-- Post List -->
                        <div
                            id="post-list"
                            class="overflow-y-auto scrollbar-thin flex-1"
                            @scroll="handleScroll($event)"
                        >
                        <template x-if="loading && posts.length === 0">
                            <div class="p-8 text-center text-[var(--md-on-surface-variant)]" x-text="t('app.loading')"></div>
                        </template>

                        <!-- Empty states (M3 redesign step 3, docs/specs/MATERIAL3_REDESIGN_PLAN.md):
                             mutually exclusive by root cause — no feeds at all, an active
                             search with nothing matching, or just nothing left in this filter. -->
                        <template x-if="!loading && posts.length === 0 && feeds.length === 0">
                            <div class="flex flex-col items-center justify-center gap-2 p-12 text-center">
                                <span class="msym text-[40px] text-[var(--md-on-surface-variant)]">rss_feed</span>
                                <p class="font-medium text-[var(--md-on-surface)]" x-text="t('feeds.noFeeds')"></p>
                                <p class="text-sm text-[var(--md-on-surface-variant)] max-w-xs" x-text="t('feeds.noFeedsDesc')"></p>
                                <button
                                    @click="openSettings(); toggleAccordion('data')"
                                    class="mt-2 h-9 px-4 rounded-full text-sm font-medium bg-[var(--md-primary)] text-[var(--md-on-primary)]"
                                    x-text="t('feeds.addFeed')"
                                ></button>
                            </div>
                        </template>

                        <template x-if="!loading && posts.length === 0 && feeds.length > 0 && searchQuery.trim()">
                            <div class="flex flex-col items-center justify-center gap-2 p-12 text-center">
                                <span class="msym text-[40px] text-[var(--md-on-surface-variant)]">search_off</span>
                                <p class="font-medium text-[var(--md-on-surface)]" x-text="t('posts.noSearchResults')"></p>
                                <p class="text-sm text-[var(--md-on-surface-variant)] max-w-xs" x-text="t('posts.noSearchResultsDesc')"></p>
                            </div>
                        </template>

                        <!-- Three more empty variants, in priority order:
                             1. A named filter is active (feed/category/topic/tag/Suggested/
                                Starred) — say so by name, this used to just say "no unread
                                posts" no matter which of these was empty.
                             2. No named filter, and this genuinely is the unread-only view
                                (mirrors loadPosts()'s own unread_only logic) — "caught up".
                             3. No named filter, viewing 'all' — neutral message. -->
                        <template x-if="!loading && posts.length === 0 && feeds.length > 0 && !searchQuery.trim() && getPostsEmptyContext()">
                            <div class="flex flex-col items-center justify-center gap-2 p-12 text-center">
                                <span class="msym text-[40px] text-[var(--md-on-surface-variant)]">inbox</span>
                                <p class="font-medium text-[var(--md-on-surface)]" x-text="t('posts.noPostsInContext').replace('{context}', getPostsEmptyContext())"></p>
                            </div>
                        </template>

                        <template x-if="!loading && posts.length === 0 && feeds.length > 0 && !searchQuery.trim() && !getPostsEmptyContext() && postFilter === 'unread'">
                            <div class="flex flex-col items-center justify-center gap-2 p-12 text-center">
                                <span class="msym text-[40px] text-[var(--md-primary)]">task_alt</span>
                                <p class="font-medium text-[var(--md-on-surface)]" x-text="t('posts.noPosts')"></p>
                            </div>
                        </template>

                        <template x-if="!loading && posts.length === 0 && feeds.length > 0 && !searchQuery.trim() && !getPostsEmptyContext() && postFilter !== 'unread'">
                            <div class="flex flex-col items-center justify-center gap-2 p-12 text-center">
                                <span class="msym text-[40px] text-[var(--md-on-surface-variant)]">inbox</span>
                                <p class="font-medium text-[var(--md-on-surface)]" x-text="t('posts.noPostsGeneric')"></p>
                            </div>
                        </template>

                        <template x-for="(post, index) in posts" :key="post.id">
                            <div>
                            <article
                                @click="selectMode ? togglePostSelection(post.id) : togglePostInline(post)"
                                @keydown.enter.stop="selectMode ? togglePostSelection(post.id) : togglePostInline(post)"
                                tabindex="0"
                                class="p-4 mx-2 cursor-pointer transition"
                                :class="{
                                    'bg-[var(--md-secondary-container)]': selectedIndex === index && !isPostSelected(post.id),
                                    'hover:bg-[var(--md-surface-container-highest)]': selectedIndex !== index && !isPostSelected(post.id),
                                    'opacity-60': post.is_read && !(currentPost && currentPost.id === post.id),
                                    'bg-[var(--md-primary-container)]': isPostSelected(post.id),
                                    'mt-6 border-t border-[var(--md-outline-variant)]': shouldShowDateSeparator(index) && index > 0 && !(currentPost && currentPost.id === post.id),
                                    'border-l-[3px] border-l-[var(--md-error)]': post.is_blocked,
                                    // Open post: rounded only on top and flush against the
                                    // reader panel right below it, so the two read as one card.
                                    'rounded-t-[16px] sticky top-0 z-10 shadow-md': currentPost && currentPost.id === post.id,
                                    'rounded-[16px] mb-2': !(currentPost && currentPost.id === post.id)
                                }"
                                :data-index="index"
                            >
                                <div class="flex items-start gap-3">
                                    <!-- Selection checkbox -->
                                    <div
                                        x-show="selectMode"
                                        class="flex-shrink-0 mt-1"
                                        @click.stop="togglePostSelection(post.id)"
                                    >
                                        <div
                                            class="w-5 h-5 rounded border-2 flex items-center justify-center transition-colors"
                                            :class="isPostSelected(post.id) ? 'bg-[var(--md-primary)] border-[var(--md-primary)]' : 'border-[var(--md-outline)] hover:border-[var(--md-primary)]'"
                                        >
                                            <span x-show="isPostSelected(post.id)" class="msym text-[12px] text-[var(--md-on-primary)]">check</span>
                                        </div>
                                    </div>
                                    <!-- Unread indicator -->
                                    <div
                                        x-show="!selectMode"
                                        class="w-2 h-2 rounded-full mt-2 flex-shrink-0"
                                        :class="post.is_read ? 'bg-[var(--md-outline)]' : 'bg-[var(--md-primary)]'"
                                    ></div>
                                    <div class="flex-1 min-w-0">
                                        <div class="flex items-start gap-2">
                                            <template x-if="post.skip_summary">
                                                <span class="msym text-[14px] flex-shrink-0 text-[var(--md-error)] mt-0.5">block</span>
                                            </template>

                <div class="bg-[var(--md-primary-container)]">
