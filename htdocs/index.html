                                ></button>
                            </div>
                        </div>

                        <!-- Topics Tab -->
                        <div x-show="settingsTab === 'topics'" class="space-y-4">
                            <!-- AI Suggestion -->
                            <div class="flex items-center justify-between gap-2">
                                <h3 class="text-sm font-medium text-[var(--md-on-surface)]" x-text="t('settings.topics.title')"></h3>
                                <button
                                    @click="suggestTopics()"
                                    :disabled="suggestingTopics"
                                    class="px-3 py-1.5 text-xs rounded-full bg-[var(--md-primary)] text-[var(--md-on-primary)] hover:opacity-90 disabled:opacity-50 flex items-center gap-1 transition-colors flex-shrink-0"
                                >
                                    <span x-show="suggestingTopics" class="msym text-[12px] animate-spin">progress_activity</span>
                                    <span x-show="!suggestingTopics" class="msym text-[12px]">auto_awesome</span>
                                    <span x-text="t('settings.topics.suggestWithAI')"></span>
                                </button>
                            </div>

                            <!-- AI Suggestion Review: one full-tonal-fill primary-container block,
                                 same rule as the post-detail AI summary panel (step 7). -->
                            <template x-if="topicSuggestions">
                                <div class="space-y-3 p-3 bg-[var(--md-primary-container)] rounded-2xl">
                                    <div class="flex items-center justify-between gap-2">
                                        <!-- Label + count as separate elements — a trailing number,
                                             not "(N)" glued onto the label text (step 8/15 fix). -->
                                        <span class="text-sm font-medium text-[var(--md-on-primary-container)]">
                                            <span x-text="t('settings.topics.aiSuggestions')"></span>
                                            <span class="opacity-80" x-text="topicSuggestions.suggestions?.length || 0"></span>
                                        </span>
                                        <div class="flex gap-2 flex-shrink-0">
                                            <button
                                                @click="acceptAllTopicSuggestions()"
                                                class="px-2 py-1 text-xs rounded-full bg-[var(--md-on-primary-container)] text-[var(--md-primary-container)] hover:opacity-90"
                                                x-text="t('settings.topics.acceptAll')"
                                            ></button>
                                            <button
                                                @click="topicSuggestions = null"
                                                class="px-2 py-1 text-xs rounded-full bg-black/10 dark:bg-white/10 text-[var(--md-on-primary-container)] hover:bg-black/15 dark:hover:bg-white/15"
                                                x-text="t('settings.topics.dismiss')"
                                            ></button>
                                        </div>
                                    </div>
                                    <template x-for="(suggestion, idx) in topicSuggestions.suggestions" :key="idx">
                                        <div class="bg-[var(--md-surface)] rounded-lg p-3">
                                            <div class="flex items-center justify-between mb-2 gap-2">
                                                <input
                                                    type="text"
                                                    x-model="suggestion.name"
                                                    class="flex-1 min-w-0 text-sm font-medium bg-transparent border-b border-[var(--md-outline)] focus:border-[var(--md-primary)] outline-none px-1 py-0.5 text-[var(--md-on-surface)]"
                                                />
                                                <button
                                                    @click="acceptTopicSuggestion(suggestion)"
                                                    class="px-2 py-1 text-xs rounded-full bg-[var(--md-primary)] text-[var(--md-on-primary)] hover:opacity-90 flex-shrink-0"
                                                    x-text="t('settings.topics.accept')"
                                                ></button>
                                            </div>
                                            <div class="flex flex-wrap gap-1">
                                                <template x-for="(tag, tidx) in suggestion.tags" :key="tidx">
                                                    <span class="inline-flex items-center gap-0.5 text-xs px-1.5 py-0.5 rounded-lg bg-[var(--md-primary-container)] text-[var(--md-on-primary-container)]">
                                                        <span x-text="tag"></span>
                                                        <button @click="suggestion.tags.splice(tidx, 1)" class="hover:text-[var(--md-error)]">&times;</button>
                                                    </span>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                    <template x-if="topicSuggestions.orphan_tags?.length > 0">
                                        <div class="text-xs text-[var(--md-on-primary-container)] opacity-80">
                                            <span x-text="t('settings.topics.orphanTags') + ': '"></span>
                                            <span x-text="topicSuggestions.orphan_tags.join(', ')"></span>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <!-- Create new topic -->
                            <div class="flex gap-2">
                                <input
                                    type="text"
                                    x-model="newTopicName"
                                    @keydown.enter="if (newTopicName.trim()) { createTopic(newTopicName.trim()); newTopicName = ''; }"
                                    :placeholder="t('settings.topics.newTopicPlaceholder')"
                                    class="flex-1 min-w-0 text-sm px-3 py-1.5 border border-[var(--md-outline)] rounded-lg bg-[var(--md-surface)] text-[var(--md-on-surface)] focus:outline-none focus:border-[var(--md-primary)]"
                                />
                                <button
                                    @click="if (newTopicName.trim()) { createTopic(newTopicName.trim()); newTopicName = ''; }"
                                    class="px-3 py-1.5 text-xs rounded-full bg-[var(--md-primary)] text-[var(--md-on-primary)] hover:opacity-90 flex-shrink-0"
                                    x-text="t('settings.topics.create')"
                                ></button>
                            </div>

                            <!-- Existing topics list -->
                            <div class="space-y-2">
                                <template x-for="topic in topics" :key="topic.id">
                                    <div
                                        class="bg-[var(--md-surface-container)] rounded-2xl p-3 border-2 transition-colors"
                                        :class="dragOverTopicId === topic.id
                                            ? (dragTagCopy
                                                ? 'border-[var(--md-secondary)] bg-[var(--md-secondary-container)]'
                                                : 'border-[var(--md-primary)] bg-[var(--md-primary-container)]')
                                            : 'border-transparent'"
                                        @dragover="onTopicDragOver($event, topic.id)"
                                        @dragleave="onTopicDragLeave($event, topic.id)"
                                        @drop="onTopicDrop($event, topic.id)"
                                    >
                                        <div class="flex items-center justify-between mb-2 gap-2">
                                            <template x-if="editingTopic === topic.id">
                                                <input
                                                    type="text"
                                                    x-model="editingTopicName"
                                                    @keydown.enter="renameTopic(topic.id)"
                                                    @keydown.escape="editingTopic = null"
                                                    @blur="renameTopic(topic.id)"
                                                    x-init="$nextTick(() => $el.focus())"
                                                    class="flex-1 min-w-0 text-sm font-medium bg-[var(--md-surface)] border border-[var(--md-outline)] rounded-lg px-2 py-0.5 text-[var(--md-on-surface)]"
                                                />
                                            </template>
                                            <template x-if="editingTopic !== topic.id">
                                                <span class="text-sm font-medium flex items-center gap-1.5 text-[var(--md-on-surface)] min-w-0">
                                                    <span x-text="topic.name" class="truncate"></span>
                                                    <span
                                                        x-show="dragOverTopicId === topic.id"
                                                        class="text-[10px] px-1.5 py-0.5 rounded-full font-normal flex-shrink-0"
                                                        :class="dragTagCopy
                                                            ? 'bg-[var(--md-secondary)] text-[var(--md-on-secondary)]'
                                                            : 'bg-[var(--md-primary)] text-[var(--md-on-primary)]'"
                                                        x-text="dragTagCopy ? t('settings.topics.copy') : t('settings.topics.move')"
                                                    ></span>
                                                </span>
                                            </template>
                                            <div class="flex items-center gap-1 flex-shrink-0">
                                                <span class="text-xs text-[var(--md-on-surface-variant)]" x-text="topic.post_count + ' posts'"></span>
                                                <button
                                                    @click="editingTopicName = topic.name; editingTopic = topic.id"
                                                    class="p-1 rounded-full hover:bg-[var(--md-surface-container-highest)] text-[var(--md-on-surface-variant)]"
                                                    :data-tip="t('settings.topics.rename')"
                                                    :aria-label="t('settings.topics.rename')"
                                                >
                                                    <span class="msym text-[14px]">edit</span>
                                                </button>
                                                <button
                                                    @click="suggestTagsForTopic(topic.id)"
                                                    :disabled="suggestingTagsForTopicId !== null"
                                                    class="px-1.5 py-0.5 text-[10px] rounded-full border border-[var(--md-primary)] text-[var(--md-primary)] hover:bg-[var(--md-primary-container)] disabled:opacity-50 flex items-center gap-0.5"
                                                    :data-tip="t('settings.topics.suggestTags')"
                                                    :aria-label="t('settings.topics.suggestTags')"
                                                >
                                                    <span x-show="suggestingTagsForTopicId === topic.id" class="msym text-[12px] animate-spin">progress_activity</span>
                                                    <span x-show="suggestingTagsForTopicId !== topic.id" class="msym text-[12px]">auto_awesome</span>
                                                    <span x-text="t('settings.topics.suggestTags')"></span>
                                                </button>
                                                <button
                                                    @click="deleteTopic(topic.id)"
                                                    class="p-1 rounded-full hover:bg-[var(--md-error-container)] hover:text-[var(--md-on-error-container)] text-[var(--md-on-surface-variant)] transition-colors"
                                                    :data-tip="t('settings.topics.delete')"
                                                    :aria-label="t('settings.topics.delete')"
                                                >
                                                    <span class="msym text-[14px]">delete</span>
                                                </button>
                                            </div>
                                        </div>
                                        <div class="flex flex-wrap gap-1 mb-2">
                                            <template x-for="tag in topic.tags" :key="tag">
                                                <span
                                                    draggable="true"
                                                    @dragstart="onTagDragStart($event, tag, topic.id)"
                                                    @dragend="onTagDragEnd($event)"
                                                    class="inline-flex items-center gap-0.5 text-xs px-1.5 py-0.5 rounded-lg bg-[var(--md-surface-container-highest)] text-[var(--md-on-surface-variant)] cursor-grab active:cursor-grabbing"
                                                >
                                                    <span x-text="tag"></span>
                                                    <button @click="removeTagFromTopic(topic.id, tag)" class="hover:text-[var(--md-error)]">&times;</button>
                                                </span>
                                            </template>
                                        </div>
                                        <div class="relative flex gap-1" x-data="{
                                            val: '', suggestions: [], selIdx: -1, debounceTimer: null,
                                            async search() {
                                                if (this.val.trim().length >= 1) {
                                                    try { const r = await fetchApi('/tags/search?q=' + encodeURIComponent(this.val.trim()) + '&exclude_topic_id=' + topic.id); this.suggestions = r.tags || []; this.selIdx = -1; } catch(e) { this.suggestions = []; }
                                                } else { this.suggestions = []; }
                                            },
                                            async pick(tag) {
                                                await addTagsToTopic(topic.id, [tag]);
                                                this.suggestions = this.suggestions.filter(s => s.tag !== tag);
                                                this.$nextTick(() => this.$refs.input.focus());
                                            }
                                        }" @click.away="suggestions = []; val = ''">
                                            <input
                                                type="text"
                                                x-ref="input"
                                                x-model="val"
                                                @input="clearTimeout(debounceTimer); debounceTimer = setTimeout(() => search(), 200)"
                                                @keydown.arrow-down.prevent="if (suggestions.length) selIdx = (selIdx + 1) % suggestions.length"
                                                @keydown.arrow-up.prevent="if (suggestions.length) selIdx = selIdx <= 0 ? suggestions.length - 1 : selIdx - 1"
                                                @keydown.enter.prevent="if (selIdx >= 0 && suggestions[selIdx]) { pick(suggestions[selIdx].tag); selIdx = -1; } else if (val.trim() && suggestions.length) { pick(suggestions[0].tag); }"
                                                @keydown.escape="suggestions = []; val = ''"
                                                :placeholder="t('settings.topics.addTagPlaceholder')"
                                                class="flex-1 min-w-0 text-xs px-2 py-1 border border-[var(--md-outline)] rounded-lg bg-[var(--md-surface)] text-[var(--md-on-surface)] focus:outline-none focus:border-[var(--md-primary)]"
                                                autocomplete="off"
                                            />
                                            <!-- Autocomplete dropdown -->
                                            <div x-show="suggestions.length > 0" class="absolute top-full left-0 right-8 mt-1 bg-[var(--md-surface-container)] border border-[var(--md-outline-variant)] rounded-lg shadow-lg z-50 max-h-48 overflow-y-auto">
                                                <template x-for="(s, idx) in suggestions" :key="s.tag">
                                                    <button
                                                        @click="pick(s.tag)"
                                                        class="w-full text-left px-3 py-1.5 text-xs flex justify-between items-center text-[var(--md-on-surface)]"
                                                        :class="idx === selIdx ? 'bg-[var(--md-secondary-container)]' : 'hover:bg-[var(--md-surface-container-highest)]'"
                                                    >
                                                        <span x-text="s.tag"></span>
                                                        <span class="text-[var(--md-on-surface-variant)] text-[10px]" x-text="s.count + ' posts'"></span>
                                                    </button>
                                                </template>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                                <template x-if="topics.length === 0">
                                    <p class="text-sm text-[var(--md-on-surface-variant)] text-center py-4" x-text="t('settings.topics.empty')"></p>
                                </template>
                            </div>
                        </div>

                        <!-- General Tab -->
                        <div x-show="settingsTab === 'general'" class="space-y-2">

                            <!-- Accordion: Appearance -->
                            <div class="border border-[var(--md-outline-variant)] rounded-2xl overflow-hidden">
                                <button
                                    @click="toggleAccordion('appearance')"
                                    class="w-full px-4 py-3 flex items-center justify-between bg-[var(--md-surface-container)] hover:bg-[var(--md-surface-container-highest)] transition-colors"
                                >
                                    <span class="font-medium text-[var(--md-on-surface)]" x-text="t('settings.theme')"></span>
                                    <span class="msym text-[20px] text-[var(--md-on-surface-variant)] transition-transform" :class="settingsAccordion.appearance ? 'rotate-180' : ''">expand_more</span>
                                </button>
                                <div x-show="settingsAccordion.appearance" x-collapse class="p-4 space-y-4">
                                    <!-- Theme -->
                                    <div>
                                        <p class="text-[var(--md-on-surface-variant)] text-sm mb-3" x-text="t('settings.themeDesc')"></p>
                                        <div class="flex flex-wrap gap-2">
                                            <template x-for="themeOption in availableThemes" :key="themeOption.value">
                                                <button
                                                    @click="setTheme(themeOption.value)"
                                                    class="px-4 py-2 rounded-full font-medium transition-colors"
                                                    :class="theme === themeOption.value ? 'bg-[var(--md-primary)] text-[var(--md-on-primary)]' : 'border border-[var(--md-outline)] text-[var(--md-on-surface-variant)] hover:bg-[var(--md-surface-container-highest)]'"
                                                    x-text="t(themeOption.labelKey)"
                                                ></button>
                                            </template>
                                        </div>
                                    </div>
                                    <!-- Language -->
                                    <div class="pt-3 border-t border-[var(--md-outline-variant)]">
                                        <label for="setting-language" class="block text-sm font-medium mb-1 text-[var(--md-on-surface)]" x-text="t('settings.language')"></label>
                                        <p class="text-[var(--md-on-surface-variant)] text-xs mb-2" x-text="t('settings.languageDesc')"></p>
                                        <select
                                            id="setting-language"
                                            @change="setLocale($event.target.value)"
                                            class="w-full max-w-xs px-3 py-2 bg-[var(--md-surface)] border border-[var(--md-outline)] rounded-lg text-[var(--md-on-surface)] focus:outline-none focus:border-[var(--md-primary)]"
                                        >
                                            <template x-for="loc in availableLocales" :key="loc.code">
                                                <option :value="loc.code" :selected="locale === loc.code" x-text="loc.name"></option>
                                            </template>
                                        </select>
                                    </div>
                                    <!-- Feed Reverse Order -->
                                    <div class="pt-3 border-t border-[var(--md-outline-variant)]">
                                        <label class="flex items-center gap-2 cursor-pointer select-none">
                                            <input
                                                type="checkbox"
                                                :checked="feedReverseOrder"
                                                @change="setFeedReverseOrder($event.target.checked)"
                                                class="rounded accent-[var(--md-primary)]"
                                            >
                                            <span class="text-sm font-medium text-[var(--md-on-surface)]" x-text="t('settings.feedReverseOrder')"></span>
                                        </label>
                                        <p class="text-[var(--md-on-surface-variant)] text-xs mt-1" x-text="t('settings.feedReverseOrderDesc')"></p>
                                    </div>
                                </div>
                            </div>

                            <!-- Accordion: Data -->
                            <div class="border border-[var(--md-outline-variant)] rounded-2xl overflow-hidden">
                                <button
                                    @click="toggleAccordion('data')"
                                    class="w-full px-4 py-3 flex items-center justify-between bg-[var(--md-surface-container)] hover:bg-[var(--md-surface-container-highest)] transition-colors"
                                >
                                    <span class="font-medium text-[var(--md-on-surface)]" x-text="t('settings.data')"></span>
                                    <span class="msym text-[20px] text-[var(--md-on-surface-variant)] transition-transform" :class="settingsAccordion.data ? 'rotate-180' : ''">expand_more</span>
                                </button>
                                <div x-show="settingsAccordion.data" x-collapse class="p-4 space-y-4">
                                    <!-- Feed Update Interval -->
                                    <div>
                                        <label for="setting-feed-update-interval" class="block text-sm font-medium mb-1 text-[var(--md-on-surface)]" x-text="t('settings.feedUpdateInterval')"></label>
                                        <p class="text-[var(--md-on-surface-variant)] text-xs mb-2" x-text="t('settings.feedUpdateIntervalDesc')"></p>
                                        <div class="flex items-center gap-2">
                                            <input
                                                id="setting-feed-update-interval"
                                                type="number"
                                                min="5"
                                                max="1440"
                                                :value="feedUpdateInterval"
                                                @change="setFeedUpdateInterval($event.target.value)"
                                                class="w-24 px-3 py-2 bg-[var(--md-surface)] border border-[var(--md-outline)] rounded-lg text-[var(--md-on-surface)] focus:outline-none focus:border-[var(--md-primary)]"
                                            >
                                            <span class="text-sm text-[var(--md-on-surface-variant)]" x-text="t('settings.minutes')"></span>
                                        </div>
                                    </div>
                                    <!-- Max Post Age -->
                                    <div class="pt-3 border-t border-[var(--md-outline-variant)]">
                                        <label for="setting-max-post-age-days" class="block text-sm font-medium mb-1 text-[var(--md-on-surface)]" x-text="t('settings.maxPostAgeDays')"></label>
                                        <p class="text-[var(--md-on-surface-variant)] text-xs mb-2" x-text="t('settings.maxPostAgeDaysDesc')"></p>
                                        <div class="flex items-center gap-2">
                                            <input
                                                id="setting-max-post-age-days"
                                                type="number"
                                                min="7"
                                                max="3650"
                                                :value="maxPostAgeDays"
                                                @change="setMaxPostAgeDays($event.target.value)"
                                                class="w-24 px-3 py-2 bg-[var(--md-surface)] border border-[var(--md-outline)] rounded-lg text-[var(--md-on-surface)] focus:outline-none focus:border-[var(--md-primary)]"
                                            >
                                            <span class="text-sm text-[var(--md-on-surface-variant)]" x-text="t('settings.days')"></span>
                                        </div>
                                    </div>
                                    <!-- Max Unread Days -->
                                    <div class="pt-3 border-t border-[var(--md-outline-variant)]">
                                        <label for="setting-max-unread-days" class="block text-sm font-medium mb-1 text-[var(--md-on-surface)]" x-text="t('settings.maxUnreadDays')"></label>
                                        <p class="text-[var(--md-on-surface-variant)] text-xs mb-2" x-text="t('settings.maxUnreadDaysDesc')"></p>
                                        <div class="flex items-center gap-2">
                                            <input
                                                id="setting-max-unread-days"
                                                type="number"
                                                min="1"
                                                max="365"
                                                :value="maxUnreadDays"
                                                @change="setMaxUnreadDays($event.target.value)"
                                                class="w-24 px-3 py-2 bg-[var(--md-surface)] border border-[var(--md-outline)] rounded-lg text-[var(--md-on-surface)] focus:outline-none focus:border-[var(--md-primary)]"
                                            >
                                            <span class="text-sm text-[var(--md-on-surface-variant)]" x-text="t('settings.days')"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Accordion: Interface -->
                            <div class="border border-[var(--md-outline-variant)] rounded-2xl overflow-hidden">
                                <button
                                    @click="toggleAccordion('interface')"
                                    class="w-full px-4 py-3 flex items-center justify-between bg-[var(--md-surface-container)] hover:bg-[var(--md-surface-container-highest)] transition-colors"
                                >
                                    <span class="font-medium text-[var(--md-on-surface)]" x-text="t('settings.interface')"></span>
                                    <span class="msym text-[20px] text-[var(--md-on-surface-variant)] transition-transform" :class="settingsAccordion.interface ? 'rotate-180' : ''">expand_more</span>
                                </button>
                                <div x-show="settingsAccordion.interface" x-collapse class="p-4 space-y-4">
                                    <!-- Toast Timeout -->
                                    <div>
                                        <label for="setting-toast-timeout" class="block text-sm font-medium mb-1 text-[var(--md-on-surface)]" x-text="t('settings.toastTimeout')"></label>
                                        <p class="text-[var(--md-on-surface-variant)] text-xs mb-2" x-text="t('settings.toastTimeoutDesc')"></p>
                                        <div class="flex items-center gap-2">
                                            <input
                                                id="setting-toast-timeout"
                                                type="number"
                                                min="0"
                                                max="30"
                                                :value="toastTimeoutSeconds"
                                                @change="setToastTimeout($event.target.value)"
                                                class="w-24 px-3 py-2 bg-[var(--md-surface)] border border-[var(--md-outline)] rounded-lg text-[var(--md-on-surface)] focus:outline-none focus:border-[var(--md-primary)]"
                                            >
                                            <span class="text-sm text-[var(--md-on-surface-variant)]" x-text="t('settings.seconds')"></span>
                                        </div>
                                    </div>
                                    <!-- Idle Refresh -->
                                    <div class="pt-3 border-t border-[var(--md-outline-variant)]">
                                        <label for="setting-idle-refresh" class="block text-sm font-medium mb-1 text-[var(--md-on-surface)]" x-text="t('settings.idleRefresh')"></label>
                                        <p class="text-[var(--md-on-surface-variant)] text-xs mb-2" x-text="t('settings.idleRefreshDesc')"></p>
                                        <div class="flex items-center gap-2">
                                            <input
                                                id="setting-idle-refresh"
                                                type="number"
                                                min="0"
                                                max="3600"
                                                :value="idleRefreshSeconds"
                                                @change="setIdleRefresh($event.target.value)"
                                                class="w-24 px-3 py-2 bg-[var(--md-surface)] border border-[var(--md-outline)] rounded-lg text-[var(--md-on-surface)] focus:outline-none focus:border-[var(--md-primary)]"
                                            >
                                            <span class="text-sm text-[var(--md-on-surface-variant)]" x-text="t('settings.seconds')"></span>
                                        </div>
                                    </div>
                                    <!-- Suggestion Sensitivity -->
                                    <div class="pt-3 border-t border-[var(--md-outline-variant)]">
                                        <label for="setting-suggestion-min-tags" class="block text-sm font-medium mb-1 text-[var(--md-on-surface)]" x-text="t('settings.suggestionMinTags')"></label>
                                        <p class="text-[var(--md-on-surface-variant)] text-xs mb-2" x-text="t('settings.suggestionMinTagsDesc')"></p>
                                        <div class="flex items-center gap-2">
                                            <input
                                                id="setting-suggestion-min-tags"
                                                type="number"
                                                min="1"
                                                :max="tagsPerPost"
                                                :value="suggestionMinTags"
                                                @change="setSuggestionMinTags($event.target.value)"
                                                class="w-24 px-3 py-2 bg-[var(--md-surface)] border border-[var(--md-outline)] rounded-lg text-[var(--md-on-surface)] focus:outline-none focus:border-[var(--md-primary)]"
                                            >
                                            <span class="text-sm text-[var(--md-on-surface-variant)]" x-text="t('settings.tags')"></span>
                                        </div>
                                    </div>
                                    <!-- Profile Min Tag Frequency -->
                                    <div class="pt-3 border-t border-[var(--md-outline-variant)]">
                                        <label for="setting-profile-min-tag-freq" class="block text-sm font-medium mb-1 text-[var(--md-on-surface)]" x-text="t('settings.profileMinTagFreq')"></label>
                                        <p class="text-[var(--md-on-surface-variant)] text-xs mb-2" x-text="t('settings.profileMinTagFreqDesc')"></p>
                                        <div class="flex items-center gap-2">
                                            <input
                                                id="setting-profile-min-tag-freq"
                                                type="number"
                                                min="1"
                                                max="20"
                                                :value="profileMinTagFreq"
                                                @change="setProfileMinTagFreq($event.target.value)"
                                                class="w-24 px-3 py-2 bg-[var(--md-surface)] border border-[var(--md-outline)] rounded-lg text-[var(--md-on-surface)] focus:outline-none focus:border-[var(--md-primary)]"
                                            >
                                            <span class="text-sm text-[var(--md-on-surface-variant)]" x-text="t('settings.likedPosts')"></span>
                                        </div>
                                    </div>
                                    <!-- Suggestion Min Summary Length -->
                                    <div class="pt-3 border-t border-gray-200 dark:border-gray-700">
                                        <label for="setting-suggestion-min-summary-length" class="block text-sm font-medium mb-1 text-[var(--md-on-surface)]" x-text="t('settings.suggestionMinSummaryLength')"></label>
                                        <p class="text-[var(--md-on-surface-variant)] text-xs mb-2" x-text="t('settings.suggestionMinSummaryLengthDesc')"></p>
                                        <div class="flex items-center gap-2">
                                            <input
                                                id="setting-suggestion-min-summary-length"
                                                type="number"
                                                min="0"
                                                max="2000"
                                                :value="suggestionMinSummaryLength"
                                                @change="setSuggestionMinSummaryLength($event.target.value)"
                                                class="w-24 px-3 py-2 bg-[var(--md-surface)] border border-[var(--md-outline)] rounded-lg text-[var(--md-on-surface)] focus:outline-none focus:border-[var(--md-primary)]"
                                            >
                                            <span class="text-sm text-[var(--md-on-surface-variant)]" x-text="t('settings.characters')"></span>
                                        </div>
                                    </div>
                                    <!-- Ignored Tags -->
                                    <div class="pt-3 border-t border-[var(--md-outline-variant)]">
                                        <label class="block text-sm font-medium mb-1 text-[var(--md-on-surface)]" x-text="t('settings.ignoredTags')"></label>
                                        <p class="text-[var(--md-on-surface-variant)] text-xs mb-2" x-text="t('settings.ignoredTagsDesc')"></p>
                                        <div class="flex flex-wrap gap-1 mb-2" x-show="ignoredTags.size > 0">
                                            <template x-for="tag in [...ignoredTags].sort()" :key="tag">
                                                <span class="inline-flex items-center gap-1 text-xs px-1.5 py-0.5 rounded-lg bg-[var(--md-surface-container-highest)] text-[var(--md-on-surface-variant)]">
                                                    <span x-text="tag"></span>
                                                    <button @click="toggleTagIgnored(tag)" class="hover:text-[var(--md-error)]" :data-tip="t('tags.clearFilter')" :aria-label="t('tags.clearFilter')">&times;</button>
                                                </span>
                                            </template>
                                        </div>
                                        <p x-show="ignoredTags.size === 0" class="text-[var(--md-on-surface-variant)] text-xs italic" x-text="t('settings.noIgnoredTags')"></p>
                                    </div>
                                    <!-- Blocked Terms -->
                                    <div class="pt-3 border-t border-[var(--md-outline-variant)]">
                                        <label for="setting-blocked-terms" class="block text-sm font-medium mb-1 text-[var(--md-on-surface)]" x-text="t('settings.blockedTerms')"></label>
                                        <p class="text-[var(--md-on-surface-variant)] text-xs mb-2" x-text="t('settings.blockedTermsDesc')"></p>
                                        <textarea
                                            id="setting-blocked-terms"
                                            :value="blockedTermsSorted()"
                                            @change="setBlockedTerms($event.target.value)"
                                            :placeholder="t('settings.blockedTermsPlaceholder')"
                                            rows="6"
                                            class="w-full px-3 py-2 bg-[var(--md-surface)] border border-[var(--md-outline)] rounded-lg text-[var(--md-on-surface)] focus:outline-none focus:border-[var(--md-primary)] text-sm font-mono"
                                        ></textarea>
                                    </div>
                                </div>
                            </div>

                            <!-- Tag Consolidation -->
                            <div class="border border-[var(--md-outline-variant)] rounded-2xl overflow-hidden">
                                <button
                                    @click="toggleAccordion('tagMerge')"
                                    class="w-full px-4 py-3 flex items-center justify-between bg-[var(--md-surface-container)] hover:bg-[var(--md-surface-container-highest)] transition-colors"
                                >
                                    <span class="font-medium text-[var(--md-on-surface)]" x-text="t('settings.tagMerge.title')"></span>
                                    <span class="msym text-[20px] text-[var(--md-on-surface-variant)] transition-transform" :class="settingsAccordion.tagMerge ? 'rotate-180' : ''">expand_more</span>
                                </button>
                                <div x-show="settingsAccordion.tagMerge" x-collapse class="px-4 py-3 space-y-4">
                                    <p class="text-[var(--md-on-surface-variant)] text-xs" x-text="t('settings.tagMerge.desc')"></p>

                                    <!-- Purge Rare Tags -->
                                    <div class="border border-[var(--md-outline-variant)] rounded-2xl p-3 space-y-2 bg-[var(--md-surface-container-low)]">
                                        <label class="block text-sm font-medium text-[var(--md-on-surface)]" x-text="t('settings.tagMerge.purgeTitle')"></label>
                                        <p class="text-[var(--md-on-surface-variant)] text-xs" x-text="t('settings.tagMerge.purgeDesc')"></p>
                                        <div class="flex items-center gap-2 flex-wrap">
                                            <label class="text-xs text-[var(--md-on-surface-variant)]" x-text="t('settings.tagMerge.purgeThreshold')"></label>
                                            <input type="number" min="1" max="10" x-model.number="purgeMaxCount"
                                                   @change="previewRareTags()"
                                                   class="w-20 px-2 py-1 text-sm bg-[var(--md-surface)] border border-[var(--md-outline)] rounded-lg text-[var(--md-on-surface)]">
                                            <span class="text-xs text-[var(--md-on-surface-variant)]" x-text="t('settings.tagMerge.posts')"></span>
                                            <button @click="previewRareTags()" :disabled="purgeLoading"
                                                    class="px-3 py-1 text-sm rounded-full border border-[var(--md-outline)] text-[var(--md-primary)] hover:bg-[var(--md-primary-container)] disabled:opacity-50"
                                                    x-text="t('settings.tagMerge.preview')"></button>
                                        </div>
                                        <!-- Breakdown -->
                                        <template x-if="purgeBreakdowns.length > 0">
                                            <div class="space-y-1">
                                                <template x-for="b in purgeBreakdowns" :key="b.max_count">
                                                    <p class="text-xs text-[var(--md-on-surface-variant)]"
                                                       x-text="'≤ ' + b.max_count + (b.max_count === 1 ? ' post: ' : ' posts: ') + b.tag_count + ' ' + t('settings.tagMerge.tagsLabel')"></p>
                                                </template>
                                                <p class="text-xs text-[var(--md-on-surface-variant)]"
                                                   x-text="t('settings.tagMerge.totalTags').replace('{total}', purgeTotalTags).replace('{from}', '').replace('–{to}', '').replace('—', '—')"></p>
                                            </div>
                                        </template>
                                        <!-- Sample: error-container reads as "these will be deleted",
                                             consistent with the M3 error role used elsewhere for
                                             destructive previews. Tag name and count are separate
                                             elements — a trailing number, not glued "(N)" text, per
                                             the fix applied to the header's Starred button (step 8). -->
                                        <div x-show="purgeSample.length > 0" class="flex flex-wrap gap-1 max-h-24 overflow-y-auto">
                                            <template x-for="s in purgeSample" :key="s.tag">
                                                <span class="text-xs px-1.5 py-0.5 rounded-lg bg-[var(--md-error-container)] text-[var(--md-on-error-container)]">
                                                    <span x-text="s.tag"></span>
                                                    <span class="opacity-80" x-text="s.count"></span>
                                                </span>
                                            </template>
                                            <span x-show="purgeBreakdowns.length > 0 && purgeBreakdowns[purgeBreakdowns.length-1].tag_count > 50"
                                                  class="text-xs text-[var(--md-on-surface-variant)] italic">…</span>
                                        </div>
                                        <!-- Purge button -->
                                        <button x-show="purgeBreakdowns.length > 0"
                                                @click="purgeRareTags()"
                                                :disabled="purgingTags"
                                                class="px-3 py-1 text-sm rounded-full bg-[var(--md-error)] text-white hover:opacity-90 disabled:opacity-50">
                                            <span x-show="!purgingTags" x-text="t('settings.tagMerge.purgeApply').replace('{count}', purgeBreakdowns[purgeMaxCount-1]?.tag_count || 0)"></span>
                                            <span x-show="purgingTags" x-text="t('settings.tagMerge.purging')"></span>
                                        </button>
                                    </div>

                                    <!-- AI Merge Controls -->
                                    <div class="border-t border-[var(--md-outline-variant)] pt-3"></div>
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <label class="text-xs text-[var(--md-on-surface-variant)]" x-text="t('settings.tagMerge.offset')"></label>
                                        <input type="number" min="0" x-model.number="mergeOffset" class="w-20 px-2 py-1 text-sm bg-[var(--md-surface)] border border-[var(--md-outline)] rounded-lg text-[var(--md-on-surface)]">
                                        <label class="text-xs text-[var(--md-on-surface-variant)]" x-text="t('settings.tagMerge.batchSize')"></label>
                                        <input type="number" min="10" max="200" x-model.number="mergeBatchSize" class="w-20 px-2 py-1 text-sm bg-[var(--md-surface)] border border-[var(--md-outline)] rounded-lg text-[var(--md-on-surface)]">
                                        <button
                                            @click="suggestTagMerges()"
                                            :disabled="mergeSuggesting"
                                            class="px-3 py-1 text-sm rounded-full bg-[var(--md-primary)] text-[var(--md-on-primary)] hover:opacity-90 disabled:opacity-50 flex items-center gap-1 whitespace-nowrap"
                                        >
                                            <span x-show="mergeSuggesting" class="msym text-[12px] animate-spin">progress_activity</span>
                                            <span x-show="!mergeSuggesting" class="msym text-[12px]">auto_awesome</span>
                                            <span x-text="t('settings.tagMerge.analyze')"></span>
                                        </button>
                                    </div>

                                    <!-- Total tag count -->
                                    <p x-show="mergeTotalTags > 0" class="text-xs text-[var(--md-on-surface-variant)]"
                                       x-text="t('settings.tagMerge.totalTags').replace('{total}', mergeTotalTags).replace('{from}', mergeOffset).replace('{to}', Math.min(mergeOffset + mergeBatchSize, mergeTotalTags))">
                                    </p>

                                    <!-- Merge groups -->
                                    <div x-show="mergeGroups.length > 0" class="space-y-2 max-h-80 overflow-y-auto">
                                        <template x-for="(group, gi) in mergeGroups" :key="gi">
                                            <div class="border rounded-lg p-2"
                                                 :class="group.selected ? 'bg-[var(--md-primary-container)] border-[var(--md-primary)]' : 'border-[var(--md-outline-variant)]'">
                                                <div class="flex items-center gap-2 mb-1">
                                                    <input type="checkbox" x-model="group.selected" class="rounded accent-[var(--md-primary)]">
                                                    <span class="text-xs font-medium text-[var(--md-on-surface-variant)]" x-text="'→'"></span>
                                                    <input type="text" x-model="group.canonical"
                                                           class="flex-1 min-w-0 text-sm font-semibold bg-transparent border-b border-dashed border-[var(--md-outline)] focus:border-[var(--md-primary)] focus:outline-none px-1 py-0 text-[var(--md-on-surface)]"
                                                           :data-tip="t('settings.tagMerge.editCanonical')">
                                                </div>
                                                <div class="flex flex-wrap gap-1 ml-5">
                                                    <template x-for="(tag, ti) in group.merge" :key="ti">
                                                        <span class="inline-flex items-center gap-1 text-xs px-1.5 py-0.5 rounded-lg bg-[var(--md-surface-container-highest)] text-[var(--md-on-surface-variant)]">
                                                            <span x-text="tag"></span>
                                                            <button @click="group.merge.splice(ti, 1); if (group.merge.length === 0) mergeGroups.splice(gi, 1)" class="hover:text-[var(--md-error)]">&times;</button>
                                                        </span>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </div>

                                    <!-- Apply button -->
                                    <div x-show="mergeGroups.length > 0" class="flex items-center gap-2 flex-wrap">
                                        <button
                                            @click="applyTagMerges()"
                                            :disabled="mergeApplying || mergeGroups.filter(g => g.selected).length === 0"
                                            class="px-3 py-1 text-sm rounded-full bg-[var(--md-primary)] text-[var(--md-on-primary)] hover:opacity-90 disabled:opacity-50"
                                        >
                                            <span x-show="!mergeApplying" x-text="t('settings.tagMerge.apply')"></span>
                                            <span x-show="mergeApplying" x-text="t('settings.tagMerge.applying')"></span>
                                        </button>
                                        <button
                                            @click="mergeGroups.forEach(g => g.selected = true)"
                                            class="px-2 py-1 text-xs text-[var(--md-primary)] hover:underline"
                                            x-text="t('settings.tagMerge.selectAll')"
                                        ></button>
                                        <button
                                            @click="mergeGroups.forEach(g => g.selected = false)"
                                            class="px-2 py-1 text-xs text-[var(--md-primary)] hover:underline"
                                            x-text="t('settings.tagMerge.selectNone')"
                                        ></button>
                                    </div>

                                    <!-- Empty state -->
                                    <p x-show="mergeGroups.length === 0 && mergeTotalTags > 0 && !mergeSuggesting" class="text-xs text-[var(--md-on-surface-variant)] italic" x-text="t('settings.tagMerge.noGroups')"></p>
                                </div>
                            </div>

                            <!-- Version & Clear Cache -->
                            <div class="mt-4 pt-4 border-t border-[var(--md-outline-variant)] flex items-center justify-between">
                                <span class="text-xs text-[var(--md-on-surface-variant)]" x-text="'v' + appVersion"></span>
                                <div class="flex items-center gap-3">
                                    <button
                                        @click="resetCircuitBreaker()"
                                        class="text-xs text-[var(--md-primary)] hover:underline"
                                        x-text="t('settings.resetCircuitBreaker')"
                                    ></button>
                                    <button
                                        @click="clearCacheAndReload()"
                                        class="text-xs text-[var(--md-primary)] hover:underline"
                                        x-text="t('settings.clearCache')"
                                    ></button>
                                </div>
                            </div>

                        </div>

                        <!-- Status Tab -->
                        <div x-show="settingsTab === 'status'" class="space-y-6">
                            <!-- Loader -->
                            <template x-if="loadingStatus">
                                <div class="flex flex-col items-center justify-center py-12 space-y-4">
                                    <span class="msym text-[32px] animate-spin text-[var(--md-primary)]">progress_activity</span>
                                    <span class="text-sm text-[var(--md-on-surface-variant)]" x-text="t('settings.status.loading')"></span>
                                </div>
                            </template>

                            <!-- Content loaded -->
                            <template x-if="!loadingStatus && systemStatus">
                                <div class="space-y-6">

                                    <!-- Headline card: LLM queue. One full-tonal-fill primary-container
                                         block, same "AI content gets its own tinted block" rule as the
                                         post-detail summary panel (step 7) and the topic-suggestion
                                         review panel (step 14). Dropped the decorative corner gradient —
                                         no --md-* equivalent exists for it and it wasn't a mockup element,
                                         just leftover flourish from before this tab used the token set. -->
                                    <div class="p-5 rounded-2xl bg-[var(--md-primary-container)]">
                                        <div class="flex items-start gap-4">
                                            <div class="p-3 bg-[var(--md-primary)] text-[var(--md-on-primary)] rounded-xl flex-shrink-0">
                                                <span class="msym text-[24px]">auto_awesome</span>
                                            </div>
                                            <div class="flex-1 min-w-0">
                                                <h3 class="text-sm font-semibold text-[var(--md-on-primary-container)]" x-text="t('settings.status.llmQueue')"></h3>
                                                <p class="text-xs text-[var(--md-on-primary-container)] opacity-80 mt-1 max-w-[90%]" x-text="t('settings.status.llmQueueDesc')"></p>
                                                <div class="mt-4">
                                                    <span class="text-3xl font-extrabold text-[var(--md-on-primary-container)]" x-text="systemStatus.queue_size"></span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- General metrics grid. Plain surface-container tiles, no per-tile
                                         accent color — the mockup's rainbow badge set (blue/purple/
                                         emerald/orange) has no home in the app's 5-role M3 palette and
                                         wasn't an established per-item color elsewhere (unlike the star
                                         icon's amber, kept below since that one IS established app-wide,
                                         same reasoning as steps 6/8/14). -->
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                                        <!-- Starred -->
                                        <div class="p-4 rounded-2xl bg-[var(--md-surface-container)] flex items-center gap-3">
                                            <div class="p-2.5 rounded-lg bg-amber-100 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400">
                                                <span class="msym text-[20px]">star</span>
                                            </div>
                                            <div>
                                                <p class="text-xs text-[var(--md-on-surface-variant)] font-medium" x-text="t('settings.status.totalStarred')"></p>
                                                <p class="text-xl font-bold text-[var(--md-on-surface)] mt-0.5" x-text="systemStatus.starred_count"></p>
                                            </div>
                                        </div>

                                        <!-- Unread -->
                                        <div class="p-4 rounded-2xl bg-[var(--md-surface-container)] flex items-center gap-3">
                                            <div class="p-2.5 rounded-lg bg-[var(--md-surface-container-highest)] text-[var(--md-on-surface-variant)]">
                                                <span class="msym text-[20px]">check</span>
                                            </div>
                                            <div>
                                                <p class="text-xs text-[var(--md-on-surface-variant)] font-medium" x-text="t('settings.status.totalUnread')"></p>
                                                <p class="text-xl font-bold text-[var(--md-on-surface)] mt-0.5" x-text="systemStatus.unread_count"></p>
                                            </div>
                                        </div>

                                        <!-- Total Posts -->
                                        <div class="p-4 rounded-2xl bg-[var(--md-surface-container)] flex items-center gap-3">
                                            <div class="p-2.5 rounded-lg bg-[var(--md-surface-container-highest)] text-[var(--md-on-surface-variant)]">
                                                <span class="msym text-[20px]">folder</span>
                                            </div>
                                            <div>
                                                <p class="text-xs text-[var(--md-on-surface-variant)] font-medium" x-text="t('settings.status.totalPosts')"></p>
                                                <p class="text-xl font-bold text-[var(--md-on-surface)] mt-0.5" x-text="systemStatus.posts_count"></p>
                                            </div>
                                        </div>

                                        <!-- Feeds -->
                                        <div class="p-4 rounded-2xl bg-[var(--md-surface-container)] flex items-center gap-3">
                                            <div class="p-2.5 rounded-lg bg-[var(--md-surface-container-highest)] text-[var(--md-on-surface-variant)]">
                                                <span class="msym text-[20px]">rss_feed</span>
                                            </div>
                                            <div>
                                                <p class="text-xs text-[var(--md-on-surface-variant)] font-medium" x-text="t('settings.status.totalFeeds')"></p>
                                                <p class="text-xl font-bold text-[var(--md-on-surface)] mt-0.5" x-text="systemStatus.feeds_count"></p>
                                            </div>
                                        </div>

                                        <!-- DB Size -->
                                        <div class="p-4 rounded-2xl bg-[var(--md-surface-container)] flex items-center gap-3">
                                            <div class="p-2.5 rounded-lg bg-[var(--md-surface-container-highest)] text-[var(--md-on-surface-variant)]">
                                                <span class="msym text-[20px]">database</span>
                                            </div>
                                            <div>
                                                <p class="text-xs text-[var(--md-on-surface-variant)] font-medium" x-text="t('settings.status.dbSize')"></p>
                                                <p class="text-xl font-bold text-[var(--md-on-surface)] mt-0.5" x-text="systemStatus.db_size_mb + ' MB'"></p>
                                            </div>
                                        </div>

                                        <!-- Oldest Post Date -->
                                        <div class="p-4 rounded-2xl bg-[var(--md-surface-container)] flex items-center gap-3">
                                            <div class="p-2.5 rounded-lg bg-[var(--md-surface-container-highest)] text-[var(--md-on-surface-variant)]">
                                                <span class="msym text-[20px]">schedule</span>
                                            </div>
                                            <div>
                                                <p class="text-xs text-[var(--md-on-surface-variant)] font-medium" x-text="t('settings.status.oldestPost')"></p>
                                                <p class="text-sm font-bold text-[var(--md-on-surface)] mt-0.5" x-text="systemStatus.oldest_post_date ? formatDate(systemStatus.oldest_post_date) : t('time.unknown')"></p>
                                            </div>
                                        </div>

                                    </div>

                                    <!-- System & AI -->
                                    <div class="p-4 rounded-2xl bg-[var(--md-surface-container-low)] space-y-4">
                                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                            <div>
                                                <p class="text-sm font-semibold text-[var(--md-on-surface)]" x-text="t('settings.status.aiState')"></p>
                                                <!-- Health dot/text: a live on/off status indicator, not a
                                                     button or badge — same "no M3 role fits a transient
                                                     status color" reasoning that left the toast and OPML
                                                     result colors alone (steps 8/16). -->
                                                <div class="flex items-center gap-2 mt-1.5">
                                                    <span class="w-2.5 h-2.5 rounded-full" :class="systemStatus.circuit_breaker === 'closed' ? 'bg-green-500' : 'bg-red-500'"></span>
                                                    <span class="text-xs text-[var(--md-on-surface-variant)]" x-text="systemStatus.circuit_breaker === 'closed' ? t('settings.status.aiStateNormal') : t('settings.status.aiStateTriggered')"></span>
                                                </div>
                                            </div>

                                            <!-- Reset button -->
                                            <button
                                                @click="resetCircuitBreaker(); loadSystemStatus()"
                                                class="px-4 py-2 text-xs font-semibold rounded-full border border-[var(--md-outline)] text-[var(--md-primary)] hover:bg-[var(--md-primary-container)] transition-colors flex items-center gap-1.5 self-start sm:self-auto"
                                            >
                                                <span class="msym text-[14px]">refresh</span>
                                                <span x-text="t('settings.resetCircuitBreaker')"></span>
                                            </button>
                                        </div>

                                        <!-- Health warning, if any: a persistent banner (not a transient
                                             toast), so unlike the dot above it DOES get the M3 error role. -->
                                        <template x-if="systemStatus.health_warning">
                                            <div class="p-3 bg-[var(--md-error-container)] rounded-lg flex items-start gap-2 text-xs text-[var(--md-on-error-container)]">
                                                <span class="font-bold uppercase" x-text="t('settings.status.warning')"></span>
                                                <span x-text="systemStatus.health_warning"></span>
                                            </div>
                                        </template>
                                    </div>

                                    <!-- Summary maintenance -->
                                    <div class="p-4 rounded-2xl bg-[var(--md-surface-container-low)]">
                                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                            <div>
                                                <p class="text-sm font-semibold text-[var(--md-on-surface)]" x-text="t('settings.status.summaryMaintenance')"></p>
                                                <p class="text-xs text-[var(--md-on-surface-variant)] mt-1" x-text="t('settings.status.summaryMaintenanceDesc')"></p>
                                            </div>
                                            <button
                                                @click="deleteUnreadSummaries()"
                                                class="px-4 py-2 text-xs font-semibold rounded-full border border-[var(--md-error)] text-[var(--md-error)] hover:bg-[var(--md-error-container)] transition-colors flex items-center gap-1.5 self-start sm:self-auto"
                                            >
                                                <span class="msym text-[14px]">delete</span>
                                                <span x-text="t('settings.status.deleteUnreadSummaries')"></span>
                                            </button>
                                        </div>
                                    </div>

                                    <!-- Feed fetching schedule -->
                                    <div class="p-4 rounded-2xl bg-[var(--md-surface-container-low)] space-y-4">
                                        <div>
                                            <p class="text-sm font-semibold text-[var(--md-on-surface)]" x-text="t('settings.status.fetchingSection')"></p>

                                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-3 pt-3 border-t border-[var(--md-outline-variant)]">
                                                <!-- Interval -->
                                                <div>
                                                    <p class="text-[10px] text-[var(--md-on-surface-variant)] uppercase tracking-wider font-semibold" x-text="t('settings.status.fetchingInterval')"></p>
                                                    <p class="text-sm font-medium text-[var(--md-on-surface)] mt-1" x-text="t('settings.status.fetchingIntervalValue').replace('{n}', systemStatus.feed_update_interval)"></p>
                                                </div>

                                                <!-- Last Run -->
                                                <div>
                                                    <p class="text-[10px] text-[var(--md-on-surface-variant)] uppercase tracking-wider font-semibold" x-text="t('settings.status.fetchingLastRun')"></p>
                                                    <p class="text-sm font-medium text-[var(--md-on-surface)] mt-1" x-text="systemStatus.last_fetched_date ? formatDate(systemStatus.last_fetched_date) : t('time.unknown')"></p>
                                                </div>

                                                <!-- Scheduler State -->
                                                <div>
                                                    <p class="text-[10px] text-[var(--md-on-surface-variant)] uppercase tracking-wider font-semibold" x-text="t('settings.status.schedulerState')"></p>
                                                    <div class="flex items-center gap-1.5 mt-1">
                                                        <span class="w-2 h-2 rounded-full" :class="systemStatus.scheduler_active ? 'bg-green-500' : 'bg-red-500'"></span>
                                                        <span class="text-xs font-semibold" :class="systemStatus.scheduler_active ? 'text-green-600 dark:text-green-400' : 'text-red-500'" x-text="systemStatus.scheduler_active ? t('settings.status.schedulerActive') : t('settings.status.schedulerInactive')"></span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Manual metrics refresh -->
                                    <div class="flex justify-end pt-2">
                                        <button
                                            @click="loadSystemStatus()"
                                            class="px-4 py-2 text-xs font-semibold rounded-full border border-[var(--md-outline)] text-[var(--md-primary)] hover:bg-[var(--md-primary-container)] transition-colors flex items-center gap-1.5"
                                        >
                                            <span class="msym text-[14px]">refresh</span>
                                            <span x-text="t('settings.status.refresh')"></span>
                                        </button>
                                    </div>

                                </div>
                            </template>
                        </div>
                    </div>
                    </div>

                    <!-- Footer -->
                    <div class="p-4 border-t border-[var(--md-outline-variant)] text-right flex-none">
                        <button
                            @click="closeSettings()"
                            class="px-4 py-2 rounded-full border border-[var(--md-outline)] text-[var(--md-primary)] hover:bg-[var(--md-primary-container)] font-medium transition-colors"
                            x-text="t('settings.close')"
                        ></button>
                    </div>
                </div>
            </div>
        </template>

        <!-- Toast Notification -->
        <div
            x-show="toast.show"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-y-2"
            x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 translate-y-2"
            class="fixed bottom-4 left-4 right-4 z-[100] max-w-md mx-auto"
        >
            <div
                class="px-4 py-3 rounded-lg shadow-lg flex items-center justify-between gap-3"
                :class="{
                    'bg-green-600 text-white': toast.type === 'success',
                    'bg-red-600 text-white': toast.type === 'error',
                    'bg-blue-600 text-white': toast.type === 'info'
                }"
            >
                <div class="flex items-center gap-2">
                    <!-- Success icon -->
                    <span x-show="toast.type === 'success'" class="msym text-[20px] flex-shrink-0">check</span>
                    <!-- Error icon -->
                    <span x-show="toast.type === 'error'" class="msym text-[20px] flex-shrink-0">close</span>
                    <!-- Info icon -->
                    <span x-show="toast.type === 'info'" class="msym text-[20px] flex-shrink-0">info</span>
                    <span x-text="toast.message"></span>
                </div>
                <button @click="hideToast()" class="text-white/80 hover:text-white flex-shrink-0" :data-tip="t('modal.dismiss')" :aria-label="t('modal.dismiss')">
                    <span class="msym text-[20px]">close</span>
                </button>
            </div>
        </div>

        <!-- Custom Confirm Modal -->
        <div
            x-show="confirmModal.show"
            class="fixed inset-0 z-[200] flex items-center justify-center p-4"
            @keydown.escape.window="confirmModal.show && !confirmModal.loading && confirmCancel()"
            @keydown.enter.window="confirmModal.show && !confirmModal.loading && confirmOk()"
        >
            <!-- Backdrop with blur -->
            <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" @click="!confirmModal.loading && confirmCancel()"></div>

            <!-- Modal: 28px radius per the handoff's shape scale (windows/dialogs) -->
            <div class="relative bg-[var(--md-surface-container-high)] rounded-[28px] shadow-xl max-w-md w-full p-6">
                <!-- Loading state -->
                <div x-show="confirmModal.loading" class="flex items-center gap-3">
                    <span class="msym text-[20px] animate-spin text-[var(--md-primary)]">progress_activity</span>
                    <span class="text-[var(--md-on-surface)]" x-text="confirmModal.message"></span>
                </div>
                <!-- Confirm state -->
                <template x-if="!confirmModal.loading">
                    <div>
                        <p class="text-[var(--md-on-surface)] mb-6" x-text="confirmModal.message"></p>
                        <div class="flex justify-end gap-3">
                            <button
                                @click="confirmCancel()"
                                class="px-4 py-2 rounded-full border border-[var(--md-outline)] text-[var(--md-primary)] hover:bg-[var(--md-primary-container)] font-medium transition-colors"
                                x-text="t('categories.cancel')"
                            ></button>
                            <button
                                id="confirm-ok-btn"
                                @click="confirmOk()"
                                class="px-4 py-2 rounded-full bg-[var(--md-primary)] hover:opacity-90 text-[var(--md-on-primary)] font-medium transition-colors"
                            >OK</button>
                        </div>
                    </div>
                </template>
            </div>
        </div>

    </div>


</body>
</html>
