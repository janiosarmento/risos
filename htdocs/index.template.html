                                                min="0"
                                                max="2000"
                                                :value="suggestionMinSummaryLength"
                                                @change="setSuggestionMinSummaryLength($event.target.value)"
                                                class="w-24 px-3 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:border-blue-500"
                                            >
                                            <span class="text-sm text-gray-500 dark:text-gray-400" x-text="t('settings.characters')"></span>
                                        </div>
                                    </div>
                                    <!-- Ignored Tags -->
                                    <div class="pt-3 border-t border-gray-200 dark:border-gray-700">
                                        <label class="block text-sm font-medium mb-1" x-text="t('settings.ignoredTags')"></label>
                                        <p class="text-gray-500 dark:text-gray-400 text-xs mb-2" x-text="t('settings.ignoredTagsDesc')"></p>
                                        <div class="flex flex-wrap gap-1 mb-2" x-show="ignoredTags.size > 0">
                                            <template x-for="tag in [...ignoredTags].sort()" :key="tag">
                                                <span class="inline-flex items-center gap-1 text-xs px-1.5 py-0.5 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-600">
                                                    <span x-text="tag"></span>
                                                    <button @click="toggleTagIgnored(tag)" class="hover:text-red-500" :data-tip="t('tags.clearFilter')" :aria-label="t('tags.clearFilter')">&times;</button>
                                                </span>
                                            </template>
                                        </div>
                                        <p x-show="ignoredTags.size === 0" class="text-gray-400 text-xs italic" x-text="t('settings.noIgnoredTags')"></p>
                                    </div>
                                    <!-- Blocked Terms -->
                                    <div class="pt-3 border-t border-gray-200 dark:border-gray-700">
                                        <label for="setting-blocked-terms" class="block text-sm font-medium mb-1" x-text="t('settings.blockedTerms')"></label>
                                        <p class="text-gray-500 dark:text-gray-400 text-xs mb-2" x-text="t('settings.blockedTermsDesc')"></p>
                                        <textarea
                                            id="setting-blocked-terms"
                                            :value="blockedTermsSorted()"
                                            @change="setBlockedTerms($event.target.value)"
                                            :placeholder="t('settings.blockedTermsPlaceholder')"
                                            rows="6"
                                            class="w-full px-3 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:border-blue-500 text-sm font-mono"
                                        ></textarea>
                                    </div>
                                </div>
                            </div>

                            <!-- Tag Consolidation -->
                            <div class="border border-gray-200 dark:border-gray-700 rounded-lg overflow-hidden">
                                <button
                                    @click="toggleAccordion('tagMerge')"
                                    class="w-full px-4 py-3 flex items-center justify-between bg-gray-50 dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-750 transition-colors"
                                >
                                    <span class="font-medium" x-text="t('settings.tagMerge.title')"></span>
                                    <span class="msym text-[20px] transition-transform" :class="settingsAccordion.tagMerge ? 'rotate-180' : ''">expand_more</span>
                                </button>
                                <div x-show="settingsAccordion.tagMerge" x-collapse class="px-4 py-3 space-y-4">
                                    <p class="text-gray-500 dark:text-gray-400 text-xs" x-text="t('settings.tagMerge.desc')"></p>

                                    <!-- Purge Rare Tags -->
                                    <div class="border border-gray-200 dark:border-gray-700 rounded p-3 space-y-2 bg-gray-50 dark:bg-gray-800/50">
                                        <label class="block text-sm font-medium" x-text="t('settings.tagMerge.purgeTitle')"></label>
                                        <p class="text-gray-500 dark:text-gray-400 text-xs" x-text="t('settings.tagMerge.purgeDesc')"></p>
                                        <div class="flex items-center gap-2 flex-wrap">
                                            <label class="text-xs text-gray-500 dark:text-gray-400" x-text="t('settings.tagMerge.purgeThreshold')"></label>
                                            <input type="number" min="1" max="10" x-model.number="purgeMaxCount"
                                                   @change="previewRareTags()"
                                                   class="w-20 px-2 py-1 text-sm bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded">
                                            <span class="text-xs text-gray-500 dark:text-gray-400" x-text="t('settings.tagMerge.posts')"></span>
                                            <button @click="previewRareTags()" :disabled="purgeLoading"
                                                    class="px-3 py-1 text-sm bg-gray-200 dark:bg-gray-700 rounded hover:bg-gray-300 dark:hover:bg-gray-600 disabled:opacity-50"
                                                    x-text="t('settings.tagMerge.preview')"></button>
                                        </div>
                                        <!-- Breakdown -->
                                        <template x-if="purgeBreakdowns.length > 0">
                                            <div class="space-y-1">
                                                <template x-for="b in purgeBreakdowns" :key="b.max_count">
                                                    <p class="text-xs text-gray-500 dark:text-gray-400"
                                                       x-text="'≤ ' + b.max_count + (b.max_count === 1 ? ' post: ' : ' posts: ') + b.tag_count + ' ' + t('settings.tagMerge.tagsLabel')"></p>
                                                </template>
                                                <p class="text-xs text-gray-500 dark:text-gray-400"
                                                   x-text="t('settings.tagMerge.totalTags').replace('{total}', purgeTotalTags).replace('{from}', '').replace('–{to}', '').replace('—', '—')"></p>
                                            </div>
                                        </template>
                                        <!-- Sample -->
                                        <div x-show="purgeSample.length > 0" class="flex flex-wrap gap-1 max-h-24 overflow-y-auto">
                                            <template x-for="s in purgeSample" :key="s.tag">
                                                <span class="text-xs px-1.5 py-0.5 rounded-full bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400"
                                                      x-text="s.tag + ' (' + s.count + ')'"></span>
                                            </template>
                                            <span x-show="purgeBreakdowns.length > 0 && purgeBreakdowns[purgeBreakdowns.length-1].tag_count > 50"
                                                  class="text-xs text-gray-400 italic">…</span>
                                        </div>
                                        <!-- Purge button -->
                                        <button x-show="purgeBreakdowns.length > 0"
                                                @click="purgeRareTags()"
                                                :disabled="purgingTags"
                                                class="px-3 py-1 text-sm bg-red-600 text-white rounded hover:bg-red-700 disabled:opacity-50">
                                            <span x-show="!purgingTags" x-text="t('settings.tagMerge.purgeApply').replace('{count}', purgeBreakdowns[purgeMaxCount-1]?.tag_count || 0)"></span>
                                            <span x-show="purgingTags" x-text="t('settings.tagMerge.purging')"></span>
                                        </button>
                                    </div>

                                    <!-- AI Merge Controls -->
                                    <div class="border-t border-gray-200 dark:border-gray-700 pt-3"></div>
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <label class="text-xs text-gray-500 dark:text-gray-400" x-text="t('settings.tagMerge.offset')"></label>
                                        <input type="number" min="0" x-model.number="mergeOffset" class="w-20 px-2 py-1 text-sm bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded">
                                        <label class="text-xs text-gray-500 dark:text-gray-400" x-text="t('settings.tagMerge.batchSize')"></label>
                                        <input type="number" min="10" max="200" x-model.number="mergeBatchSize" class="w-20 px-2 py-1 text-sm bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded">
                                        <button
                                            @click="suggestTagMerges()"
                                            :disabled="mergeSuggesting"
                                            class="px-3 py-1 text-sm bg-blue-600 text-white rounded hover:bg-blue-700 disabled:opacity-50 flex items-center gap-1 whitespace-nowrap"
                                        >
                                            <span x-show="mergeSuggesting" class="msym text-[12px] animate-spin">progress_activity</span>
                                            <span x-show="!mergeSuggesting" class="msym text-[12px]">auto_awesome</span>
                                            <span x-text="t('settings.tagMerge.analyze')"></span>
                                        </button>
                                    </div>

                                    <!-- Total tag count -->
                                    <p x-show="mergeTotalTags > 0" class="text-xs text-gray-500 dark:text-gray-400"
                                       x-text="t('settings.tagMerge.totalTags').replace('{total}', mergeTotalTags).replace('{from}', mergeOffset).replace('{to}', Math.min(mergeOffset + mergeBatchSize, mergeTotalTags))">
                                    </p>

                                    <!-- Merge groups -->
                                    <div x-show="mergeGroups.length > 0" class="space-y-2 max-h-80 overflow-y-auto">
                                        <template x-for="(group, gi) in mergeGroups" :key="gi">
                                            <div class="border border-gray-200 dark:border-gray-700 rounded p-2"
                                                 :class="group.selected ? 'bg-blue-50 dark:bg-blue-900/20 border-blue-300 dark:border-blue-700' : ''">
                                                <div class="flex items-center gap-2 mb-1">
                                                    <input type="checkbox" x-model="group.selected" class="rounded">
                                                    <span class="text-xs font-medium text-gray-400" x-text="'→'"></span>
                                                    <input type="text" x-model="group.canonical"
                                                           class="text-sm font-semibold bg-transparent border-b border-dashed border-gray-400 dark:border-gray-500 focus:border-blue-500 focus:outline-none px-1 py-0"
                                                           :data-tip="t('settings.tagMerge.editCanonical')">
                                                </div>
                                                <div class="flex flex-wrap gap-1 ml-5">
                                                    <template x-for="(tag, ti) in group.merge" :key="ti">
                                                        <span class="inline-flex items-center gap-1 text-xs px-1.5 py-0.5 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-400">
                                                            <span x-text="tag"></span>
                                                            <button @click="group.merge.splice(ti, 1); if (group.merge.length === 0) mergeGroups.splice(gi, 1)" class="hover:text-red-500">&times;</button>
                                                        </span>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </div>

                                    <!-- Apply button -->
                                    <div x-show="mergeGroups.length > 0" class="flex items-center gap-2">
                                        <button
                                            @click="applyTagMerges()"
                                            :disabled="mergeApplying || mergeGroups.filter(g => g.selected).length === 0"
                                            class="px-3 py-1 text-sm bg-green-600 text-white rounded hover:bg-green-700 disabled:opacity-50"
                                        >
                                            <span x-show="!mergeApplying" x-text="t('settings.tagMerge.apply')"></span>
                                            <span x-show="mergeApplying" x-text="t('settings.tagMerge.applying')"></span>
                                        </button>
                                        <button
                                            @click="mergeGroups.forEach(g => g.selected = true)"
                                            class="px-2 py-1 text-xs text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 underline"
                                            x-text="t('settings.tagMerge.selectAll')"
                                        ></button>
                                        <button
                                            @click="mergeGroups.forEach(g => g.selected = false)"
                                            class="px-2 py-1 text-xs text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 underline"
                                            x-text="t('settings.tagMerge.selectNone')"
                                        ></button>
                                    </div>

                                    <!-- Empty state -->
                                    <p x-show="mergeGroups.length === 0 && mergeTotalTags > 0 && !mergeSuggesting" class="text-xs text-gray-400 italic" x-text="t('settings.tagMerge.noGroups')"></p>
                                </div>
                            </div>

                            <!-- Version & Clear Cache -->
                            <div class="mt-4 pt-4 border-t border-gray-200 dark:border-gray-700 flex items-center justify-between">
                                <span class="text-xs text-gray-400 dark:text-gray-500" x-text="'v' + appVersion"></span>
                                <div class="flex items-center gap-3">
                                    <button
                                        @click="resetCircuitBreaker()"
                                        class="text-xs text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 underline"
                                        x-text="t('settings.resetCircuitBreaker')"
                                    ></button>
                                    <button
                                        @click="clearCacheAndReload()"
                                        class="text-xs text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 underline"
                                        x-text="t('settings.clearCache')"
                                    ></button>
                                </div>
                            </div>

                        </div>

                        <!-- Status Tab -->
                        <div x-show="settingsTab === 'status'" class="space-y-6">
                            <!-- Loader -->
                            <template x-if="loadingStatus">
                                <div class="flex flex-col items-center justify-center py-12 space-y-4">
                                    <span class="msym text-[32px] animate-spin text-blue-600 dark:text-blue-400">progress_activity</span>
                                    <span class="text-sm text-gray-500 dark:text-gray-400" x-text="t('settings.status.loading')"></span>
                                </div>
                            </template>

                            <!-- Content loaded -->
                            <template x-if="!loadingStatus && systemStatus">
                                <div class="space-y-6">
                                    
                                    <!-- Destaque Principal: Fila de IA -->
                                    <div class="p-5 rounded-xl border border-blue-200 dark:border-blue-900/50 bg-blue-50/50 dark:bg-blue-950/20 shadow-sm relative overflow-hidden transition-all hover:shadow-md">
                                        <div class="absolute right-0 top-0 h-full w-24 bg-gradient-to-l from-blue-500/5 to-transparent pointer-events-none"></div>
                                        
                                        <div class="flex items-start gap-4">
                                            <div class="p-3 bg-blue-600 text-white rounded-xl shadow-md flex-shrink-0 animate-pulse">
                                                <span class="msym text-[24px]">auto_awesome</span>
                                            </div>
                                            <div class="flex-1 min-w-0">
                                                <h3 class="text-sm font-semibold text-blue-800 dark:text-blue-300" x-text="t('settings.status.llmQueue')"></h3>
                                                <p class="text-xs text-blue-600/80 dark:text-blue-400/80 mt-1 max-w-[90%]" x-text="t('settings.status.llmQueueDesc')"></p>
                                                
                                                <div class="mt-4">
                                                    <span class="text-3xl font-extrabold text-blue-900 dark:text-blue-200" x-text="systemStatus.queue_size"></span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Grid de Métricas Gerais -->
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        
                                        <!-- Starred -->
                                        <div class="p-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/40 shadow-sm hover:shadow transition-all flex items-center gap-3">
                                            <div class="p-2.5 rounded-lg bg-yellow-100 dark:bg-yellow-900/30 text-yellow-600 dark:text-yellow-400">
                                                <span class="msym text-[20px]">star</span>
                                            </div>
                                            <div>
                                                <p class="text-xs text-gray-500 dark:text-gray-400 font-medium" x-text="t('settings.status.totalStarred')"></p>
                                                <p class="text-xl font-bold text-gray-800 dark:text-gray-200 mt-0.5" x-text="systemStatus.starred_count"></p>
                                            </div>
                                        </div>

                                        <!-- Unread -->
                                        <div class="p-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/40 shadow-sm hover:shadow transition-all flex items-center gap-3">
                                            <div class="p-2.5 rounded-lg bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400">
                                                <span class="msym text-[20px]">check</span>
                                            </div>
                                            <div>
                                                <p class="text-xs text-gray-500 dark:text-gray-400 font-medium" x-text="t('settings.status.totalUnread')"></p>
                                                <p class="text-xl font-bold text-gray-800 dark:text-gray-200 mt-0.5" x-text="systemStatus.unread_count"></p>
                                            </div>
                                        </div>

                                        <!-- Total Posts -->
                                        <div class="p-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/40 shadow-sm hover:shadow transition-all flex items-center gap-3">
                                            <div class="p-2.5 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-400">
                                                <span class="msym text-[20px]">folder</span>
                                            </div>
                                            <div>
                                                <p class="text-xs text-gray-500 dark:text-gray-400 font-medium" x-text="t('settings.status.totalPosts')"></p>
                                                <p class="text-xl font-bold text-gray-800 dark:text-gray-200 mt-0.5" x-text="systemStatus.posts_count"></p>
                                            </div>
                                        </div>

                                        <!-- Feeds -->
                                        <div class="p-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/40 shadow-sm hover:shadow transition-all flex items-center gap-3">
                                            <div class="p-2.5 rounded-lg bg-purple-100 dark:bg-purple-900/30 text-purple-600 dark:text-purple-400">
                                                <span class="msym text-[20px]">rss_feed</span>
                                            </div>
                                            <div>
                                                <p class="text-xs text-gray-500 dark:text-gray-400 font-medium" x-text="t('settings.status.totalFeeds')"></p>
                                                <p class="text-xl font-bold text-gray-800 dark:text-gray-200 mt-0.5" x-text="systemStatus.feeds_count"></p>
                                            </div>
                                        </div>

                                        <!-- DB Size -->
                                        <div class="p-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/40 shadow-sm hover:shadow transition-all flex items-center gap-3">
                                            <div class="p-2.5 rounded-lg bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400">
                                                <span class="msym text-[20px]">database</span>
                                            </div>
                                            <div>
                                                <p class="text-xs text-gray-500 dark:text-gray-400 font-medium" x-text="t('settings.status.dbSize')"></p>
                                                <p class="text-xl font-bold text-gray-800 dark:text-gray-200 mt-0.5" x-text="systemStatus.db_size_mb + ' MB'"></p>
                                            </div>
                                        </div>

                                        <!-- Oldest Post Date -->
                                        <div class="p-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/40 shadow-sm hover:shadow transition-all flex items-center gap-3">
                                            <div class="p-2.5 rounded-lg bg-orange-100 dark:bg-orange-900/30 text-orange-600 dark:text-orange-400">
                                                <span class="msym text-[20px]">schedule</span>
                                            </div>
                                            <div>
                                                <p class="text-xs text-gray-500 dark:text-gray-400 font-medium" x-text="t('settings.status.oldestPost')"></p>
                                                <p class="text-sm font-bold text-gray-800 dark:text-gray-200 mt-0.5" x-text="systemStatus.oldest_post_date ? formatDate(systemStatus.oldest_post_date) : t('time.unknown')"></p>
                                            </div>
                                        </div>

                                    </div>

                                    <!-- Sistema e IA -->
                                    <div class="p-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/20 space-y-4">
                                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                            <div>
                                                <p class="text-sm font-semibold text-gray-700 dark:text-gray-300" x-text="t('settings.status.aiState')"></p>
                                                <div class="flex items-center gap-2 mt-1.5">
                                                    <span class="w-2.5 h-2.5 rounded-full" :class="systemStatus.circuit_breaker === 'closed' ? 'bg-green-500' : 'bg-red-500'"></span>
                                                    <span class="text-xs text-gray-600 dark:text-gray-400" x-text="systemStatus.circuit_breaker === 'closed' ? t('settings.status.aiStateNormal') : t('settings.status.aiStateTriggered')"></span>
                                                </div>
                                            </div>
                                            
                                            <!-- Botão de Reset Integrado -->
                                            <button 
                                                @click="resetCircuitBreaker(); loadSystemStatus()"
                                                class="px-4 py-2 text-xs font-semibold text-blue-600 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/20 border border-blue-200 dark:border-blue-800 rounded-lg transition-colors flex items-center gap-1.5 self-start sm:self-auto"
                                            >
                                                <span class="msym text-[14px]">refresh</span>
                                                <span x-text="t('settings.resetCircuitBreaker')"></span>
                                            </button>
                                        </div>

                                        <!-- Aviso de saúde se houver -->
                                        <template x-if="systemStatus.health_warning">
                                            <div class="p-3 bg-red-50 dark:bg-red-950/20 border border-red-200 dark:border-red-900/50 rounded-lg flex items-start gap-2 text-xs text-red-700 dark:text-red-400">
                                                <span class="font-bold uppercase" x-text="t('settings.status.warning')"></span>
                                                <span x-text="systemStatus.health_warning"></span>
                                            </div>
                                        </template>
                                    </div>

                                    <!-- Manutenção de Resumos -->
                                    <div class="p-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/20">
                                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                            <div>
                                                <p class="text-sm font-semibold text-gray-700 dark:text-gray-300" x-text="t('settings.status.summaryMaintenance')"></p>
                                                <p class="text-xs text-gray-500 dark:text-gray-400 mt-1" x-text="t('settings.status.summaryMaintenanceDesc')"></p>
                                            </div>
                                            <button
                                                @click="deleteUnreadSummaries()"
                                                class="px-4 py-2 text-xs font-semibold text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg transition-colors flex items-center gap-1.5 self-start sm:self-auto"
                                            >
                                                <span class="msym text-[14px]">delete</span>
                                                <span x-text="t('settings.status.deleteUnreadSummaries')"></span>
                                            </button>
                                        </div>
                                    </div>

                                    <!-- Agendamento & Busca de Feeds -->
                                    <div class="p-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/20 space-y-4">
                                        <div>
                                            <p class="text-sm font-semibold text-gray-700 dark:text-gray-300" x-text="t('settings.status.fetchingSection')"></p>
                                            
                                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-3 pt-3 border-t border-gray-200 dark:border-gray-700/50">
                                                <!-- Interval -->
                                                <div>
                                                    <p class="text-[10px] text-gray-400 dark:text-gray-500 uppercase tracking-wider font-semibold" x-text="t('settings.status.fetchingInterval')"></p>
                                                    <p class="text-sm font-medium text-gray-700 dark:text-gray-300 mt-1" x-text="t('settings.status.fetchingIntervalValue').replace('{n}', systemStatus.feed_update_interval)"></p>
                                                </div>
                                                
                                                <!-- Last Run -->
                                                <div>
                                                    <p class="text-[10px] text-gray-400 dark:text-gray-500 uppercase tracking-wider font-semibold" x-text="t('settings.status.fetchingLastRun')"></p>
                                                    <p class="text-sm font-medium text-gray-700 dark:text-gray-300 mt-1" x-text="systemStatus.last_fetched_date ? formatDate(systemStatus.last_fetched_date) : t('time.unknown')"></p>
                                                </div>
                                                
                                                <!-- Scheduler State -->
                                                <div>
                                                    <p class="text-[10px] text-gray-400 dark:text-gray-500 uppercase tracking-wider font-semibold" x-text="t('settings.status.schedulerState')"></p>
                                                    <div class="flex items-center gap-1.5 mt-1">
                                                        <span class="w-2 h-2 rounded-full" :class="systemStatus.scheduler_active ? 'bg-green-500' : 'bg-red-500'"></span>
                                                        <span class="text-xs font-semibold" :class="systemStatus.scheduler_active ? 'text-green-600 dark:text-green-400' : 'text-red-500'" x-text="systemStatus.scheduler_active ? t('settings.status.schedulerActive') : t('settings.status.schedulerInactive')"></span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <!-- Ação Manual de Atualização das Métricas -->
                                    <div class="flex justify-end pt-2">
                                        <button 
                                            @click="loadSystemStatus()" 
                                            class="px-4 py-2 text-xs font-semibold bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-lg transition-colors flex items-center gap-1.5"
                                        >
                                            <span class="msym text-[14px]">refresh</span>
                                            <span x-text="t('settings.status.refresh')"></span>
                                        </button>
                                    </div>

                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Footer -->
                    <div class="p-4 border-t border-gray-200 dark:border-gray-700 text-right">
                        <button
                            @click="closeSettings()"
                            class="px-4 py-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 rounded"
                            x-text="t('settings.close')"
                        ></button>
                    </div>
                </div>
            </div>
        </template>

        <!-- Toast Notification -->
        <div
            x-show="toast.show"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-y-2"
            x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 translate-y-2"
            class="fixed bottom-4 left-4 right-4 z-[100] max-w-md mx-auto"
        >
            <div
                class="px-4 py-3 rounded-lg shadow-lg flex items-center justify-between gap-3"
                :class="{
                    'bg-green-600 text-white': toast.type === 'success',
                    'bg-red-600 text-white': toast.type === 'error',
                    'bg-blue-600 text-white': toast.type === 'info'
                }"
            >
                <div class="flex items-center gap-2">
                    <!-- Success icon -->
                    <span x-show="toast.type === 'success'" class="msym text-[20px] flex-shrink-0">check</span>
                    <!-- Error icon -->
                    <span x-show="toast.type === 'error'" class="msym text-[20px] flex-shrink-0">close</span>
                    <!-- Info icon -->
                    <span x-show="toast.type === 'info'" class="msym text-[20px] flex-shrink-0">info</span>
                    <span x-text="toast.message"></span>
                </div>
                <button @click="hideToast()" class="text-white/80 hover:text-white flex-shrink-0" :data-tip="t('modal.dismiss')" :aria-label="t('modal.dismiss')">
                    <span class="msym text-[20px]">close</span>
                </button>
            </div>
        </div>

        <!-- Custom Confirm Modal -->
        <div
            x-show="confirmModal.show"
            class="fixed inset-0 z-[200] flex items-center justify-center p-4"
            @keydown.escape.window="confirmModal.show && !confirmModal.loading && confirmCancel()"
            @keydown.enter.window="confirmModal.show && !confirmModal.loading && confirmOk()"
        >
            <!-- Backdrop with blur -->
            <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" @click="!confirmModal.loading && confirmCancel()"></div>

            <!-- Modal -->
            <div class="relative bg-white dark:bg-gray-800 rounded-lg shadow-xl max-w-md w-full p-6">
                <!-- Loading state -->
                <div x-show="confirmModal.loading" class="flex items-center gap-3">
                    <span class="msym text-[20px] animate-spin text-blue-500">progress_activity</span>
                    <span class="text-gray-900 dark:text-gray-100" x-text="confirmModal.message"></span>
                </div>
                <!-- Confirm state -->
                <template x-if="!confirmModal.loading">
                    <div>
                        <p class="text-gray-900 dark:text-gray-100 mb-6" x-text="confirmModal.message"></p>
                        <div class="flex justify-end gap-3">
                            <button
                                @click="confirmCancel()"
                                class="px-4 py-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 rounded font-medium transition-colors"
                                x-text="t('categories.cancel')"
                            ></button>
                            <button
                                id="confirm-ok-btn"
                                @click="confirmOk()"
                                class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded font-medium transition-colors"
                            >OK</button>
                        </div>
                    </div>
                </template>
            </div>
        </div>

    </div>


</body>
</html>
