                                <div class="max-h-[30vh] overflow-y-auto pr-1 space-y-1.5 scrollbar-thin">
                                    <template x-for="p in relatedPosts" :key="p.id">
                                        <label class="flex items-start gap-2.5 p-2 bg-gray-50 dark:bg-gray-700/30 hover:bg-purple-50/40 dark:hover:bg-purple-950/10 rounded cursor-pointer transition-colors border border-transparent hover:border-purple-100 dark:hover:border-purple-900/30">
                                            <input 
                                                type="checkbox" 
                                                :checked="selectedRelatedPosts.has(p.id)"
                                                @change="toggleRelatedPostSelection(p.id)"
                                                class="mt-1 rounded text-purple-600 focus:ring-purple-500 border-gray-300 dark:border-gray-600 dark:bg-gray-700"
                                            >
                                            <div class="text-xs md:text-sm font-medium text-gray-800 dark:text-gray-200 leading-tight">
                                                <span x-text="p.title"></span>
                                                <span class="text-xs text-purple-600 dark:text-purple-400 font-normal ml-1" x-text="'(' + p.feed_title + ' • ' + t('modal.commonTags').replace('{count}', p.common_tags_count) + ')'"></span>
                                            </div>
                                        </label>
                                    </template>
                                </div>

                                <!-- Process Trigger -->
                                <div class="pt-2 border-t border-gray-100 dark:border-gray-700 flex justify-end">
                                    <button
                                        @click="processRelatedPosts()"
                                        :disabled="selectedRelatedPosts.size === 0 || assistantGenerating"
                                        class="px-4 py-2 bg-purple-600 hover:bg-purple-700 disabled:opacity-40 disabled:cursor-not-allowed text-white rounded font-medium text-sm flex items-center gap-1.5 shadow-md shadow-purple-500/10 transition-all active:scale-[0.98]"
                                    >
                                        <svg x-show="assistantGenerating" class="animate-spin h-4 w-4 text-white"><use href="#icon-spinner"/></svg>
                                        <svg x-show="!assistantGenerating" class="w-4 h-4 text-white"><use href="#icon-sparkles"/></svg>
                                        <span x-text="assistantGenerating ? t('modal.processing') : t('modal.process')"></span>
                                    </button>
                                </div>
                            </div>

                            <!-- LLM Response consolidated summary -->
                            <div 
                                x-show="assistantSummary || assistantGenerating" 
                                class="mt-4 p-4 rounded-lg bg-purple-50/40 dark:bg-purple-950/10 border border-purple-100 dark:border-purple-900/30"
                            >
                                <div class="flex items-center justify-between mb-2">
                                    <h3 class="text-xs md:text-sm font-bold text-purple-800 dark:text-purple-300 flex items-center gap-1.5">
                                        <svg class="w-4 h-4"><use href="#icon-sparkles"/></svg>
                                        <span x-text="t('modal.consolidatedSummary')"></span>
                                    </h3>
                                    <div class="flex items-center gap-2" x-show="assistantSummary">
                                        <button
                                            @click="markProcessedAsRead()"
                                            :disabled="assistantMarkingRead"
                                            class="text-xs px-2.5 py-1 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 border border-purple-200 dark:border-purple-900/50 text-purple-700 dark:text-purple-300 rounded shadow-sm transition-all flex items-center gap-1"
                                        >
                                            <svg x-show="assistantMarkingRead" class="animate-spin h-3 w-3 text-purple-600"><use href="#icon-spinner"/></svg>
                                            <span x-text="t('modal.markAsRead')"></span>
                                        </button>
                                        <button
                                            @click="copyAssistantSummary()"
                                            class="text-xs px-2.5 py-1 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 border border-purple-200 dark:border-purple-900/50 text-purple-700 dark:text-purple-300 rounded shadow-sm transition-all"
                                            x-text="t('modal.copyConsolidated')"
                                        ></button>
                                    </div>
                                </div>

                                <!-- Generating Spinner State -->
                                <div x-show="assistantGenerating" class="flex flex-col items-center justify-center py-6 space-y-2">
                                    <svg class="animate-spin h-6 w-6 text-purple-600 dark:text-purple-400"><use href="#icon-spinner"/></svg>
                                    <span class="text-xs text-purple-600 dark:text-purple-400 font-medium" x-text="t('modal.generating')"></span>
                                </div>

                                <!-- Rendered Markdown result -->
                                <div 
                                    x-show="assistantSummary"
                                    class="text-xs md:text-sm text-gray-800 dark:text-gray-200 leading-relaxed max-h-[30vh] overflow-y-auto pr-1 summary-content scrollbar-thin"
                                    x-html="renderMarkdown(assistantSummary || '')"
                                ></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- Settings Modal -->
        <template x-if="showSettings">
            <div
                class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4"
                @click.self="closeSettings()"
                @keydown.escape.window="closeSettings()"
            >
                <div
                    class="bg-white dark:bg-gray-800 rounded-lg shadow-xl w-full max-w-2xl max-h-[90vh] md:max-h-[80vh] flex flex-col"
                    role="dialog"
                    aria-modal="true"
                    aria-labelledby="settings-dialog-title"
                >
                    <!-- Header -->
                    <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
                        <h2 id="settings-dialog-title" class="text-lg font-bold" x-text="t('settings.title')"></h2>
                        <button @click="closeSettings()" class="text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white text-2xl">&times;</button>
                    </div>

                    <!-- Tabs -->
                    <div class="flex border-b border-gray-200 dark:border-gray-700">
                        <button
                            @click="settingsTab = 'categories'"
                            class="px-4 py-2 text-sm font-medium"
                            :class="settingsTab === 'categories' ? 'text-blue-600 dark:text-blue-400 border-b-2 border-blue-600 dark:border-blue-400' : 'text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'"
                            x-text="t('settings.tabs.categories')"
                        ></button>
                        <button
                            @click="settingsTab = 'feeds'"
                            class="px-4 py-2 text-sm font-medium"
                            :class="settingsTab === 'feeds' ? 'text-blue-600 dark:text-blue-400 border-b-2 border-blue-600 dark:border-blue-400' : 'text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'"
                            x-text="t('settings.tabs.feeds')"
                        ></button>
                        <button
                            @click="settingsTab = 'opml'"
                            class="px-4 py-2 text-sm font-medium"
                            :class="settingsTab === 'opml' ? 'text-blue-600 dark:text-blue-400 border-b-2 border-blue-600 dark:border-blue-400' : 'text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'"
                            x-text="t('settings.tabs.opml')"
                        ></button>
                        <button
                            @click="settingsTab = 'ai'"
                            class="px-4 py-2 text-sm font-medium"
                            :class="settingsTab === 'ai' ? 'text-blue-600 dark:text-blue-400 border-b-2 border-blue-600 dark:border-blue-400' : 'text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'"
                            x-text="t('settings.tabs.ai')"
                        ></button>
                        <button
                            @click="settingsTab = 'topics'; loadTopics()"
                            class="px-4 py-2 text-sm font-medium"
                            :class="settingsTab === 'topics' ? 'text-blue-600 dark:text-blue-400 border-b-2 border-blue-600 dark:border-blue-400' : 'text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'"
                            x-text="t('settings.tabs.topics')"
                        ></button>
                        <button
                            @click="settingsTab = 'general'"
                            class="px-4 py-2 text-sm font-medium"
                            :class="settingsTab === 'general' ? 'text-blue-600 dark:text-blue-400 border-b-2 border-blue-600 dark:border-blue-400' : 'text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'"
                            x-text="t('settings.tabs.general')"
                        ></button>
                        <button
                            @click="settingsTab = 'status'; loadSystemStatus()"
                            class="px-4 py-2 text-sm font-medium"
                            :class="settingsTab === 'status' ? 'text-blue-600 dark:text-blue-400 border-b-2 border-blue-600 dark:border-blue-400' : 'text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'"
                            x-text="t('settings.tabs.status')"
                        ></button>
                    </div>

                    <!-- Content -->
                    <div id="settings-content" class="flex-1 overflow-y-auto p-4"
                        @dragover="if (dragTagName) {
                            const rect = $el.getBoundingClientRect();
                            const y = $event.clientY;
                            const edge = 40;
                            if (y - rect.top < edge) $el.scrollBy(0, -8);
                            else if (rect.bottom - y < edge) $el.scrollBy(0, 8);
                        }"
                    >
                        <!-- Categories Tab -->
                        <div x-show="settingsTab === 'categories'">
                            <!-- Add Category -->
                            <form @submit.prevent="createCategory()" class="mb-4 flex gap-2">
                                <input
                                    type="text"
                                    x-model="newCategoryName"
                                    :placeholder="t('categories.newPlaceholder')"
                                    class="flex-1 px-3 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:border-blue-500"
                                >
                                <button
                                    type="submit"
                                    class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded font-medium"
                                    :disabled="savingCategory || !newCategoryName.trim()"
                                >
                                    <span x-show="!savingCategory" x-text="t('categories.create')"></span>
                                    <span x-show="savingCategory">...</span>
                                </button>
                            </form>

                            <!-- Categories List -->
                            <div class="space-y-2">
                                <template x-for="category in categories" :key="category.id">
                                    <div class="bg-gray-100 dark:bg-gray-700 rounded p-3">
                                        <!-- View Mode -->
                                        <div x-show="!editingCategory || editingCategory.id !== category.id" class="flex items-center justify-between">
                                            <div class="flex items-center gap-2">
                                                <svg class="w-4 h-4 text-gray-500 dark:text-gray-400"><use href="#icon-folder"/></svg>
                                                <span x-text="category.name" class="font-medium"></span>
                                                <span class="text-gray-500 text-sm" x-text="'(' + feeds.filter(f => f.category_id === category.id).length + ' feeds)'"></span>
                                            </div>
                                            <div class="flex items-center gap-2">
                                                <button
                                                    @click="startEditCategory(category)"
                                                    class="text-gray-500 dark:text-gray-400 hover:text-blue-500 dark:hover:text-blue-400 text-sm"
                                                    x-text="t('categories.edit')"
                                                ></button>
                                                <button
                                                    @click="deleteCategory(category)"
                                                    class="text-gray-500 dark:text-gray-400 hover:text-red-500 dark:hover:text-red-400 text-sm"
                                                    x-text="t('categories.delete')"
                                                ></button>
                                            </div>
                                        </div>
                                        <!-- Edit Mode -->
                                        <template x-if="editingCategory && editingCategory.id === category.id">
                                            <div class="flex gap-2">
                                                <input
                                                    type="text"
                                                    x-model="editingCategory.name"
                                                    class="flex-1 px-3 py-1 bg-white dark:bg-gray-600 border border-gray-300 dark:border-gray-500 rounded focus:outline-none focus:border-blue-500"
                                                >
                                                <button
                                                    @click="saveCategory()"
                                                    class="px-3 py-1 bg-blue-600 hover:bg-blue-700 rounded text-sm text-white"
                                                    :disabled="savingCategory"
                                                    x-text="t('categories.save')"
                                                ></button>
                                                <button
                                                    @click="cancelEditCategory()"
                                                    class="px-3 py-1 bg-gray-300 dark:bg-gray-600 hover:bg-gray-400 dark:hover:bg-gray-500 rounded text-sm"
                                                    x-text="t('categories.cancel')"
                                                ></button>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                                <template x-if="categories.length === 0">
                                    <div class="text-gray-500 text-center py-4" x-text="t('categories.noCategories')"></div>
                                </template>
                            </div>
                        </div>

                        <!-- Feeds Tab -->
                        <div x-show="settingsTab === 'feeds'">
                            <!-- Add Feed -->
                            <form @submit.prevent="createFeed()" class="mb-4 space-y-2">
                                <div class="flex gap-2">
                                    <input
                                        type="url"
                                        x-model="newFeed.url"
                                        :placeholder="t('feeds.urlPlaceholder')"
                                        class="flex-1 px-3 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:border-blue-500"
                                    >
                                    <select
                                        x-model="newFeed.category_id"
                                        class="px-3 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:border-blue-500"
                                        required
                                    >
                                        <option value="" disabled selected x-text="t('feeds.selectCategory')"></option>
                                        <template x-for="cat in categories" :key="cat.id">
                                            <option :value="cat.id" x-text="cat.name"></option>
                                        </template>
                                    </select>
                                    <button
                                        type="submit"
                                        class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded font-medium whitespace-nowrap min-w-[120px]"
                                        :disabled="savingFeed || !newFeed.url.trim() || !newFeed.category_id"
                                    >
                                        <span x-show="!savingFeed" x-text="t('feeds.add')"></span>
                                        <span x-show="savingFeed" x-text="t('feeds.adding')"></span>
                                    </button>
                                </div>
                            </form>

                            <!-- Feeds List -->
                            <div class="space-y-2">
                                <template x-for="feed in feeds" :key="feed.id">
                                    <div class="bg-gray-100 dark:bg-gray-700 rounded p-3">
                                        <!-- View Mode -->
                                        <div x-show="!editingFeed || editingFeed.id !== feed.id">
                                            <div class="flex items-start justify-between">
                                                <div class="flex-1 min-w-0">
                                                    <div class="flex items-center gap-2">
                                                        <svg class="w-3 h-3 text-gray-500 flex-shrink-0"><use href="#icon-rss"/></svg>
                                                        <span x-text="feed.title" class="font-medium truncate"></span>
                                                        <span x-show="feed.error_count > 0" class="text-red-400 text-xs">!</span>
                                                    </div>
                                                    <div class="text-sm text-gray-500 truncate mt-1" x-text="feed.url"></div>
                                                    <div class="text-xs text-gray-500 mt-1">
                                                        <span x-text="categories.find(c => c.id === feed.category_id)?.name || t('sidebar.noCategory')"></span>
                                                        <span> | </span>
                                                        <span x-text="feed.unread_count + ' ' + t('feeds.unreadCount')"></span>
                                                    </div>
                                                </div>
                                                <div class="flex items-center gap-2 ml-2 flex-shrink-0">
                                                    <button
                                                        @click="startEditFeed(feed)"
                                                        class="text-gray-500 dark:text-gray-400 hover:text-blue-500 dark:hover:text-blue-400 text-sm"
                                                        x-text="t('feeds.edit')"
                                                    ></button>
                                                    <button
                                                        x-show="!feed.starred_count"
                                                        @click="deleteFeed(feed)"
                                                        class="text-gray-500 dark:text-gray-400 hover:text-red-500 dark:hover:text-red-400 text-sm"
                                                        x-text="t('feeds.delete')"
                                                    ></button>
                                                    <span
                                                        x-show="feed.starred_count > 0"
                                                        class="text-amber-500 dark:text-amber-400"
                                                        :data-tip="t('feeds.hasStarredPosts')"
                                                    >&#9733;</span>
                                                </div>
                                            </div>
                                        </div>
                                        <!-- Edit Mode -->
                                        <template x-if="editingFeed && editingFeed.id === feed.id">
                                            <div class="space-y-2">
                                                <input
                                                    type="url"
                                                    x-model="editingFeed.url"
                                                    :placeholder="t('feeds.urlPlaceholder')"
                                                    class="w-full px-3 py-1 bg-white dark:bg-gray-600 border border-gray-300 dark:border-gray-500 rounded focus:outline-none focus:border-blue-500 font-mono text-sm"
                                                >
                                                <input
                                                    type="text"
                                                    x-model="editingFeed.title"
                                                    :placeholder="t('feeds.titlePlaceholder')"
                                                    class="w-full px-3 py-1 bg-white dark:bg-gray-600 border border-gray-300 dark:border-gray-500 rounded focus:outline-none focus:border-blue-500"
                                                >
                                                <div class="flex gap-2">
                                                    <select
                                                        x-model="editingFeed.category_id"
                                                        class="flex-1 px-3 py-1 bg-white dark:bg-gray-600 border border-gray-300 dark:border-gray-500 rounded focus:outline-none focus:border-blue-500"
                                                    >
                                                        <option :value="null" x-text="t('sidebar.noCategory')"></option>
                                                        <template x-for="cat in categories" :key="cat.id">
                                                            <option :value="cat.id" x-text="cat.name"></option>
                                                        </template>
                                                    </select>
                                                    <div class="flex items-center gap-1 shrink-0">
                                                        <label class="text-xs text-gray-500 dark:text-gray-400 whitespace-nowrap" x-text="t('feeds.feedWeight')"></label>
                                                        <input
                                                            type="number"
                                                            min="0"
                                                            step="1"
                                                            x-model.number="editingFeed.weight"
                                                            class="w-16 px-2 py-1 bg-white dark:bg-gray-600 border border-gray-300 dark:border-gray-500 rounded focus:outline-none focus:border-blue-500 text-sm"
                                                        >
                                                    </div>
                                                    <button
                                                        @click="saveFeed()"
                                                        class="px-3 py-1 bg-blue-600 hover:bg-blue-700 rounded text-sm text-white"
                                                        :disabled="savingFeed"
                                                        x-text="t('feeds.save')"
                                                    ></button>
                                                    <button
                                                        @click="cancelEditFeed()"
                                                        class="px-3 py-1 bg-gray-300 dark:bg-gray-600 hover:bg-gray-400 dark:hover:bg-gray-500 rounded text-sm"
                                                        x-text="t('feeds.cancel')"
                                                    ></button>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                                <template x-if="feeds.length === 0">
                                    <div class="text-gray-500 text-center py-4" x-text="t('feeds.noFeeds')"></div>
                                </template>
                            </div>
                        </div>

                        <!-- OPML Tab -->
                        <div x-show="settingsTab === 'opml'" class="space-y-6">
                            <!-- Import -->
                            <div>
                                <h3 class="text-lg font-medium mb-3" x-text="t('opml.importTitle')"></h3>
                                <p class="text-gray-400 text-sm mb-3" x-text="t('opml.importDesc')"></p>
                                <div class="flex items-center gap-3">
                                    <input
                                        type="file"
                                        id="opmlFile"
                                        accept=".opml,.xml"
                                        @change="handleOpmlFile($event)"
                                        class="hidden"
                                    >
                                    <button
                                        @click="document.getElementById('opmlFile').click()"
                                        class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded font-medium"
                                        :disabled="importingOpml"
                                    >
                                        <span x-show="!importingOpml" x-text="t('opml.chooseFile')"></span>
                                        <span x-show="importingOpml" x-text="t('opml.importing')"></span>
                                    </button>
                                    <span x-show="opmlResult" class="text-sm" :class="opmlResult?.errors?.length ? 'text-yellow-400' : 'text-green-400'" x-text="opmlResultText()"></span>
                                </div>
                            </div>

                            <!-- Export -->
                            <div class="border-t border-gray-200 dark:border-gray-700 pt-6">
                                <h3 class="text-lg font-medium mb-3" x-text="t('opml.exportTitle')"></h3>
                                <p class="text-gray-500 dark:text-gray-400 text-sm mb-3" x-text="t('opml.exportDesc')"></p>
                                <button
                                    @click="exportOpml()"
                                    class="px-4 py-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 rounded font-medium"
                                    x-text="t('opml.download')"
                                ></button>
                            </div>
                        </div>

                        <!-- AI Tab -->
                        <div x-show="settingsTab === 'ai'" class="space-y-4">
                            <!-- Jano Secret Name -->
                            <div>
                                <label for="setting-jano-secret-name" class="block text-sm font-medium mb-1" x-text="t('settings.janoSecretName')"></label>
                                <p class="text-gray-500 dark:text-gray-400 text-xs mb-2" x-text="t('settings.janoSecretNameDesc')"></p>
                                <input
                                    id="setting-jano-secret-name"
                                    type="text"
                                    x-model="janoSecretName"
                                    :placeholder="t('settings.janoSecretNamePlaceholder')"
                                    class="w-full px-3 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:border-blue-500 font-mono text-sm"
                                />
                            </div>

                            <!-- API Base URL -->
                            <div class="pt-3 border-t border-gray-200 dark:border-gray-700">
                                <label for="setting-api-base-url" class="block text-sm font-medium mb-1" x-text="t('settings.apiBaseUrl')"></label>
                                <p class="text-gray-500 dark:text-gray-400 text-xs mb-2" x-text="t('settings.apiBaseUrlDesc')"></p>
                                <input
                                    id="setting-api-base-url"
                                    type="url"
                                    x-model="apiBaseUrl"
                                    :placeholder="t('settings.apiBaseUrlPlaceholder')"
                                    @change="onApiBaseUrlChange()"
                                    class="w-full px-3 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:border-blue-500 font-mono text-sm"
                                />
                            </div>

                            <!-- AI Model -->
                            <div class="pt-3 border-t border-gray-200 dark:border-gray-700">
                                <label for="setting-ai-model" class="block text-sm font-medium mb-1" x-text="t('settings.aiModel')"></label>
                                <p class="text-gray-500 dark:text-gray-400 text-xs mb-2" x-text="t('settings.aiModelDesc')"></p>
                                <div class="flex items-center gap-2">
                                    <select
                                        id="setting-ai-model"
                                        @change="setAiModel($event.target.value)"
                                        class="flex-1 max-w-xs px-3 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:border-blue-500"
                                        :disabled="availableModels.length === 0"
                                    >
                                        <template x-if="availableModels.length === 0">
                                            <option x-text="t('settings.loadingModels')"></option>
                                        </template>
                                        <template x-for="model in availableModels" :key="model.id">
                                            <option :value="model.id" :selected="aiModel === model.id" x-text="model.id"></option>
                                        </template>
                                    </select>
                                    <button
                                        @click="clearModelsCache()"
                                        class="px-3 py-2 bg-gray-200 dark:bg-gray-600 hover:bg-gray-300 dark:hover:bg-gray-500 rounded text-sm transition-colors"
                                        :data-tip="t('settings.refreshModels')"
                                        :aria-label="t('settings.refreshModels')"
                                    >
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h5M20 20v-5h-5M4 9a9 9 0 0 1 15.36-4.36M20 15a9 9 0 0 1-15.36 4.36"/></svg>
                                    </button>
                                </div>
                            </div>

                            <!-- AI Timeout -->
                            <div class="pt-3 border-t border-gray-200 dark:border-gray-700">
                                <label for="setting-ai-timeout" class="block text-sm font-medium mb-1" x-text="t('settings.aiTimeout')"></label>
                                <div class="flex items-center gap-2">
                                    <input
                                        id="setting-ai-timeout"
                                        type="number"
                                        min="5" max="600"
                                        x-model.number="aiTimeout"
                                        @change="saveAiSettings()"
                                        class="w-24 px-3 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:border-blue-500 text-sm"
                                    >
                                    <span class="text-sm text-gray-500">s</span>
                                </div>
                            </div>

                            <!-- AI Max Tokens -->
                            <div class="pt-3 border-t border-gray-200 dark:border-gray-700">
                                <label for="setting-ai-max-tokens" class="block text-sm font-medium mb-1" x-text="t('settings.aiMaxTokens')"></label>
                                <div class="flex items-center gap-2">
                                    <input
                                        id="setting-ai-max-tokens"
                                        type="number"
                                        min="256" max="32768" step="256"
                                        x-model.number="aiMaxTokens"
                                        @change="saveAiSettings()"
                                        class="w-32 px-3 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:border-blue-500 text-sm"
                                    >
                                    <span class="text-sm text-gray-500">tokens</span>
                                </div>
                            </div>

                            <!-- Summary Language -->
                            <div class="pt-3 border-t border-gray-200 dark:border-gray-700">
                                <label for="setting-summary-language" class="block text-sm font-medium mb-1" x-text="t('settings.summaryLanguage')"></label>
                                <p class="text-gray-500 dark:text-gray-400 text-xs mb-2" x-text="t('settings.summaryLanguageDesc')"></p>
                                <select
                                    id="setting-summary-language"
                                    @change="setSummaryLanguage($event.target.value)"
                                    class="w-full max-w-xs px-3 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:border-blue-500"
                                >
                                    <template x-for="lang in availableSummaryLanguages" :key="lang.code">
                                        <option :value="lang.code" :selected="summaryLanguage === lang.code" x-text="lang.name"></option>
                                    </template>
                                </select>
                            </div>

                            <!-- Tags per Post -->
                            <div class="pt-3 border-t border-gray-200 dark:border-gray-700">
                                <label for="setting-tags-per-post" class="block text-sm font-medium mb-1" x-text="t('settings.tagsPerPost')"></label>
                                <p class="text-gray-500 dark:text-gray-400 text-xs mb-2" x-text="t('settings.tagsPerPostDesc')"></p>
                                <div class="flex items-center gap-2">
                                    <input
                                        id="setting-tags-per-post"
                                        type="range"
                                        min="3" max="15" step="1"
                                        :value="tagsPerPost"
                                        @input="setTagsPerPost($event.target.value)"
                                        class="flex-1"
                                    >
                                    <span class="text-sm font-mono w-8 text-center" x-text="tagsPerPost"></span>
                                    <span class="text-sm text-gray-500" x-text="t('settings.tags')"></span>
                                </div>
                            </div>

                            <!-- Model Cooldown -->
                            <div class="pt-3 border-t border-gray-200 dark:border-gray-700">
                                <label for="setting-model-cooldown" class="block text-sm font-medium mb-1" x-text="t('settings.modelCooldown')"></label>
                                <p class="text-gray-500 dark:text-gray-400 text-xs mb-2" x-text="t('settings.modelCooldownDesc')"></p>
                                <div class="flex items-center gap-2">
                                    <input
                                        id="setting-model-cooldown"
                                        type="range"
                                        min="5" max="120" step="5"
                                        :value="modelCooldownMinutes"
                                        @input="setModelCooldown($event.target.value)"
                                        class="flex-1"
                                    >
                                    <span class="text-sm font-mono w-8 text-center" x-text="modelCooldownMinutes"></span>
                                    <span class="text-sm text-gray-500">min</span>
                                </div>
                            </div>

                            <!-- Related Posts Limit for Assistant -->
                            <div class="pt-3 border-t border-gray-200 dark:border-gray-700">
                                <label for="setting-related-posts-limit" class="block text-sm font-medium mb-1" x-text="t('settings.relatedPostsLimit')"></label>
                                <p class="text-gray-500 dark:text-gray-400 text-xs mb-2" x-text="t('settings.relatedPostsLimitDesc')"></p>
                                <div class="flex items-center gap-2">
                                    <input
                                        id="setting-related-posts-limit"
                                        type="range"
                                        min="5" max="100" step="5"
                                        :value="relatedPostsLimit"
                                        @input="setRelatedPostsLimit($event.target.value)"
                                        class="flex-1"
                                    >
                                    <span class="text-sm font-mono w-8 text-center" x-text="relatedPostsLimit"></span>
                                    <span class="text-sm text-gray-500" x-text="t('settings.posts')"></span>
                                </div>
                            </div>


                            <!-- System Prompt -->
                            <div class="pt-3 border-t border-gray-200 dark:border-gray-700">
                                <label for="setting-system-prompt" class="block text-sm font-medium mb-1" x-text="t('settings.systemPrompt')"></label>
                                <p class="text-gray-500 dark:text-gray-400 text-xs mb-2" x-text="t('settings.systemPromptDesc')"></p>
                                <textarea
                                    id="setting-system-prompt"
                                    x-model="systemPrompt"
                                    rows="10"
                                    class="w-full px-3 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:border-blue-500 font-mono text-sm"
                                ></textarea>
                            </div>

                            <!-- User Prompt -->
                            <div class="pt-3 border-t border-gray-200 dark:border-gray-700">
                                <label for="setting-user-prompt" class="block text-sm font-medium mb-1" x-text="t('settings.userPrompt')"></label>
                                <p class="text-gray-500 dark:text-gray-400 text-xs mb-2" x-text="t('settings.userPromptDesc')"></p>
                                <textarea
                                    id="setting-user-prompt"
                                    x-model="userPrompt"
                                    rows="8"
                                    class="w-full px-3 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:border-blue-500 font-mono text-sm"
                                ></textarea>
                            </div>

                            <!-- Action buttons -->
                            <div class="pt-3 border-t border-gray-200 dark:border-gray-700 flex items-center gap-3">
                                <button
                                    @click="resetPromptsToDefaults()"
