                                ></button>
                            </div>
                        </div>

                        <!-- Topics Tab -->
                        <div x-show="settingsTab === 'topics'" class="space-y-4">
                            <!-- AI Suggestion -->
                            <div class="flex items-center justify-between">
                                <h3 class="text-sm font-medium" x-text="t('settings.topics.title')"></h3>
                                <button
                                    @click="suggestTopics()"
                                    :disabled="suggestingTopics"
                                    class="px-3 py-1.5 text-xs bg-purple-600 text-white rounded hover:bg-purple-700 disabled:opacity-50 flex items-center gap-1"
                                >
                                    <svg x-show="suggestingTopics" class="w-3 h-3 animate-spin"><use href="#icon-spinner"/></svg>
                                    <svg x-show="!suggestingTopics" class="w-3 h-3"><use href="#icon-sparkles"/></svg>
                                    <span x-text="t('settings.topics.suggestWithAI')"></span>
                                </button>
                            </div>

                            <!-- AI Suggestion Review -->
                            <template x-if="topicSuggestions">
                                <div class="space-y-3 p-3 bg-purple-50 dark:bg-purple-900/20 rounded-lg border border-purple-200 dark:border-purple-700">
                                    <div class="flex items-center justify-between">
                                        <span class="text-sm font-medium text-purple-700 dark:text-purple-300" x-text="t('settings.topics.aiSuggestions') + ' (' + (topicSuggestions.suggestions?.length || 0) + ')'"></span>
                                        <div class="flex gap-2">
                                            <button
                                                @click="acceptAllTopicSuggestions()"
                                                class="px-2 py-1 text-xs bg-green-600 text-white rounded hover:bg-green-700"
                                                x-text="t('settings.topics.acceptAll')"
                                            ></button>
                                            <button
                                                @click="topicSuggestions = null"
                                                class="px-2 py-1 text-xs bg-gray-300 dark:bg-gray-600 text-gray-700 dark:text-gray-200 rounded hover:bg-gray-400 dark:hover:bg-gray-500"
                                                x-text="t('settings.topics.dismiss')"
                                            ></button>
                                        </div>
                                    </div>
                                    <template x-for="(suggestion, idx) in topicSuggestions.suggestions" :key="idx">
                                        <div class="bg-white dark:bg-gray-800 rounded p-3 border border-purple-200 dark:border-purple-600">
                                            <div class="flex items-center justify-between mb-2">
                                                <input
                                                    type="text"
                                                    x-model="suggestion.name"
                                                    class="text-sm font-medium bg-transparent border-b border-gray-300 dark:border-gray-600 focus:border-purple-500 outline-none px-1 py-0.5"
                                                />
                                                <button
                                                    @click="acceptTopicSuggestion(suggestion)"
                                                    class="px-2 py-1 text-xs bg-green-600 text-white rounded hover:bg-green-700"
                                                    x-text="t('settings.topics.accept')"
                                                ></button>
                                            </div>
                                            <div class="flex flex-wrap gap-1">
                                                <template x-for="(tag, tidx) in suggestion.tags" :key="tidx">
                                                    <span class="inline-flex items-center gap-0.5 text-xs px-1.5 py-0.5 rounded-full bg-purple-100 dark:bg-purple-900/40 text-purple-700 dark:text-purple-300">
                                                        <span x-text="tag"></span>
                                                        <button @click="suggestion.tags.splice(tidx, 1)" class="hover:text-red-500">&times;</button>
                                                    </span>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                    <template x-if="topicSuggestions.orphan_tags?.length > 0">
                                        <div class="text-xs text-gray-500 dark:text-gray-400">
                                            <span x-text="t('settings.topics.orphanTags') + ': '"></span>
                                            <span x-text="topicSuggestions.orphan_tags.join(', ')"></span>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <!-- Create new topic -->
                            <div class="flex gap-2">
                                <input
                                    type="text"
                                    x-model="newTopicName"
                                    @keydown.enter="if (newTopicName.trim()) { createTopic(newTopicName.trim()); newTopicName = ''; }"
                                    :placeholder="t('settings.topics.newTopicPlaceholder')"
                                    class="flex-1 text-sm px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-900 dark:text-white"
                                />
                                <button
                                    @click="if (newTopicName.trim()) { createTopic(newTopicName.trim()); newTopicName = ''; }"
                                    class="px-3 py-1.5 text-xs bg-blue-600 text-white rounded hover:bg-blue-700"
                                    x-text="t('settings.topics.create')"
                                ></button>
                            </div>

                            <!-- Existing topics list -->
                            <div class="space-y-2">
                                <template x-for="topic in topics" :key="topic.id">
                                    <div
                                        class="bg-gray-50 dark:bg-gray-700/50 rounded-lg p-3 border-2 transition-colors"
                                        :class="dragOverTopicId === topic.id
                                            ? (dragTagCopy
                                                ? 'border-green-400 bg-green-50 dark:bg-green-900/20'
                                                : 'border-blue-400 bg-blue-50 dark:bg-blue-900/20')
                                            : 'border-gray-200 dark:border-gray-600'"
                                        @dragover="onTopicDragOver($event, topic.id)"
                                        @dragleave="onTopicDragLeave($event, topic.id)"
                                        @drop="onTopicDrop($event, topic.id)"
                                    >
                                        <div class="flex items-center justify-between mb-2">
                                            <template x-if="editingTopic === topic.id">
                                                <input
                                                    type="text"
                                                    x-model="editingTopicName"
                                                    @keydown.enter="renameTopic(topic.id)"
                                                    @keydown.escape="editingTopic = null"
                                                    @blur="renameTopic(topic.id)"
                                                    x-init="$nextTick(() => $el.focus())"
                                                    class="text-sm font-medium bg-white dark:bg-gray-600 border border-gray-300 dark:border-gray-500 rounded px-2 py-0.5"
                                                />
                                            </template>
                                            <template x-if="editingTopic !== topic.id">
                                                <span class="text-sm font-medium flex items-center gap-1.5">
                                                    <span x-text="topic.name"></span>
                                                    <span
                                                        x-show="dragOverTopicId === topic.id"
                                                        class="text-[10px] px-1.5 py-0.5 rounded-full font-normal"
                                                        :class="dragTagCopy
                                                            ? 'bg-green-200 dark:bg-green-800 text-green-700 dark:text-green-300'
                                                            : 'bg-blue-200 dark:bg-blue-800 text-blue-700 dark:text-blue-300'"
                                                        x-text="dragTagCopy ? t('settings.topics.copy') : t('settings.topics.move')"
                                                    ></span>
                                                </span>
                                            </template>
                                            <div class="flex items-center gap-2">
                                                <span class="text-xs text-gray-500 dark:text-gray-400" x-text="topic.post_count + ' posts'"></span>
                                                <button
                                                    @click="editingTopicName = topic.name; editingTopic = topic.id"
                                                    class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300"
                                                    :data-tip="t('settings.topics.rename')"
                                                    :aria-label="t('settings.topics.rename')"
                                                >
                                                    <svg class="w-3.5 h-3.5"><use href="#icon-edit"/></svg>
                                                </button>
                                                <button
                                                    @click="suggestTagsForTopic(topic.id)"
                                                    :disabled="suggestingTagsForTopicId !== null"
                                                    class="px-1.5 py-0.5 text-[10px] text-purple-600 dark:text-purple-400 border border-purple-300 dark:border-purple-600 rounded hover:bg-purple-50 dark:hover:bg-purple-900/30 disabled:opacity-50 flex items-center gap-0.5"
                                                    :data-tip="t('settings.topics.suggestTags')"
                                                    :aria-label="t('settings.topics.suggestTags')"
                                                >
                                                    <svg x-show="suggestingTagsForTopicId === topic.id" class="w-3 h-3 animate-spin"><use href="#icon-spinner"/></svg>
                                                    <svg x-show="suggestingTagsForTopicId !== topic.id" class="w-3 h-3"><use href="#icon-sparkles"/></svg>
                                                    <span x-text="t('settings.topics.suggestTags')"></span>
                                                </button>
                                                <button
                                                    @click="deleteTopic(topic.id)"
                                                    class="text-red-500 hover:text-red-700 text-sm"
                                                    :data-tip="t('settings.topics.delete')"
                                                    :aria-label="t('settings.topics.delete')"
                                                >&times;</button>
                                            </div>
                                        </div>
                                        <div class="flex flex-wrap gap-1 mb-2">
                                            <template x-for="tag in topic.tags" :key="tag">
                                                <span
                                                    draggable="true"
                                                    @dragstart="onTagDragStart($event, tag, topic.id)"
                                                    @dragend="onTagDragEnd($event)"
                                                    class="inline-flex items-center gap-0.5 text-xs px-1.5 py-0.5 rounded-full bg-gray-200 dark:bg-gray-600 text-gray-700 dark:text-gray-300 cursor-grab active:cursor-grabbing"
                                                >
                                                    <span x-text="tag"></span>
                                                    <button @click="removeTagFromTopic(topic.id, tag)" class="hover:text-red-500">&times;</button>
                                                </span>
                                            </template>
                                        </div>
                                        <div class="relative flex gap-1" x-data="{
                                            val: '', suggestions: [], selIdx: -1, debounceTimer: null,
                                            async search() {
                                                if (this.val.trim().length >= 1) {
                                                    try { const r = await fetchApi('/tags/search?q=' + encodeURIComponent(this.val.trim()) + '&exclude_topic_id=' + topic.id); this.suggestions = r.tags || []; this.selIdx = -1; } catch(e) { this.suggestions = []; }
                                                } else { this.suggestions = []; }
                                            },
                                            async pick(tag) {
                                                await addTagsToTopic(topic.id, [tag]);
                                                this.suggestions = this.suggestions.filter(s => s.tag !== tag);
                                                this.$nextTick(() => this.$refs.input.focus());
                                            }
                                        }" @click.away="suggestions = []; val = ''">
                                            <input
                                                type="text"
                                                x-ref="input"
                                                x-model="val"
                                                @input="clearTimeout(debounceTimer); debounceTimer = setTimeout(() => search(), 200)"
                                                @keydown.arrow-down.prevent="if (suggestions.length) selIdx = (selIdx + 1) % suggestions.length"
                                                @keydown.arrow-up.prevent="if (suggestions.length) selIdx = selIdx <= 0 ? suggestions.length - 1 : selIdx - 1"
                                                @keydown.enter.prevent="if (selIdx >= 0 && suggestions[selIdx]) { pick(suggestions[selIdx].tag); selIdx = -1; } else if (val.trim() && suggestions.length) { pick(suggestions[0].tag); }"
                                                @keydown.escape="suggestions = []; val = ''"
                                                :placeholder="t('settings.topics.addTagPlaceholder')"
                                                class="flex-1 text-xs px-2 py-1 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-900 dark:text-white"
                                                autocomplete="off"
                                            />
                                            <!-- Autocomplete dropdown -->
                                            <div x-show="suggestions.length > 0" class="absolute top-full left-0 right-8 mt-1 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 rounded shadow-lg z-50 max-h-48 overflow-y-auto">
                                                <template x-for="(s, idx) in suggestions" :key="s.tag">
                                                    <button
                                                        @click="pick(s.tag)"
                                                        class="w-full text-left px-3 py-1.5 text-xs flex justify-between items-center"
                                                        :class="idx === selIdx ? 'bg-blue-100 dark:bg-blue-900/40' : 'hover:bg-gray-100 dark:hover:bg-gray-700'"
                                                    >
                                                        <span x-text="s.tag"></span>
                                                        <span class="text-gray-400 text-[10px]" x-text="s.count + ' posts'"></span>
                                                    </button>
                                                </template>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                                <template x-if="topics.length === 0">
                                    <p class="text-sm text-gray-500 dark:text-gray-400 text-center py-4" x-text="t('settings.topics.empty')"></p>
                                </template>
                            </div>
                        </div>

                        <!-- General Tab -->
                        <div x-show="settingsTab === 'general'" class="space-y-2">

                            <!-- Accordion: Appearance -->
                            <div class="border border-gray-200 dark:border-gray-700 rounded-lg overflow-hidden">
                                <button
                                    @click="toggleAccordion('appearance')"
                                    class="w-full px-4 py-3 flex items-center justify-between bg-gray-50 dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-750 transition-colors"
                                >
                                    <span class="font-medium" x-text="t('settings.theme')"></span>
                                    <svg class="w-5 h-5 transition-transform" :class="settingsAccordion.appearance ? 'rotate-180' : ''"><use href="#icon-chevron-down"/></svg>
                                </button>
                                <div x-show="settingsAccordion.appearance" x-collapse class="p-4 space-y-4">
                                    <!-- Theme -->
                                    <div>
                                        <p class="text-gray-500 dark:text-gray-400 text-sm mb-3" x-text="t('settings.themeDesc')"></p>
                                        <div class="flex flex-wrap gap-2">
                                            <template x-for="themeOption in availableThemes" :key="themeOption.value">
                                                <button
                                                    @click="setTheme(themeOption.value)"
                                                    class="px-4 py-2 rounded font-medium transition-colors"
                                                    :class="theme === themeOption.value ? 'bg-blue-600 text-white' : 'bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600'"
                                                    x-text="t(themeOption.labelKey)"
                                                ></button>
                                            </template>
                                        </div>
                                    </div>
                                    <!-- Language -->
                                    <div class="pt-3 border-t border-gray-200 dark:border-gray-700">
                                        <label for="setting-language" class="block text-sm font-medium mb-1" x-text="t('settings.language')"></label>
                                        <p class="text-gray-500 dark:text-gray-400 text-xs mb-2" x-text="t('settings.languageDesc')"></p>
                                        <select
                                            id="setting-language"
                                            @change="setLocale($event.target.value)"
                                            class="w-full max-w-xs px-3 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:border-blue-500"
                                        >
                                            <template x-for="loc in availableLocales" :key="loc.code">
                                                <option :value="loc.code" :selected="locale === loc.code" x-text="loc.name"></option>
                                            </template>
                                        </select>
                                    </div>
                                    <!-- Reading Mode -->
                                    <div class="pt-3 border-t border-gray-200 dark:border-gray-700">
                                        <label class="block text-sm font-medium mb-1" x-text="t('settings.readingMode')"></label>
                                        <p class="text-gray-500 dark:text-gray-400 text-xs mb-2" x-text="t('settings.readingModeDesc')"></p>
                                        <div class="flex flex-wrap gap-2">
                                            <button
                                                @click="setReadingMode('fullscreen')"
                                                class="px-4 py-2 rounded font-medium transition-colors"
                                                :class="readingMode === 'fullscreen' ? 'bg-blue-600 text-white' : 'bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600'"
                                                x-text="t('settings.readingModeFullscreen')"
                                            ></button>
                                            <button
                                                @click="setReadingMode('split')"
                                                class="px-4 py-2 rounded font-medium transition-colors"
                                                :class="readingMode === 'split' ? 'bg-blue-600 text-white' : 'bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600'"
                                                x-text="t('settings.readingModeSplit')"
                                            ></button>
                                        </div>
                                        <p class="text-gray-400 dark:text-gray-500 text-xs mt-2" x-text="t('settings.readingModeSplitNote')"></p>
                                    </div>
                                </div>
                            </div>

                            <!-- Accordion: Data -->
                            <div class="border border-gray-200 dark:border-gray-700 rounded-lg overflow-hidden">
                                <button
                                    @click="toggleAccordion('data')"
                                    class="w-full px-4 py-3 flex items-center justify-between bg-gray-50 dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-750 transition-colors"
                                >
                                    <span class="font-medium" x-text="t('settings.data')"></span>
                                    <svg class="w-5 h-5 transition-transform" :class="settingsAccordion.data ? 'rotate-180' : ''"><use href="#icon-chevron-down"/></svg>
                                </button>
                                <div x-show="settingsAccordion.data" x-collapse class="p-4 space-y-4">
                                    <!-- Feed Update Interval -->
                                    <div>
                                        <label for="setting-feed-update-interval" class="block text-sm font-medium mb-1" x-text="t('settings.feedUpdateInterval')"></label>
                                        <p class="text-gray-500 dark:text-gray-400 text-xs mb-2" x-text="t('settings.feedUpdateIntervalDesc')"></p>
                                        <div class="flex items-center gap-2">
                                            <input
                                                id="setting-feed-update-interval"
                                                type="number"
                                                min="5"
                                                max="1440"
                                                :value="feedUpdateInterval"
                                                @change="setFeedUpdateInterval($event.target.value)"
                                                class="w-24 px-3 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:border-blue-500"
                                            >
                                            <span class="text-sm text-gray-500 dark:text-gray-400" x-text="t('settings.minutes')"></span>
                                        </div>
                                    </div>
                                    <!-- Max Posts per Feed -->
                                    <div class="pt-3 border-t border-gray-200 dark:border-gray-700">
                                        <label for="setting-max-posts-per-feed" class="block text-sm font-medium mb-1" x-text="t('settings.maxPostsPerFeed')"></label>
                                        <p class="text-gray-500 dark:text-gray-400 text-xs mb-2" x-text="t('settings.maxPostsPerFeedDesc')"></p>
                                        <div class="flex items-center gap-2">
                                            <input
                                                id="setting-max-posts-per-feed"
                                                type="number"
                                                min="10"
                                                max="10000"
                                                :value="maxPostsPerFeed"
                                                @change="setMaxPostsPerFeed($event.target.value)"
                                                class="w-24 px-3 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:border-blue-500"
                                            >
                                            <span class="text-sm text-gray-500 dark:text-gray-400" x-text="t('settings.posts')"></span>
                                        </div>
                                    </div>
                                    <!-- Max Post Age -->
                                    <div class="pt-3 border-t border-gray-200 dark:border-gray-700">
                                        <label for="setting-max-post-age-days" class="block text-sm font-medium mb-1" x-text="t('settings.maxPostAgeDays')"></label>
                                        <p class="text-gray-500 dark:text-gray-400 text-xs mb-2" x-text="t('settings.maxPostAgeDaysDesc')"></p>
                                        <div class="flex items-center gap-2">
                                            <input
                                                id="setting-max-post-age-days"
                                                type="number"
                                                min="7"
                                                max="3650"
                                                :value="maxPostAgeDays"
                                                @change="setMaxPostAgeDays($event.target.value)"
                                                class="w-24 px-3 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:border-blue-500"
                                            >
                                            <span class="text-sm text-gray-500 dark:text-gray-400" x-text="t('settings.days')"></span>
                                        </div>
                                    </div>
                                    <!-- Max Unread Days -->
                                    <div class="pt-3 border-t border-gray-200 dark:border-gray-700">
                                        <label for="setting-max-unread-days" class="block text-sm font-medium mb-1" x-text="t('settings.maxUnreadDays')"></label>
                                        <p class="text-gray-500 dark:text-gray-400 text-xs mb-2" x-text="t('settings.maxUnreadDaysDesc')"></p>
                                        <div class="flex items-center gap-2">
                                            <input
                                                id="setting-max-unread-days"
                                                type="number"
                                                min="1"
                                                max="365"
                                                :value="maxUnreadDays"
                                                @change="setMaxUnreadDays($event.target.value)"
                                                class="w-24 px-3 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:border-blue-500"
                                            >
                                            <span class="text-sm text-gray-500 dark:text-gray-400" x-text="t('settings.days')"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Accordion: Interface -->
                            <div class="border border-gray-200 dark:border-gray-700 rounded-lg overflow-hidden">
                                <button
                                    @click="toggleAccordion('interface')"
                                    class="w-full px-4 py-3 flex items-center justify-between bg-gray-50 dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-750 transition-colors"
                                >
                                    <span class="font-medium" x-text="t('settings.interface')"></span>
                                    <svg class="w-5 h-5 transition-transform" :class="settingsAccordion.interface ? 'rotate-180' : ''"><use href="#icon-chevron-down"/></svg>
                                </button>
                                <div x-show="settingsAccordion.interface" x-collapse class="p-4 space-y-4">
                                    <!-- Toast Timeout -->
                                    <div>
                                        <label for="setting-toast-timeout" class="block text-sm font-medium mb-1" x-text="t('settings.toastTimeout')"></label>
                                        <p class="text-gray-500 dark:text-gray-400 text-xs mb-2" x-text="t('settings.toastTimeoutDesc')"></p>
                                        <div class="flex items-center gap-2">
                                            <input
                                                id="setting-toast-timeout"
                                                type="number"
                                                min="0"
                                                max="30"
                                                :value="toastTimeoutSeconds"
                                                @change="setToastTimeout($event.target.value)"
                                                class="w-24 px-3 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:border-blue-500"
                                            >
                                            <span class="text-sm text-gray-500 dark:text-gray-400" x-text="t('settings.seconds')"></span>
                                        </div>
                                    </div>
                                    <!-- Idle Refresh -->
                                    <div class="pt-3 border-t border-gray-200 dark:border-gray-700">
                                        <label for="setting-idle-refresh" class="block text-sm font-medium mb-1" x-text="t('settings.idleRefresh')"></label>
                                        <p class="text-gray-500 dark:text-gray-400 text-xs mb-2" x-text="t('settings.idleRefreshDesc')"></p>
                                        <div class="flex items-center gap-2">
                                            <input
                                                id="setting-idle-refresh"
                                                type="number"
                                                min="0"
                                                max="3600"
                                                :value="idleRefreshSeconds"
                                                @change="setIdleRefresh($event.target.value)"
                                                class="w-24 px-3 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:border-blue-500"
                                            >
                                            <span class="text-sm text-gray-500 dark:text-gray-400" x-text="t('settings.seconds')"></span>
                                        </div>
                                    </div>
                                    <!-- Suggestion Sensitivity -->
                                    <div class="pt-3 border-t border-gray-200 dark:border-gray-700">
                                        <label for="setting-suggestion-min-tags" class="block text-sm font-medium mb-1" x-text="t('settings.suggestionMinTags')"></label>
                                        <p class="text-gray-500 dark:text-gray-400 text-xs mb-2" x-text="t('settings.suggestionMinTagsDesc')"></p>
                                        <div class="flex items-center gap-2">
                                            <input
                                                id="setting-suggestion-min-tags"
                                                type="number"
                                                min="1"
                                                :max="tagsPerPost"
                                                :value="suggestionMinTags"
                                                @change="setSuggestionMinTags($event.target.value)"
                                                class="w-24 px-3 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:border-blue-500"
                                            >
                                            <span class="text-sm text-gray-500 dark:text-gray-400" x-text="t('settings.tags')"></span>
                                        </div>
                                    </div>
                                    <!-- Profile Min Tag Frequency -->
                                    <div class="pt-3 border-t border-gray-200 dark:border-gray-700">
                                        <label for="setting-profile-min-tag-freq" class="block text-sm font-medium mb-1" x-text="t('settings.profileMinTagFreq')"></label>
                                        <p class="text-gray-500 dark:text-gray-400 text-xs mb-2" x-text="t('settings.profileMinTagFreqDesc')"></p>
                                        <div class="flex items-center gap-2">
                                            <input
                                                id="setting-profile-min-tag-freq"
                                                type="number"
                                                min="1"
                                                max="20"
                                                :value="profileMinTagFreq"
                                                @change="setProfileMinTagFreq($event.target.value)"
                                                class="w-24 px-3 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:border-blue-500"
                                            >
                                            <span class="text-sm text-gray-500 dark:text-gray-400" x-text="t('settings.likedPosts')"></span>
                                        </div>
                                    </div>
                                    <!-- Ignored Tags -->
                                    <div class="pt-3 border-t border-gray-200 dark:border-gray-700">
                                        <label class="block text-sm font-medium mb-1" x-text="t('settings.ignoredTags')"></label>
                                        <p class="text-gray-500 dark:text-gray-400 text-xs mb-2" x-text="t('settings.ignoredTagsDesc')"></p>
                                        <div class="flex flex-wrap gap-1 mb-2" x-show="ignoredTags.size > 0">
                                            <template x-for="tag in [...ignoredTags].sort()" :key="tag">
                                                <span class="inline-flex items-center gap-1 text-xs px-1.5 py-0.5 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-600">
                                                    <span x-text="tag"></span>
                                                    <button @click="toggleTagIgnored(tag)" class="hover:text-red-500" :data-tip="t('tags.clearFilter')" :aria-label="t('tags.clearFilter')">&times;</button>
                                                </span>
                                            </template>
                                        </div>
                                        <p x-show="ignoredTags.size === 0" class="text-gray-400 text-xs italic" x-text="t('settings.noIgnoredTags')"></p>
                                    </div>
                                    <!-- Blocked Terms -->
                                    <div class="pt-3 border-t border-gray-200 dark:border-gray-700">
                                        <label for="setting-blocked-terms" class="block text-sm font-medium mb-1" x-text="t('settings.blockedTerms')"></label>
                                        <p class="text-gray-500 dark:text-gray-400 text-xs mb-2" x-text="t('settings.blockedTermsDesc')"></p>
                                        <textarea
                                            id="setting-blocked-terms"
                                            :value="blockedTermsSorted()"
                                            @change="setBlockedTerms($event.target.value)"
                                            :placeholder="t('settings.blockedTermsPlaceholder')"
                                            rows="6"
                                            class="w-full px-3 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:border-blue-500 text-sm font-mono"
                                        ></textarea>
                                    </div>
                                </div>
                            </div>

                            <!-- Tag Consolidation -->
                            <div class="border border-gray-200 dark:border-gray-700 rounded-lg overflow-hidden">
                                <button
                                    @click="toggleAccordion('tagMerge')"
                                    class="w-full px-4 py-3 flex items-center justify-between bg-gray-50 dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-750 transition-colors"
                                >
                                    <span class="font-medium" x-text="t('settings.tagMerge.title')"></span>
                                    <svg class="w-5 h-5 transition-transform" :class="settingsAccordion.tagMerge ? 'rotate-180' : ''" ><use href="#icon-chevron-down"/></svg>
                                </button>
                                <div x-show="settingsAccordion.tagMerge" x-collapse class="px-4 py-3 space-y-4">
                                    <p class="text-gray-500 dark:text-gray-400 text-xs" x-text="t('settings.tagMerge.desc')"></p>

                                    <!-- Purge Rare Tags -->
                                    <div class="border border-gray-200 dark:border-gray-700 rounded p-3 space-y-2 bg-gray-50 dark:bg-gray-800/50">
                                        <label class="block text-sm font-medium" x-text="t('settings.tagMerge.purgeTitle')"></label>
                                        <p class="text-gray-500 dark:text-gray-400 text-xs" x-text="t('settings.tagMerge.purgeDesc')"></p>
                                        <div class="flex items-center gap-2 flex-wrap">
                                            <label class="text-xs text-gray-500 dark:text-gray-400" x-text="t('settings.tagMerge.purgeThreshold')"></label>
                                            <input type="number" min="1" max="10" x-model.number="purgeMaxCount"
                                                   @change="previewRareTags()"
                                                   class="w-20 px-2 py-1 text-sm bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded">
                                            <span class="text-xs text-gray-500 dark:text-gray-400" x-text="t('settings.tagMerge.posts')"></span>
                                            <button @click="previewRareTags()" :disabled="purgeLoading"
                                                    class="px-3 py-1 text-sm bg-gray-200 dark:bg-gray-700 rounded hover:bg-gray-300 dark:hover:bg-gray-600 disabled:opacity-50"
                                                    x-text="t('settings.tagMerge.preview')"></button>
                                        </div>
                                        <!-- Breakdown -->
                                        <template x-if="purgeBreakdowns.length > 0">
                                            <div class="space-y-1">
                                                <template x-for="b in purgeBreakdowns" :key="b.max_count">
                                                    <p class="text-xs text-gray-500 dark:text-gray-400"
                                                       x-text="'≤ ' + b.max_count + (b.max_count === 1 ? ' post: ' : ' posts: ') + b.tag_count + ' ' + t('settings.tagMerge.tagsLabel')"></p>
                                                </template>
                                                <p class="text-xs text-gray-500 dark:text-gray-400"
                                                   x-text="t('settings.tagMerge.totalTags').replace('{total}', purgeTotalTags).replace('{from}', '').replace('–{to}', '').replace('—', '—')"></p>
                                            </div>
                                        </template>
                                        <!-- Sample -->
                                        <div x-show="purgeSample.length > 0" class="flex flex-wrap gap-1 max-h-24 overflow-y-auto">
                                            <template x-for="s in purgeSample" :key="s.tag">
                                                <span class="text-xs px-1.5 py-0.5 rounded-full bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400"
                                                      x-text="s.tag + ' (' + s.count + ')'"></span>
                                            </template>
                                            <span x-show="purgeBreakdowns.length > 0 && purgeBreakdowns[purgeBreakdowns.length-1].tag_count > 50"
                                                  class="text-xs text-gray-400 italic">…</span>
                                        </div>
                                        <!-- Purge button -->
                                        <button x-show="purgeBreakdowns.length > 0"
                                                @click="purgeRareTags()"
                                                :disabled="purgingTags"
                                                class="px-3 py-1 text-sm bg-red-600 text-white rounded hover:bg-red-700 disabled:opacity-50">
                                            <span x-show="!purgingTags" x-text="t('settings.tagMerge.purgeApply').replace('{count}', purgeBreakdowns[purgeMaxCount-1]?.tag_count || 0)"></span>
                                            <span x-show="purgingTags" x-text="t('settings.tagMerge.purging')"></span>
                                        </button>
                                    </div>

                                    <!-- AI Merge Controls -->
                                    <div class="border-t border-gray-200 dark:border-gray-700 pt-3"></div>
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <label class="text-xs text-gray-500 dark:text-gray-400" x-text="t('settings.tagMerge.offset')"></label>
                                        <input type="number" min="0" x-model.number="mergeOffset" class="w-20 px-2 py-1 text-sm bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded">
                                        <label class="text-xs text-gray-500 dark:text-gray-400" x-text="t('settings.tagMerge.batchSize')"></label>
                                        <input type="number" min="10" max="200" x-model.number="mergeBatchSize" class="w-20 px-2 py-1 text-sm bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded">
                                        <button
                                            @click="suggestTagMerges()"
                                            :disabled="mergeSuggesting"
                                            class="px-3 py-1 text-sm bg-blue-600 text-white rounded hover:bg-blue-700 disabled:opacity-50 flex items-center gap-1 whitespace-nowrap"
                                        >
                                            <svg x-show="mergeSuggesting" class="w-3 h-3 animate-spin"><use href="#icon-spinner"/></svg>
                                            <svg x-show="!mergeSuggesting" class="w-3 h-3"><use href="#icon-sparkles"/></svg>
                                            <span x-text="t('settings.tagMerge.analyze')"></span>
                                        </button>
                                    </div>

                                    <!-- Total tag count -->
                                    <p x-show="mergeTotalTags > 0" class="text-xs text-gray-500 dark:text-gray-400"
                                       x-text="t('settings.tagMerge.totalTags').replace('{total}', mergeTotalTags).replace('{from}', mergeOffset).replace('{to}', Math.min(mergeOffset + mergeBatchSize, mergeTotalTags))">
                                    </p>

                                    <!-- Merge groups -->
                                    <div x-show="mergeGroups.length > 0" class="space-y-2 max-h-80 overflow-y-auto">
                                        <template x-for="(group, gi) in mergeGroups" :key="gi">
                                            <div class="border border-gray-200 dark:border-gray-700 rounded p-2"
                                                 :class="group.selected ? 'bg-blue-50 dark:bg-blue-900/20 border-blue-300 dark:border-blue-700' : ''">
                                                <div class="flex items-center gap-2 mb-1">
                                                    <input type="checkbox" x-model="group.selected" class="rounded">
                                                    <span class="text-xs font-medium text-gray-400" x-text="'→'"></span>
                                                    <input type="text" x-model="group.canonical"
                                                           class="text-sm font-semibold bg-transparent border-b border-dashed border-gray-400 dark:border-gray-500 focus:border-blue-500 focus:outline-none px-1 py-0"
                                                           :data-tip="t('settings.tagMerge.editCanonical')">
                                                </div>
                                                <div class="flex flex-wrap gap-1 ml-5">
                                                    <template x-for="(tag, ti) in group.merge" :key="ti">
                                                        <span class="inline-flex items-center gap-1 text-xs px-1.5 py-0.5 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-400">
                                                            <span x-text="tag"></span>
                                                            <button @click="group.merge.splice(ti, 1); if (group.merge.length === 0) mergeGroups.splice(gi, 1)" class="hover:text-red-500">&times;</button>
                                                        </span>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </div>

                                    <!-- Apply button -->
                                    <div x-show="mergeGroups.length > 0" class="flex items-center gap-2">
                                        <button
                                            @click="applyTagMerges()"
                                            :disabled="mergeApplying || mergeGroups.filter(g => g.selected).length === 0"
                                            class="px-3 py-1 text-sm bg-green-600 text-white rounded hover:bg-green-700 disabled:opacity-50"
                                        >
                                            <span x-show="!mergeApplying" x-text="t('settings.tagMerge.apply')"></span>
                                            <span x-show="mergeApplying" x-text="t('settings.tagMerge.applying')"></span>
                                        </button>
                                        <button
                                            @click="mergeGroups.forEach(g => g.selected = true)"
                                            class="px-2 py-1 text-xs text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 underline"
                                            x-text="t('settings.tagMerge.selectAll')"
                                        ></button>
                                        <button
                                            @click="mergeGroups.forEach(g => g.selected = false)"
                                            class="px-2 py-1 text-xs text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 underline"
                                            x-text="t('settings.tagMerge.selectNone')"
                                        ></button>
                                    </div>

                                    <!-- Empty state -->
                                    <p x-show="mergeGroups.length === 0 && mergeTotalTags > 0 && !mergeSuggesting" class="text-xs text-gray-400 italic" x-text="t('settings.tagMerge.noGroups')"></p>
                                </div>
                            </div>

                            <!-- Version & Clear Cache -->
                            <div class="mt-4 pt-4 border-t border-gray-200 dark:border-gray-700 flex items-center justify-between">
                                <span class="text-xs text-gray-400 dark:text-gray-500" x-text="'v' + appVersion"></span>
                                <div class="flex items-center gap-3">
                                    <button
                                        @click="resetCircuitBreaker()"
                                        class="text-xs text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 underline"
                                        x-text="t('settings.resetCircuitBreaker')"
                                    ></button>
                                    <button
                                        @click="clearCacheAndReload()"
                                        class="text-xs text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 underline"
                                        x-text="t('settings.clearCache')"
                                    ></button>
                                </div>
                            </div>

                        </div>

                        <!-- Status Tab -->
                        <div x-show="settingsTab === 'status'" class="space-y-6">
                            <!-- Loader -->
                            <template x-if="loadingStatus">
                                <div class="flex flex-col items-center justify-center py-12 space-y-4">
                                    <svg class="animate-spin h-8 w-8 text-blue-600 dark:text-blue-400"><use href="#icon-spinner"/></svg>
                                    <span class="text-sm text-gray-500 dark:text-gray-400" x-text="t('settings.status.loading')"></span>
                                </div>
                            </template>

                            <!-- Content loaded -->
                            <template x-if="!loadingStatus && systemStatus">
                                <div class="space-y-6">
                                    
                                    <!-- Destaque Principal: Fila de IA -->
                                    <div class="p-5 rounded-xl border border-blue-200 dark:border-blue-900/50 bg-blue-50/50 dark:bg-blue-950/20 shadow-sm relative overflow-hidden transition-all hover:shadow-md">
                                        <div class="absolute right-0 top-0 h-full w-24 bg-gradient-to-l from-blue-500/5 to-transparent pointer-events-none"></div>
                                        
                                        <div class="flex items-start gap-4">
                                            <div class="p-3 bg-blue-600 text-white rounded-xl shadow-md flex-shrink-0 animate-pulse">
                                                <svg class="w-6 h-6"><use href="#icon-sparkles"/></svg>
                                            </div>
                                            <div class="flex-1 min-w-0">
                                                <h3 class="text-sm font-semibold text-blue-800 dark:text-blue-300" x-text="t('settings.status.llmQueue')"></h3>
                                                <p class="text-xs text-blue-600/80 dark:text-blue-400/80 mt-1 max-w-[90%]" x-text="t('settings.status.llmQueueDesc')"></p>
                                                
                                                <div class="mt-4 flex items-baseline gap-2">
                                                    <span class="text-3xl font-extrabold text-blue-900 dark:text-blue-200" x-text="systemStatus.unread_queue_size"></span>
                                                    <span class="text-xs text-blue-700/70 dark:text-blue-400/70" x-text="'/ ' + systemStatus.queue_size + ' no total na fila'"></span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Grid de Métricas Gerais -->
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        
                                        <!-- Starred -->
                                        <div class="p-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/40 shadow-sm hover:shadow transition-all flex items-center gap-3">
                                            <div class="p-2.5 rounded-lg bg-yellow-100 dark:bg-yellow-900/30 text-yellow-600 dark:text-yellow-400">
                                                <svg class="w-5 h-5"><use href="#icon-star"/></svg>
                                            </div>
                                            <div>
                                                <p class="text-xs text-gray-500 dark:text-gray-400 font-medium" x-text="t('settings.status.totalStarred')"></p>
                                                <p class="text-xl font-bold text-gray-800 dark:text-gray-200 mt-0.5" x-text="systemStatus.starred_count"></p>
                                            </div>
                                        </div>

                                        <!-- Unread -->
                                        <div class="p-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/40 shadow-sm hover:shadow transition-all flex items-center gap-3">
                                            <div class="p-2.5 rounded-lg bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400">
                                                <svg class="w-5 h-5"><use href="#icon-check"/></svg>
                                            </div>
                                            <div>
                                                <p class="text-xs text-gray-500 dark:text-gray-400 font-medium" x-text="t('settings.status.totalUnread')"></p>
                                                <p class="text-xl font-bold text-gray-800 dark:text-gray-200 mt-0.5" x-text="systemStatus.unread_count"></p>
                                            </div>
                                        </div>

                                        <!-- Total Posts -->
                                        <div class="p-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/40 shadow-sm hover:shadow transition-all flex items-center gap-3">
                                            <div class="p-2.5 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-400">
                                                <svg class="w-5 h-5"><use href="#icon-folder"/></svg>
                                            </div>
                                            <div>
                                                <p class="text-xs text-gray-500 dark:text-gray-400 font-medium" x-text="t('settings.status.totalPosts')"></p>
                                                <p class="text-xl font-bold text-gray-800 dark:text-gray-200 mt-0.5" x-text="systemStatus.posts_count"></p>
                                            </div>
                                        </div>

                                        <!-- Feeds -->
                                        <div class="p-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/40 shadow-sm hover:shadow transition-all flex items-center gap-3">
                                            <div class="p-2.5 rounded-lg bg-purple-100 dark:bg-purple-900/30 text-purple-600 dark:text-purple-400">
                                                <svg class="w-5 h-5"><use href="#icon-rss"/></svg>
                                            </div>
                                            <div>
                                                <p class="text-xs text-gray-500 dark:text-gray-400 font-medium" x-text="t('settings.status.totalFeeds')"></p>
                                                <p class="text-xl font-bold text-gray-800 dark:text-gray-200 mt-0.5" x-text="systemStatus.feeds_count"></p>
                                            </div>
                                        </div>

                                        <!-- DB Size -->
                                        <div class="p-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/40 shadow-sm hover:shadow transition-all flex items-center gap-3">
                                            <div class="p-2.5 rounded-lg bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400">
                                                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 6.375c0 2.278-3.694 4.125-8.25 4.125S3.75 8.653 3.75 6.375m16.5 0c0-2.278-3.694-4.125-8.25-4.125S3.75 4.097 3.75 6.375m16.5 0v11.25c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125V6.375m16.5 0v3.75m-16.5-3.75v3.75m16.5 0v3.75C20.25 16.153 16.556 18 12 18s-8.25-1.847-8.25-4.125v-3.75m16.5 0v3.75"></path></svg>
                                            </div>
                                            <div>
                                                <p class="text-xs text-gray-500 dark:text-gray-400 font-medium" x-text="t('settings.status.dbSize')"></p>
                                                <p class="text-xl font-bold text-gray-800 dark:text-gray-200 mt-0.5" x-text="systemStatus.db_size_mb + ' MB'"></p>
                                            </div>
                                        </div>

                                        <!-- Oldest Post Date -->
                                        <div class="p-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/40 shadow-sm hover:shadow transition-all flex items-center gap-3">
                                            <div class="p-2.5 rounded-lg bg-orange-100 dark:bg-orange-900/30 text-orange-600 dark:text-orange-400">
                                                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"></path></svg>
                                            </div>
                                            <div>
                                                <p class="text-xs text-gray-500 dark:text-gray-400 font-medium" x-text="t('settings.status.oldestPost')"></p>
                                                <p class="text-sm font-bold text-gray-800 dark:text-gray-200 mt-0.5" x-text="systemStatus.oldest_post_date ? formatDate(systemStatus.oldest_post_date) : t('time.unknown')"></p>
                                            </div>
                                        </div>

                                    </div>

                                    <!-- Sistema e IA -->
                                    <div class="p-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/20 space-y-4">
                                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                            <div>
                                                <p class="text-sm font-semibold text-gray-700 dark:text-gray-300" x-text="t('settings.status.aiState')"></p>
                                                <div class="flex items-center gap-2 mt-1.5">
                                                    <span class="w-2.5 h-2.5 rounded-full" :class="systemStatus.circuit_breaker === 'closed' ? 'bg-green-500' : 'bg-red-500'"></span>
                                                    <span class="text-xs text-gray-600 dark:text-gray-400" x-text="systemStatus.circuit_breaker === 'closed' ? t('settings.status.aiStateNormal') : t('settings.status.aiStateTriggered')"></span>
                                                </div>
                                            </div>
                                            
                                            <!-- Botão de Reset Integrado -->
                                            <button 
                                                @click="resetCircuitBreaker(); loadSystemStatus()"
                                                class="px-4 py-2 text-xs font-semibold text-blue-600 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/20 border border-blue-200 dark:border-blue-800 rounded-lg transition-colors flex items-center gap-1.5 self-start sm:self-auto"
                                            >
                                                <svg class="w-3.5 h-3.5"><use href="#icon-refresh"/></svg>
                                                <span x-text="t('settings.resetCircuitBreaker')"></span>
                                            </button>
                                        </div>

                                        <!-- Aviso de saúde se houver -->
                                        <template x-if="systemStatus.health_warning">
                                            <div class="p-3 bg-red-50 dark:bg-red-950/20 border border-red-200 dark:border-red-900/50 rounded-lg flex items-start gap-2 text-xs text-red-700 dark:text-red-400">
                                                <span class="font-bold uppercase" x-text="t('settings.status.warning')"></span>
                                                <span x-text="systemStatus.health_warning"></span>
                                            </div>
                                        </template>
                                    </div>

                                    <!-- Agendamento & Busca de Feeds -->
                                    <div class="p-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/20 space-y-4">
                                        <div>
                                            <p class="text-sm font-semibold text-gray-700 dark:text-gray-300" x-text="t('settings.status.fetchingSection')"></p>
                                            
                                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-3 pt-3 border-t border-gray-200 dark:border-gray-700/50">
                                                <!-- Interval -->
                                                <div>
                                                    <p class="text-[10px] text-gray-400 dark:text-gray-500 uppercase tracking-wider font-semibold" x-text="t('settings.status.fetchingInterval')"></p>
                                                    <p class="text-sm font-medium text-gray-700 dark:text-gray-300 mt-1" x-text="t('settings.status.fetchingIntervalValue').replace('{n}', systemStatus.feed_update_interval)"></p>
                                                </div>
                                                
                                                <!-- Last Run -->
                                                <div>
                                                    <p class="text-[10px] text-gray-400 dark:text-gray-500 uppercase tracking-wider font-semibold" x-text="t('settings.status.fetchingLastRun')"></p>
                                                    <p class="text-sm font-medium text-gray-700 dark:text-gray-300 mt-1" x-text="systemStatus.last_fetched_date ? formatDate(systemStatus.last_fetched_date) : t('time.unknown')"></p>
                                                </div>
                                                
                                                <!-- Scheduler State -->
                                                <div>
                                                    <p class="text-[10px] text-gray-400 dark:text-gray-500 uppercase tracking-wider font-semibold" x-text="t('settings.status.schedulerState')"></p>
                                                    <div class="flex items-center gap-1.5 mt-1">
                                                        <span class="w-2 h-2 rounded-full" :class="systemStatus.scheduler_active ? 'bg-green-500' : 'bg-red-500'"></span>
                                                        <span class="text-xs font-semibold" :class="systemStatus.scheduler_active ? 'text-green-600 dark:text-green-400' : 'text-red-500'" x-text="systemStatus.scheduler_active ? t('settings.status.schedulerActive') : t('settings.status.schedulerInactive')"></span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <!-- Ação Manual de Atualização das Métricas -->
                                    <div class="flex justify-end pt-2">
                                        <button 
                                            @click="loadSystemStatus()" 
                                            class="px-4 py-2 text-xs font-semibold bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-lg transition-colors flex items-center gap-1.5"
                                        >
                                            <svg class="w-3.5 h-3.5"><use href="#icon-refresh"/></svg>
                                            <span x-text="t('settings.status.refresh')"></span>
                                        </button>
                                    </div>

                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Footer -->
                    <div class="p-4 border-t border-gray-200 dark:border-gray-700 text-right">
                        <button
                            @click="closeSettings()"
                            class="px-4 py-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 rounded"
                            x-text="t('settings.close')"
                        ></button>
                    </div>
                </div>
            </div>
        </template>

        <!-- Toast Notification -->
        <div
            x-show="toast.show"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-y-2"
            x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 translate-y-2"
            class="fixed bottom-4 left-4 right-4 z-[100] max-w-md mx-auto"
        >
            <div
                class="px-4 py-3 rounded-lg shadow-lg flex items-center justify-between gap-3"
                :class="{
                    'bg-green-600 text-white': toast.type === 'success',
                    'bg-red-600 text-white': toast.type === 'error',
                    'bg-blue-600 text-white': toast.type === 'info'
                }"
            >
                <div class="flex items-center gap-2">
                    <!-- Success icon -->
                    <svg x-show="toast.type === 'success'" class="w-5 h-5 flex-shrink-0"><use href="#icon-check"/></svg>
                    <!-- Error icon -->
                    <svg x-show="toast.type === 'error'" class="w-5 h-5 flex-shrink-0"><use href="#icon-x-close"/></svg>
                    <!-- Info icon -->
                    <svg x-show="toast.type === 'info'" class="w-5 h-5 flex-shrink-0"><use href="#icon-info"/></svg>
                    <span x-text="toast.message"></span>
                </div>
                <button @click="hideToast()" class="text-white/80 hover:text-white flex-shrink-0" :data-tip="t('modal.dismiss')" :aria-label="t('modal.dismiss')">
                    <svg class="w-5 h-5"><use href="#icon-x-close"/></svg>
                </button>
            </div>
        </div>

        <!-- Custom Confirm Modal -->
        <div
            x-show="confirmModal.show"
            class="fixed inset-0 z-[200] flex items-center justify-center p-4"
            @keydown.escape.window="confirmModal.show && !confirmModal.loading && confirmCancel()"
            @keydown.enter.window="confirmModal.show && !confirmModal.loading && confirmOk()"
        >
            <!-- Backdrop with blur -->
            <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" @click="!confirmModal.loading && confirmCancel()"></div>

            <!-- Modal -->
            <div class="relative bg-white dark:bg-gray-800 rounded-lg shadow-xl max-w-md w-full p-6">
                <!-- Loading state -->
                <div x-show="confirmModal.loading" class="flex items-center gap-3">
                    <svg class="animate-spin h-5 w-5 text-blue-500"><use href="#icon-spinner"/></svg>
                    <span class="text-gray-900 dark:text-gray-100" x-text="confirmModal.message"></span>
                </div>
                <!-- Confirm state -->
                <template x-if="!confirmModal.loading">
                    <div>
                        <p class="text-gray-900 dark:text-gray-100 mb-6" x-text="confirmModal.message"></p>
                        <div class="flex justify-end gap-3">
                            <button
                                @click="confirmCancel()"
                                class="px-4 py-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 rounded font-medium transition-colors"
                                x-text="t('categories.cancel')"
                            ></button>
                            <button
                                id="confirm-ok-btn"
                                @click="confirmOk()"
                                class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded font-medium transition-colors"
                            >OK</button>
                        </div>
                    </div>
                </template>
            </div>
        </div>

    </div>


</body>
</html>
