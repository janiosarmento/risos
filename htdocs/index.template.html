<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risos</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v={{APP_VERSION}}">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png?v={{APP_VERSION}}">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16.png?v={{APP_VERSION}}">

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png?v={{APP_VERSION}}">

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json?v={{APP_VERSION}}">
    <meta name="theme-color" content="#2563eb">

    <!-- iOS meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Risos">

    <script>
        // Suppress Tailwind CDN production warning
        const origWarn = console.warn;
        console.warn = (...args) => {
            if (args[0]?.includes?.('cdn.tailwindcss.com')) return;
            origWarn.apply(console, args);
        };
        // Apply theme before page renders to prevent flash
        (function() {
            const stored = localStorage.getItem('rss_theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = stored || (prefersDark ? 'dark' : 'light');
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/@popperjs/core@2/dist/umd/popper.min.js"></script>
    <script src="https://unpkg.com/tippy.js@6/dist/tippy-bundle.umd.min.js"></script>
    <!-- App version — single source of truth. Assembler replaces {{APP_VERSION}} in all ?v= below -->
    <script>var APP_VERSION = '20260530j';</script>
    <link rel="stylesheet" href="/static/css/app.css?v={{APP_VERSION}}">

    <!-- App scripts: defer preserves execution order; declared before Alpine so stores/mixins register first -->
    <script defer src="/static/js/stores/auth.js?v={{APP_VERSION}}"></script>
    <script defer src="/static/js/stores/i18n.js?v={{APP_VERSION}}"></script>
    <script defer src="/static/js/stores/ui.js?v={{APP_VERSION}}"></script>
    <script defer src="/static/js/stores/prefs.js?v={{APP_VERSION}}"></script>
    <script defer src="/static/js/components/postDetail.js?v={{APP_VERSION}}"></script>
    <script defer src="/static/js/components/settings.js?v={{APP_VERSION}}"></script>
    <script defer src="/static/js/components/curation.js?v={{APP_VERSION}}"></script>
    <script defer src="/static/js/app.js?v={{APP_VERSION}}"></script>

    <!-- Alpine (deferred after local scripts — executes last, triggers alpine:init) -->
    <script defer src="https://unpkg.com/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Locale preload (synchronous — uses APP_VERSION var defined above) -->
    <script>
      (function() {
        var locale = localStorage.getItem('rss_locale') || 'pt-BR';
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'fetch';
        link.crossOrigin = 'anonymous';
        link.href = '/static/locales/' + locale + '.json?v=' + APP_VERSION;
        document.head.appendChild(link);
      })();
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors">
    <!-- SVG Sprite Sheet -->
    <svg xmlns="http://www.w3.org/2000/svg" class="hidden">
        <!-- Navigation -->
        <symbol id="icon-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 5l7 7-7 7"/>
        </symbol>
        <symbol id="icon-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 19l-7-7 7-7"/>
        </symbol>
        <symbol id="icon-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 9l-7 7-7-7"/>
        </symbol>
        <!-- Actions -->
        <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 13l4 4L19 7"/>
        </symbol>
        <symbol id="icon-x-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 18L18 6M6 6l12 12"/>

        </symbol>
        <symbol id="icon-external-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <symbol id="icon-prohibition" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <!-- Post status (viewBox 20) -->

            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
        </symbol>
        <symbol id="icon-star-24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>

            <path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>
        </symbol>
        <symbol id="icon-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
        </symbol>
        <symbol id="icon-rss" viewBox="0 0 20 20" fill="currentColor">
            <path d="M5 3a1 1 0 000 2c5.523 0 10 4.477 10 10a1 1 0 102 0C17 8.373 11.627 3 5 3z"/>
            <path d="M4 9a1 1 0 011-1 7 7 0 017 7 1 1 0 11-2 0 5 5 0 00-5-5 1 1 0 01-1-1z"/>
            <path d="M3 15a2 2 0 114 0 2 2 0 01-4 0z"/>
        </symbol>
        <symbol id="icon-lightbulb" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
        </symbol>
        <symbol id="icon-sparkles" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.937 15.5A2 2 0 008.5 14.063l-6.135-1.582a.5.5 0 010-.962L8.5 9.936A2 2 0 009.937 8.5l1.582-6.135a.5.5 0 01.963 0L14.063 8.5A2 2 0 0015.5 9.937l6.135 1.582a.5.5 0 010 .963L15.5 14.063a2 2 0 00-1.437 1.437l-1.582 6.135a.5.5 0 01-.963 0z"/>
            <path d="M20 3v4M22 5h-4"/>
        </symbol>
        <symbol id="icon-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 3a2.828 2.828 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>

            <path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
            <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </symbol>
        <symbol id="icon-github" viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.17 6.839 9.49.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.604-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.464-1.11-1.464-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.115 2.504.337 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.167 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
        </symbol>
        <!-- Login -->
        <symbol id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
            <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </symbol>
        <symbol id="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.98 8.223A10.477 10.477 0 001.934 12c1.292 4.338 5.31 7.5 10.066 7.5.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/>
        </symbol>
        <!-- Misc -->
        <symbol id="icon-document" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </symbol>
        <symbol id="icon-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </symbol>
        <symbol id="icon-spinner" viewBox="0 0 24 24" fill="none">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
        </symbol>
        <symbol id="icon-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="8"/>
        </symbol>
        <symbol id="icon-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
        </symbol>
        <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </symbol>
        <symbol id="icon-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0110 0v4"/>
        </symbol>
        <symbol id="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
        </symbol>
    </svg>

    <div id="i18n-loading" class="h-screen flex items-center justify-center bg-gray-100 dark:bg-gray-900">
        <svg class="w-8 h-8 animate-spin text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
    </div>

    <div id="app-root" x-data="app()" x-init="init()" x-cloak style="display:none" class="h-screen flex flex-col">

        <!-- Health Warning Banner -->
        <div x-show="healthWarning" class="bg-yellow-600 text-yellow-100 px-4 py-2 text-sm flex items-center justify-between">
            <span x-text="healthWarning"></span>
            <button @click="healthWarning = null" class="ml-4 hover:text-white">&times;</button>
        </div>

        <!-- Login Screen -->
        <template x-if="!$store.auth.token">
            <main class="flex-1 flex items-center justify-center">
                <div class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-sm">
                    <h1 class="text-2xl font-bold mb-6 text-center" x-text="t('app.title')"></h1>
                    <form @submit.prevent="login()">
                        <div class="mb-4">
                            <label for="auth-password" class="block text-sm font-medium mb-2" x-text="t('auth.password')"></label>
                            <div class="relative" x-data="{ showPw: false }">
                                <input
                                    id="auth-password"
                                    :type="showPw ? 'text' : 'password'"
                                    x-model="password"
                                    class="w-full px-4 py-2 pr-10 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded focus:outline-none focus:border-blue-500"
                                    :placeholder="t('auth.password')"
                                    autofocus
                                >
                                <button
                                    type="button"
                                    @click="showPw = !showPw"
                                    class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300"
                                    tabindex="-1"
                                    :data-tip="showPw ? t('auth.hidePassword') : t('auth.showPassword')"
                                    :aria-label="showPw ? t('auth.hidePassword') : t('auth.showPassword')"
                                >
                                    <svg x-show="!showPw" class="w-5 h-5"><use href="#icon-eye"/></svg>
                                    <svg x-show="showPw" class="w-5 h-5"><use href="#icon-eye-off"/></svg>
                                </button>
                            </div>
                        </div>
                        <div x-show="loginError" class="mb-4 text-red-400 text-sm" x-text="loginError"></div>
                        <button
                            type="submit"
                            class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded font-medium transition"
                            :disabled="logging"
                        >
                            <span x-show="!logging" x-text="t('auth.login')"></span>
                            <span x-show="logging" x-text="t('auth.loggingIn')"></span>
                        </button>
                    </form>
                    <p class="mt-4 text-xs text-gray-400 text-center md:hidden" x-text="t('auth.mobileHint')"></p>
                </div>
            </main>
        </template>

        <!-- Main App -->
        <template x-if="$store.auth.token">
            <div class="flex-1 flex overflow-hidden relative">

                <!-- Mobile Sidebar Overlay -->
                <div
                    x-show="sidebarOpen"
                    x-transition:enter="transition-opacity ease-out duration-300"
                    x-transition:enter-start="opacity-0"
                    x-transition:enter-end="opacity-100"
                    x-transition:leave="transition-opacity ease-in duration-200"
                    x-transition:leave-start="opacity-100"
                    x-transition:leave-end="opacity-0"
                    @click="sidebarOpen = false"
                    class="fixed inset-0 bg-black/50 z-40 md:hidden"
                ></div>

                <!-- Sidebar -->
                <aside
                    class="w-64 bg-white dark:bg-gray-800 flex flex-col border-r border-gray-200 dark:border-gray-700 fixed md:relative inset-y-0 left-0 z-50 transform transition-transform duration-300 ease-in-out md:translate-x-0"
                    :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'"
                >
                    <!-- Header -->
                    <header class="p-4 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
                        <h1 class="font-bold text-lg" x-text="t('app.title')"></h1>
                        <div class="flex items-center gap-2">
                            <div class="hidden md:flex items-center gap-1">
                                <button @click="decreaseFontScale()" :disabled="fontScaleMin" class="text-xs font-bold w-6 h-6 flex items-center justify-center rounded hover:bg-gray-100 dark:hover:bg-gray-700 disabled:opacity-30 disabled:cursor-not-allowed text-gray-500 dark:text-gray-400">A-</button>
                                <button @click="increaseFontScale()" :disabled="fontScaleMax" class="text-sm font-bold w-6 h-6 flex items-center justify-center rounded hover:bg-gray-100 dark:hover:bg-gray-700 disabled:opacity-30 disabled:cursor-not-allowed text-gray-500 dark:text-gray-400">A+</button>
                            </div>
                            <button @click="openSettings()" class="text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white" :data-tip="t('sidebar.settings')" :aria-label="t('sidebar.settings')">
                                <svg class="w-5 h-5"><use href="#icon-settings"/></svg>
                            </button>
                            <button @click="logout()" class="text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white text-sm hidden md:block" x-text="t('app.logout')"></button>
                            <!-- Mobile close button -->
                            <button @click="sidebarOpen = false" class="md:hidden text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white" :data-tip="t('sidebar.closeMenu')" :aria-label="t('sidebar.closeMenu')">
                                <svg class="w-6 h-6"><use href="#icon-x-close"/></svg>
                            </button>
                        </div>
                    </header>

                    <!-- Actions -->
                    <div class="p-2 border-b border-gray-200 dark:border-gray-700 flex gap-2">
                        <div class="flex-1 relative" x-data="{ markOpen: false }">
                            <button
                                @click="markOpen = !markOpen"
                                class="w-full text-xs bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 px-2 py-1 rounded flex items-center justify-between"
                            >
                                <span x-text="t('posts.markAsRead')"></span>
                                <svg class="w-3 h-3 ml-1"><use href="#icon-chevron-down"/></svg>
                            </button>
                            <div
                                x-show="markOpen"
                                @click.away="markOpen = false"
                                x-transition
                                class="absolute left-0 right-0 top-full mt-1 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded shadow-lg z-50"
                            >
                                <button
                                    @click="markAllRead(); markOpen = false"
                                    class="w-full text-left text-xs px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-t"
                                >
                                    <span x-text="t('posts.markAllRead')"></span>
                                    <span class="hidden lg:inline opacity-60"> (A)</span>
                                </button>
                                <button
                                    @click="markAllRead(true); markOpen = false"
                                    class="w-full text-left text-xs px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-b border-t border-gray-100 dark:border-gray-700"
                                >
                                    <span x-text="t('posts.markBlockedRead')"></span>
                                    <span class="hidden lg:inline opacity-60"> (N)</span>
                                    <template x-if="blockedUnreadCount > 0">
                                        <span class="ml-1 px-1.5 py-0.5 text-[10px] bg-red-100 dark:bg-red-900/50 text-red-600 dark:text-red-400 rounded-full" x-text="blockedUnreadCount"></span>
                                    </template>
                                </button>
                            </div>
                        </div>
                        <button
                            @click="refreshFeeds()"
                            class="text-xs bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 px-2 py-1 rounded"
                            :disabled="refreshing"
                            :data-tip="t('sidebar.refresh') + ' (R)'"
                            :aria-label="t('sidebar.refresh')"
                        >
                            <svg x-show="!refreshing" class="w-4 h-4"><use href="#icon-refresh"/></svg>
                            <svg x-show="refreshing" class="w-4 h-4 animate-spin"><use href="#icon-spinner"/></svg>
                        </button>
                    </div>

                    <!-- Filters -->
                    <div class="p-2 border-b border-gray-200 dark:border-gray-700">
                        <button
                            @click="postFilter = 'unread'; setFilter('unread')"
                            class="w-full text-left px-3 py-2 rounded text-sm"
                            :class="filter === 'unread' && postFilter === 'unread' ? 'bg-blue-600 text-white' : 'hover:bg-gray-200 dark:hover:bg-gray-700'"
                        >
                            <span x-text="t('sidebar.unread')"></span>
                            <span
                                class="float-right"
                                :class="filter === 'unread' && postFilter === 'unread' ? 'text-white/80' : 'text-gray-500 dark:text-gray-400'"
                                x-text="totalUnread"
                            ></span>
                        </button>
                        <!-- Suggested posts -->
                        <div class="flex items-center gap-1">
                            <button
                                @click="postFilter = 'unread'; setFilter('suggested')"
                                class="flex-1 text-left px-3 py-2 rounded text-sm flex items-center gap-2"
                                :class="filter === 'suggested' ? 'bg-purple-600 text-white' : 'hover:bg-gray-200 dark:hover:bg-gray-700'"
                            >
                                <svg class="w-4 h-4" :class="filter === 'suggested' ? 'text-white' : 'text-purple-500'"><use href="#icon-sparkles"/></svg>
                                <span x-text="t('sidebar.suggested')"></span>
                                <span
                                    x-show="suggestedCount > 0"
                                    class="ml-auto"
                                    :class="filter === 'suggested' ? 'text-white/80' : 'text-purple-600 dark:text-purple-400'"
                                    x-text="suggestedCount"
                                ></span>
                            </button>
                            <button
                                @click.stop="regenerateSuggestions()"
                                :disabled="regeneratingSuggestions"
                                class="p-1.5 rounded hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-500 dark:text-gray-400"
                                :data-tip="regeneratingSuggestions ? t('sidebar.regenerating') : t('sidebar.regenerateSuggestions')"
                                :aria-label="regeneratingSuggestions ? t('sidebar.regenerating') : t('sidebar.regenerateSuggestions')"
                            >
                                <svg class="w-4 h-4" :class="regeneratingSuggestions ? 'animate-spin' : ''"><use href="#icon-refresh"/></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Top Tags (collapsible, desktop only, hidden during search) -->
                    <div x-show="!searchQuery.trim()" class="hidden md:block p-2 border-b border-gray-200 dark:border-gray-700">
                        <button
                            @click="toggleTopTags()"
                            class="w-full text-left px-2 py-1.5 rounded text-sm font-medium flex items-center gap-1.5 hover:bg-gray-200 dark:hover:bg-gray-700"
                        >
                            <svg class="w-3 h-3 transition-transform duration-200" :class="topTagsExpanded ? 'rotate-90' : ''"><use href="#icon-chevron-right"/></svg>
                            <svg class="w-4 h-4 text-gray-500 dark:text-gray-400"><use href="#icon-tag"/></svg>
                            <span x-text="t('sidebar.topTags')"></span>
                        </button>
                        <div
                            x-show="topTagsExpanded"
                            x-transition:enter="transition ease-out duration-200"
                            x-transition:enter-start="opacity-0 -translate-y-2"
                            x-transition:enter-end="opacity-100 translate-y-0"
                            x-transition:leave="transition ease-in duration-150"
                            x-transition:leave-start="opacity-100 translate-y-0"
                            x-transition:leave-end="opacity-0 -translate-y-2"
                            class="mt-1 flex flex-wrap gap-1 px-2"
                        >
                            <template x-for="item in popularTags" :key="item.tag">
                                <button
                                    @click="filterByTag(item.tag)"
                                    class="text-xs px-1.5 py-0.5 rounded-full border transition-colors flex items-center gap-1"
                                    :class="tagFilter === item.tag
                                        ? 'bg-blue-600 text-white border-blue-600'
                                        : 'text-gray-600 dark:text-gray-400 border-gray-300 dark:border-gray-600 hover:bg-gray-200 dark:hover:bg-gray-700'"
                                >
                                    <span x-text="item.tag"></span>
                                    <span class="opacity-60" x-text="item.count"></span>
                                </button>
                            </template>
                        </div>
                    </div>

                    <!-- Topics (collapsible, desktop only) -->
                    <div class="hidden md:block p-2 border-b border-gray-200 dark:border-gray-700">
                        <button
                            @click="toggleTopics()"
                            class="w-full text-left px-2 py-1.5 rounded text-sm font-medium flex items-center gap-1.5 hover:bg-gray-200 dark:hover:bg-gray-700"
                        >
                            <svg class="w-3 h-3 transition-transform duration-200" :class="topicsExpanded ? 'rotate-90' : ''"><use href="#icon-chevron-right"/></svg>
                            <svg class="w-4 h-4 text-purple-500 dark:text-purple-400"><use href="#icon-folder"/></svg>
                            <span x-text="t('sidebar.topics')"></span>
                        </button>
                        <div
                            x-show="topicsExpanded"
                            x-transition:enter="transition ease-out duration-200"
                            x-transition:enter-start="opacity-0 -translate-y-2"
                            x-transition:enter-end="opacity-100 translate-y-0"
                            x-transition:leave="transition ease-in duration-150"
                            x-transition:leave-start="opacity-100 translate-y-0"
                            x-transition:leave-end="opacity-0 -translate-y-2"
                            class="mt-1 space-y-0.5"
                        >
                            <template x-for="topic in topics" :key="topic.id">
                                <button
                                    @click="selectTopic(topic.id)"
                                    class="w-full text-left px-2 py-1 rounded text-sm flex items-center justify-between transition-colors"
                                    :class="selectedTopicId === topic.id
                                        ? 'bg-purple-600 text-white'
                                        : 'text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700'"
                                >
                                    <span class="truncate" x-text="topic.name"></span>
                                    <span
                                        class="text-xs px-1.5 py-0.5 rounded-full flex-shrink-0"
                                        :class="selectedTopicId === topic.id
                                            ? 'bg-purple-500 text-white'
                                            : 'bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-400'"
                                        x-text="topic.unread_count"
                                        x-show="topic.unread_count > 0"
                                    ></span>
                                </button>
                            </template>
                        </div>
                    </div>

                    <!-- Categories & Feeds Tree -->
                    <nav class="flex-1 overflow-y-auto scrollbar-thin p-2">
                        <template x-for="category in categories" :key="category.id">
                            <div class="mb-1">
                                <!-- Category header -->
                                <div
                                    class="w-full text-left px-2 py-1.5 rounded text-sm font-medium flex items-center gap-1 transition-colors duration-150"
                                    :class="{
                                        'bg-blue-600 text-white': filter === 'category' && filterId === category.id,
                                        'hover:bg-gray-200 dark:hover:bg-gray-700': !(filter === 'category' && filterId === category.id),
                                        'ring-2 ring-blue-400 bg-blue-50 dark:bg-blue-900/30': dragOverCategoryId === category.id
                                    }"
                                    @dragover.prevent="onCategoryDragOver($event, category.id)"
                                    @dragleave="onCategoryDragLeave($event, category.id)"
                                    @drop="onCategoryDrop($event, category.id)"
                                >
                                    <!-- Chevron toggle -->
                                    <button
                                        @click.stop="toggleCategoryCollapse(category.id)"
                                        class="p-0.5 -ml-1 hover:bg-gray-300 dark:hover:bg-gray-600 rounded transition-transform"
                                        :class="filter === 'category' && filterId === category.id ? 'hover:bg-blue-500' : ''"
                                        :data-tip="t('sidebar.toggleCategory')"
                                        :aria-label="t('sidebar.toggleCategory')"
                                    >
                                        <svg class="w-3 h-3 transition-transform duration-200" :class="isCategoryCollapsed(category.id) ? '' : 'rotate-90'"><use href="#icon-chevron-right"/></svg>
                                    </button>
                                    <!-- Folder icon -->
                                    <svg class="w-4 h-4 text-gray-500 dark:text-gray-400 flex-shrink-0" :class="filter === 'category' && filterId === category.id ? 'text-white/70' : ''"><use href="#icon-folder"/></svg>
                                    <!-- Category name (clickable to filter) -->
                                    <button
                                        @click="setFilter('category', category.id)"
                                        class="flex-1 truncate text-left"
                                        x-text="category.name"
                                    ></button>
                                    <span
                                        x-show="getCategoryUnread(category.id) > 0"
                                        class="bg-blue-500 text-white text-xs px-1.5 rounded"
                                        :class="filter === 'category' && filterId === category.id ? 'bg-white/20' : ''"
                                        x-text="getCategoryUnread(category.id)"
                                    ></span>
                                </div>
                                <!-- Feeds inside category -->
                                <div
                                    x-show="!isCategoryCollapsed(category.id)"
                                    x-transition:enter="transition ease-out duration-200"
                                    x-transition:enter-start="opacity-0 -translate-y-2"
                                    x-transition:enter-end="opacity-100 translate-y-0"
                                    x-transition:leave="transition ease-in duration-150"
                                    x-transition:leave-start="opacity-100 translate-y-0"
                                    x-transition:leave-end="opacity-0 -translate-y-2"
                                    class="ml-4 border-l border-gray-300 dark:border-gray-700 pl-2"
                                >
                                    <template x-for="feed in feeds.filter(f => f.category_id === category.id)" :key="feed.id">
                                        <button
                                            @click="setFilter('feed', feed.id)"
                                            class="w-full text-left px-2 py-1 rounded text-sm truncate text-gray-700 dark:text-gray-300 flex items-center gap-2"
                                            :class="filter === 'feed' && filterId === feed.id ? 'bg-blue-600 text-white' : 'hover:bg-gray-200 dark:hover:bg-gray-700'"
                                            :draggable="window.innerWidth >= 1024 ? 'true' : 'false'"
                                            @dragstart="window.innerWidth >= 1024 && onFeedDragStart($event, feed.id)"
                                            @dragend="onFeedDragEnd($event)"
                                        >
                                            <svg class="w-3 h-3 text-gray-500 flex-shrink-0"><use href="#icon-rss"/></svg>
                                            <span class="flex-1 truncate" x-text="feed.title"></span>
                                            <span
                                                x-show="feed.unread_count > 0"
                                                class="bg-blue-500 text-white text-xs px-1.5 rounded flex-shrink-0"
                                                x-text="feed.unread_count"
                                            ></span>
                                            <span
                                                x-show="feed.error_count > 0"
                                                class="text-red-400 text-xs flex-shrink-0"
                                                data-tip="Feed com erros"
                                            >!</span>
                                        </button>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </nav>

                    <!-- Sidebar Footer -->
                    <div class="flex-shrink-0 p-3 border-t border-gray-200 dark:border-gray-700 flex items-center justify-between">
                        <a
                            href="https://github.com/janiosarmento/risos"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors"
                        >
                            <svg class="w-5 h-5"><use href="#icon-github"/></svg>
                            <span>Github</span>
                        </a>
                        <span class="text-xs text-gray-400 dark:text-gray-500" x-text="appVersion"></span>
                    </div>
                </aside>

                <!-- Main Content -->
                <main class="flex-1 flex flex-col overflow-hidden">
                    <!-- Post List Header -->
                    <div class="p-4 border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <!-- Hamburger menu button (mobile only) -->
                                <button
                                    @click="sidebarOpen = true"
                                    class="md:hidden p-1 -ml-1 text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white"
                                    :data-tip="t('sidebar.openMenu')"
                                    :aria-label="t('sidebar.openMenu')"
                                >
                                    <svg class="w-6 h-6"><use href="#icon-hamburger"/></svg>
                                </button>
                                <h2 class="font-medium">
                                    <a
                                        x-show="filter === 'feed' && getFeedSiteUrl(filterId)"
                                        :href="getFeedSiteUrl(filterId)"
                                        x-text="getFilterTitle()"
                                        target="_blank"
                                        rel="noopener"
                                        class="hover:text-blue-500 hover:underline"
                                    ></a>
                                    <span
                                        x-show="filter !== 'feed' || !getFeedSiteUrl(filterId)"
                                        x-text="getFilterTitle()"
                                    ></span>
                                </h2>
                                <!-- Tag filter indicator -->
                                <template x-if="tagFilter">
                                    <span class="inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300 border border-blue-200 dark:border-blue-700">
                                        <svg class="w-3 h-3"><use href="#icon-tag"/></svg>
                                        <span x-text="tagFilter"></span>
                                        <span class="opacity-60" x-text="'(' + tagFilterCount + ')'"></span>
                                        <!-- Add to topic dropdown -->
                                        <span x-show="topics.length > 0" class="relative" x-data="{ open: false }">
                                            <button @click="open = !open" class="hover:text-blue-900 dark:hover:text-white ml-0.5" :data-tip="t('topics.addToTopic')" :aria-label="t('topics.addToTopic')">
                                                <svg class="w-3 h-3"><use href="#icon-folder"/></svg>
                                            </button>
                                            <div x-show="open" @click.away="open = false" class="absolute top-full left-0 mt-1 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 rounded shadow-lg z-50 min-w-[160px]">
                                                <template x-for="topic in topics" :key="topic.id">
                                                    <button
                                                        @click="addTagFilterToTopic(topic.id); open = false"
                                                        class="w-full text-left px-3 py-1.5 text-xs hover:bg-gray-100 dark:hover:bg-gray-700 truncate"
                                                        x-text="topic.name"
                                                    ></button>
                                                </template>
                                            </div>
                                        </span>
                                        <button @click="clearTagFilter()" class="hover:text-blue-900 dark:hover:text-white ml-0.5" :data-tip="t('tags.clearFilter')" :aria-label="t('tags.clearFilter')">&times;</button>
                                    </span>
                                </template>
                                <!-- Topic filter indicator -->
                                <template x-if="selectedTopicId">
                                    <span class="inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full bg-purple-100 dark:bg-purple-900/40 text-purple-700 dark:text-purple-300 border border-purple-200 dark:border-purple-700">
                                        <svg class="w-3 h-3"><use href="#icon-folder"/></svg>
                                        <span x-text="getSelectedTopicName()"></span>
                                        <button @click="clearTopicFilter()" class="hover:text-purple-900 dark:hover:text-white ml-0.5" :data-tip="t('topics.clearFilter')" :aria-label="t('topics.clearFilter')">&times;</button>
                                    </span>
                                </template>
                                <!-- Refresh feed button -->
                                <button
                                    x-show="filter === 'feed'"
                                    @click="refreshFeed(filterId)"
                                    :disabled="refreshingFeed"
                                    class="p-1 text-gray-400 hover:text-blue-500 disabled:opacity-50"
                                    :data-tip="t('feeds.refresh')"
                                    :aria-label="t('feeds.refresh')"
                                >
                                    <svg class="w-4 h-4" :class="refreshingFeed && 'animate-spin'"><use href="#icon-refresh"/></svg>
                                </button>
                            </div>
                            <div class="flex items-center gap-1 md:gap-2 text-xs md:text-sm">
                                <!-- Search -->
                                <div class="relative flex items-center">
                                    <svg class="w-3.5 h-3.5 absolute left-2 text-gray-400 pointer-events-none"><use href="#icon-search"/></svg>
                                    <input
                                        id="search-input"
                                        type="text"
                                        x-model="searchQuery"
                                        @input="onSearchInput()"
                                        @keydown.escape="$el.blur(); clearSearch()"
                                        :placeholder="t('search.placeholder')"
                                        data-tip="/ to focus"
                                        class="w-24 md:w-40 pl-7 pr-6 py-1 text-xs rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-1 focus:ring-blue-500 placeholder-gray-400"
                                    />
                                    <button
                                        x-show="searchQuery"
                                        @click="clearSearch()"
                                        class="absolute right-1.5 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"
                                    >&times;</button>
                                </div>
                                <span class="text-gray-400 dark:text-gray-600 hidden md:inline">|</span>
                                <button
                                    @click="toggleSelectMode()"
                                    class="px-1.5 md:px-2 py-1 rounded"
                                    :class="selectMode ? 'bg-blue-600 text-white' : 'text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'"
                                ><span x-text="t('posts.select')"></span><span class="hidden lg:inline opacity-60"> (X)</span></button>
                                <span class="text-gray-400 dark:text-gray-600 hidden md:inline">|</span>
                                <!-- Post filter: Unread -->
                                <button
                                    @click="clearCuration(); postFilter = 'unread'; loadPosts(true)"
                                    class="px-1.5 md:px-2 py-1 rounded flex items-center gap-1"
                                    :class="postFilter === 'unread' ? 'bg-blue-600 text-white' : 'text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'"
                                    :data-tip="t('sidebar.unread')"
                                    :aria-label="t('sidebar.unread')"
                                >
                                    <!-- Circle icon (unread) - mobile only -->
                                    <svg class="w-4 h-4 md:hidden"><use href="#icon-circle"/></svg>
                                    <span class="hidden md:inline" x-text="t('sidebar.unread')"></span>
                                </button>
                                <!-- Post filter: All -->
                                <button
                                    @click="clearCuration(); postFilter = 'all'; loadPosts(true)"
                                    class="px-1.5 md:px-2 py-1 rounded flex items-center gap-1"
                                    :class="postFilter === 'all' ? 'bg-blue-600 text-white' : 'text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'"
                                    :data-tip="t('sidebar.all')"
                                    :aria-label="t('sidebar.all')"
                                >
                                    <!-- List icon (all) - mobile only -->
                                    <svg class="w-4 h-4 md:hidden"><use href="#icon-hamburger"/></svg>
                                    <span class="hidden md:inline" x-text="t('sidebar.all')"></span>
                                </button>
                                <!-- Post filter: Starred -->
                                <button
                                    @click="postFilter = 'starred'; loadPosts(true)"
                                    class="px-1.5 md:px-2 py-1 rounded flex items-center gap-1"
                                    :class="postFilter === 'starred' ? 'bg-blue-600 text-white' : 'text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'"
                                    :data-tip="t('sidebar.starred')"
                                    :aria-label="t('sidebar.starred')"
                                >
                                    <!-- Star icon (starred) - mobile only -->
                                    <svg class="w-4 h-4 md:hidden"><use href="#icon-star-24"/></svg>
                                    <!-- Mobile: show count after star icon -->
                                    <span class="md:hidden" x-show="starredCount > 0" x-text="starredCount"></span>
                                    <!-- Desktop: show text + count -->
                                    <span class="hidden md:inline" x-text="t('sidebar.starred') + (starredCount > 0 ? ' (' + starredCount + ')' : '')"></span>
                                </button>
                                <!-- Export starred -->
                                <button
                                    x-show="starredCount > 0 && postFilter === 'starred'"
                                    @click="exportStarred()"
                                    class="px-1 py-1 text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white"
                                    :data-tip="t('posts.exportStarred')"
                                    :aria-label="t('posts.exportStarred')"
                                >
                                    <svg class="w-4 h-4"><use href="#icon-download"/></svg>
                                </button>
                                <!-- Curate button -->
                                <button
                                    x-show="starredCount > 0 && postFilter === 'starred'"
                                    @click="curatePosts()"
                                    :disabled="curatingPosts"
                                    class="px-1.5 py-0.5 text-xs text-purple-600 dark:text-purple-400 border border-purple-300 dark:border-purple-600 rounded hover:bg-purple-50 dark:hover:bg-purple-900/30 disabled:opacity-50 hidden md:flex items-center gap-1"
                                    :data-tip="t('curation.curate')"
                                >
                                    <svg x-show="curatingPosts" class="w-3 h-3 animate-spin"><use href="#icon-spinner"/></svg>
                                    <svg x-show="!curatingPosts" class="w-3 h-3"><use href="#icon-sparkles"/></svg>
                                    <span x-text="t('curation.curate')"></span>
                                </button>
                            </div>
                        </div>
                        <!-- Selection toolbar -->
                        <div x-show="selectMode" class="mt-3 flex items-center gap-3 text-sm">
                            <button
                                @click="selectAllVisible()"
                                class="text-blue-500 hover:text-blue-400"
                                x-text="t('posts.selectAll')"
                            ></button>
                            <button
                                @click="deselectAll()"
                                class="text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white"
                                x-text="t('posts.clear')"
                            ></button>
                            <span class="text-gray-500" x-text="selectedPosts.size + ' ' + t('posts.selected')"></span>
                            <button
                                @click="markSelectedAsRead()"
                                class="ml-auto px-3 py-1 bg-green-600 hover:bg-green-700 rounded text-white"
                                :disabled="selectedPosts.size === 0"
                                :class="selectedPosts.size === 0 ? 'opacity-50 cursor-not-allowed' : ''"
                            ><span x-text="t('posts.markAsRead')"></span><span class="hidden lg:inline opacity-60"> (M)</span></button>
                        </div>
                        <!-- Curation results panel -->
                        <div x-show="curationResults" class="mt-2 space-y-2">
                            <!-- Disclaimer -->
                            <p class="text-[11px] text-gray-400 dark:text-gray-500 italic" x-text="t('curation.disclaimer')"></p>
                            <!-- Stats + actions -->
                            <div class="flex flex-wrap items-center gap-2 text-xs">
                                <span class="text-gray-500 dark:text-gray-400" x-text="curationStats.total + ' posts →'"></span>
                                <span class="inline-flex items-center gap-1 px-1.5 py-0.5 bg-green-100 dark:bg-green-900/30 text-green-800 dark:text-green-300 rounded">
                                    <span>★</span> <span x-text="curationStats.essential"></span>
                                </span>
                                <span class="inline-flex items-center gap-1 px-1.5 py-0.5 bg-yellow-100 dark:bg-yellow-900/30 text-yellow-800 dark:text-yellow-300 rounded">
                                    <span>?</span> <span x-text="curationStats.situational"></span>
                                </span>
                                <span class="inline-flex items-center gap-1 px-1.5 py-0.5 bg-red-100 dark:bg-red-900/30 text-red-800 dark:text-red-300 rounded">
                                    <span>✗</span> <span x-text="curationStats.redundant"></span>
                                </span>
                                <span x-show="curationStats.unclassified > 0" class="inline-flex items-center gap-1 px-1.5 py-0.5 bg-gray-100 dark:bg-gray-700/30 text-gray-600 dark:text-gray-400 rounded" :data-tip="t('curation.unclassifiedReason')">
                                    <span>—</span> <span x-text="curationStats.unclassified"></span>
                                </span>
                                <button
                                    @click="exportSelection()"
                                    x-show="selectedPosts.size > 0"
                                    class="px-2 py-1 bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 border border-blue-200 dark:border-blue-700 rounded hover:bg-blue-200 dark:hover:bg-blue-900/50"
                                    x-text="t('curation.downloadSelected')"
                                ></button>
                                <button
                                    @click="batchUnstar()"
                                    x-show="selectedPosts.size > 0"
                                    class="px-2 py-1 bg-red-600 text-white rounded hover:bg-red-700"
                                    x-text="t('curation.archiveSelected')"
                                ></button>
                                <button
                                    @click="clearCuration()"
                                    class="ml-auto px-2 py-1 text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white"
                                    x-text="t('curation.clear')"
                                ></button>
                            </div>
                        </div>
                    </div>

                    <!-- Split container (posts list + reading pane) -->
                    <div id="split-container" class="flex-1 flex flex-col overflow-hidden min-h-0">
                        <!-- Post List -->
                        <div
                            id="post-list"
                            class="overflow-y-auto scrollbar-thin"
                            :class="isSplitMode ? 'flex-shrink-0 border-b border-gray-300 dark:border-gray-600' : 'flex-1'"
                            :style="splitPaneStyle"
                            @scroll="handleScroll($event)"
                        >
                        <template x-if="loading && posts.length === 0">
                            <div class="p-8 text-center text-gray-500" x-text="t('app.loading')"></div>
                        </template>

                        <template x-if="!loading && posts.length === 0">
                            <div class="p-8 text-center text-gray-500" x-text="t('posts.noPosts')"></div>
                        </template>

                        <template x-for="(post, index) in posts" :key="post.id">
                            <article
                                @click="selectMode ? togglePostSelection(post.id) : openPost(post)"
                                @keydown.enter="selectMode ? togglePostSelection(post.id) : openPost(post)"
                                tabindex="0"
                                class="p-4 border-b border-gray-200 dark:border-gray-700 cursor-pointer transition"
                                :class="{
                                    'bg-blue-100 dark:bg-gray-800': selectedIndex === index,
                                    'hover:bg-gray-100 dark:hover:bg-gray-800': selectedIndex !== index,
                                    'opacity-60': post.is_read,
                                    'bg-blue-100 dark:bg-blue-900/30': isPostSelected(post.id),
                                    'mt-4 border-t-4 border-t-gray-300 dark:border-t-gray-600': shouldShowDateSeparator(index) && index > 0,
                                    'border-l-[3px] border-l-red-400 dark:border-l-red-600': post.is_blocked
                                }"
                                :data-index="index"
                            >
                                <div class="flex items-start gap-3">
                                    <!-- Checkbox para selecao -->
                                    <div
                                        x-show="selectMode"
                                        class="flex-shrink-0 mt-1"
                                        @click.stop="togglePostSelection(post.id)"
                                    >
                                        <div
                                            class="w-5 h-5 rounded border-2 flex items-center justify-center transition-colors"
                                            :class="isPostSelected(post.id) ? 'bg-blue-500 border-blue-500' : 'border-gray-500 hover:border-blue-400'"
                                        >
                                            <svg x-show="isPostSelected(post.id)" class="w-3 h-3 text-white" stroke-width="3"><use href="#icon-check"/></svg>
                                        </div>
                                    </div>
                                    <!-- Indicador de nao lido -->
                                    <div
                                        x-show="!selectMode"
                                        class="w-2 h-2 rounded-full mt-2 flex-shrink-0"
                                        :class="post.is_read ? 'bg-gray-400 dark:bg-gray-600' : 'bg-blue-500'"
                                    ></div>
                                    <div class="flex-1 min-w-0">
                                        <div class="flex items-start gap-2">
                                            <template x-if="post.skip_summary">
                                                <svg class="w-3.5 h-3.5 flex-shrink-0 text-red-400 mt-0.5"><use href="#icon-prohibition"/></svg>
                                            </template>
                                            <h3
                                                class="flex-1"
                                                :class="post.translated_title
                                                    ? 'text-xs line-clamp-1 ' + (post.is_read ? 'text-gray-500 dark:text-gray-400' : 'text-gray-500 dark:text-gray-400')
                                                    : 'line-clamp-2 ' + (post.is_read ? 'text-gray-500 dark:text-gray-400' : 'text-gray-900 dark:text-white')"
                                                x-html="highlightBlockedTitle(post.title)"
                                            ></h3>
                                        </div>
                                        <template x-if="post.translated_title">
                                            <p class="font-semibold italic line-clamp-2 mb-1" :class="post.is_read ? 'text-gray-500 dark:text-gray-400' : 'text-gray-900 dark:text-white'" x-text="post.translated_title"></p>
                                        </template>
                                        <div class="text-sm text-gray-500 flex items-center gap-2" :class="{'mt-1': !post.translated_title}">
                                            <!-- Star icon -->
                                            <button
                                                @click.stop="toggleStar(post)"
                                                class="flex-shrink-0 hover:scale-110 transition-transform"
                                                :data-tip="post.is_starred ? t('modal.unstarPost') : t('modal.starPost')"
                                            >
                                                <svg class="w-4 h-4" :class="post.is_starred ? 'text-yellow-500' : 'text-gray-400 hover:text-yellow-400'" :fill="post.is_starred ? 'currentColor' : 'none'" :stroke="post.is_starred ? 'none' : 'currentColor'" :stroke-width="post.is_starred ? '0' : '1.5'" viewBox="0 0 20 20"><use href="#icon-star"/></svg>
                                            </button>
                                            <!-- Like icon (heart) -->
                                            <button
                                                @click.stop="toggleLike(post)"
                                                class="flex-shrink-0 hover:scale-110 transition-transform"
                                                :data-tip="post.is_liked ? t('modal.unlikePost') : t('modal.likePost')"
                                            >
                                                <svg class="w-4 h-4" :class="post.is_liked ? 'text-red-500' : 'text-gray-400 hover:text-red-400'" :fill="post.is_liked ? 'currentColor' : 'none'" :stroke="post.is_liked ? 'none' : 'currentColor'" :stroke-width="post.is_liked ? '0' : '1.5'" viewBox="0 0 20 20"><use href="#icon-heart"/></svg>
                                            </button>
                                            <!-- Keep unread (lock) -->
                                            <button
                                                @click.stop="toggleKeepUnread(post)"
                                                class="flex-shrink-0 hover:scale-110 transition-transform"
                                                :data-tip="post.keep_unread ? t('keepUnread.unlock') : t('keepUnread.lock')"
                                            >
                                                <svg class="w-4 h-4" :class="post.keep_unread ? 'text-blue-600 dark:text-blue-400' : 'text-gray-400 hover:text-blue-400'" :fill="post.keep_unread ? 'currentColor' : 'none'" :stroke="post.keep_unread ? 'none' : 'currentColor'" :stroke-width="post.keep_unread ? '0' : '1.5'" viewBox="0 0 24 24"><use href="#icon-lock"/></svg>
                                            </button>
                                            <span
                                                x-show="post.is_suggested && post.suggestion_score != null"
                                                class="inline-flex items-center px-1.5 py-0.5 rounded text-xs font-medium bg-purple-100 text-purple-800 dark:bg-purple-900 dark:text-purple-200"
                                                x-text="Math.round(post.suggestion_score) + '%'"
                                            ></span>
                                            <!-- Curation badge with custom tooltip -->
                                            <span
                                                x-show="getCurationBadge(post.id)"
                                                class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-medium cursor-help"
                                                :class="{
                                                    'bg-green-100 text-green-800 dark:bg-green-900/40 dark:text-green-300': getCurationBadge(post.id)?.classification === 'essential',
                                                    'bg-red-100 text-red-800 dark:bg-red-900/40 dark:text-red-300': getCurationBadge(post.id)?.classification === 'redundant',
                                                    'bg-yellow-100 text-yellow-800 dark:bg-yellow-900/40 dark:text-yellow-300': getCurationBadge(post.id)?.classification === 'keep_if_interested'
                                                }"
                                                :data-tip="getCurationBadge(post.id)?.reason"
                                                x-text="getCurationBadge(post.id)?.classification === 'essential' ? '★ essential' : getCurationBadge(post.id)?.classification === 'redundant' ? '✗ redundant' : '? situational'"
                                            ></span>
                                            <span x-text="getFeedTitle(post.feed_id)" @click.stop="navigateToFeed(post.feed_id, post.id)" class="cursor-pointer hover:underline"></span>
                                            <span>-</span>
                                            <span x-text="formatDate(post.published_at || post.fetched_at)"></span>
                                        </div>
                                        <p
                                            x-show="post.one_line_summary && !post.one_line_summary.toLowerCase().includes('sem artigo')"
                                            class="mt-1 text-sm text-gray-500 dark:text-gray-400 italic"
                                            x-text="post.one_line_summary"
                                        ></p>
                                        <template x-if="post.tags && post.tags.length > 0">
                                            <div class="mt-1 flex-wrap gap-1 hidden md:flex">
                                                <template x-for="tag in post.tags" :key="tag">
                                                    <span
                                                        class="text-[10px] px-1 py-0 rounded border cursor-pointer transition-colors"
                                                        :class="tagFilter === tag
                                                            ? 'bg-blue-600 text-white border-blue-600'
                                                            : isTopicTag(tag)
                                                                ? 'text-purple-600 dark:text-purple-400 border-purple-300 dark:border-purple-700 bg-purple-50 dark:bg-purple-900/20 hover:bg-purple-100 dark:hover:bg-purple-900/40'
                                                                : 'text-gray-400 dark:text-gray-500 border-gray-200 dark:border-gray-700 hover:bg-gray-200 dark:hover:bg-gray-700'"
                                                        @click.stop="filterByTag(tag)"
                                                        x-text="tag"
                                                    ></span>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </article>
                        </template>

                        <template x-if="loading && posts.length > 0">
                            <div class="p-4 text-center text-gray-500" x-text="t('app.loadingMore')"></div>
                        </template>

                        <template x-if="hasMore && !loading && posts.length > 0">
                            <div class="p-4 text-center">
                                <button
                                    @click="loadPosts()"
                                    class="px-4 py-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 rounded text-sm"
                                    x-text="t('app.loadMore')"
                                ></button>
                            </div>
                        </template>

                        <template x-if="!hasMore && posts.length > 0">
                            <div class="p-4 text-center text-gray-600 text-sm" x-text="t('app.endOfList')"></div>
                        </template>
                        </div>

                        <!-- Resize Handle (only in split mode) -->
                        <div
                            x-show="isSplitMode"
                            @mousedown="startResize($event)"
                            @touchstart.prevent="startResize($event)"
                            class="resize-handle h-2 bg-gray-200 dark:bg-gray-700 hover:bg-blue-400 dark:hover:bg-blue-500 cursor-row-resize flex-shrink-0 transition-colors"
                            :class="resizing ? 'bg-blue-500 dark:bg-blue-400' : ''"
                        ></div>

                        <!-- Split View Reading Pane (only on desktop in split mode) -->
                        <template x-if="isSplitMode">
                        <div class="flex-1 flex flex-col overflow-hidden min-h-0 bg-white dark:bg-gray-900">
                            <!-- Empty state when no post selected -->
                            <template x-if="!currentPost">
                                <div class="flex-1 flex items-center justify-center text-gray-400 dark:text-gray-500">
                                    <div class="text-center p-8">
                                        <svg class="w-16 h-16 mx-auto mb-4 opacity-50"><use href="#icon-document"/></svg>
                                        <p class="text-lg" x-text="t('splitView.selectPost')"></p>
                                        <p class="text-sm mt-2 opacity-75" x-text="t('splitView.hint')"></p>
                                    </div>
                                </div>
                            </template>

                            <!-- Post content when selected -->
                            <template x-if="currentPost">
                            <!-- INCLUDE static/templates/post-reader-split.html -->
                            </template>
                        </div>
                        </template>
                    </div>

                    <!-- Keyboard hints footer (desktop only) -->
                    <div class="hidden md:flex p-2 border-t border-gray-200 dark:border-gray-700 text-xs text-gray-400 dark:text-gray-500 justify-center gap-4 bg-gray-50 dark:bg-gray-800 flex-shrink-0">
                        <span x-show="!selectMode">J/K <span x-text="t('shortcuts.navigate')"></span></span>
                        <span x-show="!selectMode">[/] <span x-text="t('shortcuts.feeds')"></span></span>
                        <span x-show="!selectMode">Enter <span x-text="t('shortcuts.open')"></span></span>
                        <span x-show="selectMode">Space <span x-text="t('shortcuts.toggle')"></span></span>
                        <span x-show="selectMode">J/K <span x-text="t('shortcuts.navigate')"></span></span>
                    </div>
                </main>
            </div>
        </template>

        <!-- Post Modal - Fullscreen Two Columns (only when not in split mode) -->
        <template x-if="currentPost && !isSplitMode">
            <!-- INCLUDE static/templates/post-reader-fullscreen.html -->
        </template>

        <!-- IA Sparkle Assistant Modal -->
        <template x-if="showAssistantModal">
            <div
                class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4"
                @click.self="showAssistantModal = false"
                @keydown.escape.window="showAssistantModal = false"
            >
                <div
                    class="bg-white dark:bg-gray-800 rounded-lg shadow-2xl w-full max-w-2xl max-h-[90vh] md:max-h-[85vh] flex flex-col border border-purple-200 dark:border-purple-900/60 overflow-hidden"
                    role="dialog"
                    aria-modal="true"
                    aria-labelledby="assistant-dialog-title"
                >
                    <!-- Header -->
                    <div class="p-4 bg-gradient-to-r from-purple-50 to-indigo-50 dark:from-purple-950/20 dark:to-indigo-950/20 border-b border-purple-100 dark:border-purple-900/40 flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <svg class="w-5 h-5 text-purple-600 dark:text-purple-400 animate-pulse"><use href="#icon-sparkles"/></svg>
                            <h2 id="assistant-dialog-title" class="text-base md:text-lg font-bold text-purple-800 dark:text-purple-300" x-text="t('modal.assistantTitle')"></h2>
                        </div>
                        <button @click="showAssistantModal = false" class="text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white text-2xl leading-none">&times;</button>
                    </div>

                    <!-- Description -->
                    <div class="px-4 py-2 bg-purple-50/50 dark:bg-purple-950/10 border-b border-purple-100/50 dark:border-purple-900/20">
                        <p class="text-xs text-purple-600 dark:text-purple-400" x-text="t('modal.assistantDescription')"></p>
                    </div>

                    <!-- Analyzing Post Title -->
                    <div class="px-4 py-2.5 bg-purple-50/30 dark:bg-purple-950/5 border-b border-purple-100/30 dark:border-purple-900/10 flex flex-col gap-0.5">
                        <span class="text-[10px] font-bold text-purple-600 dark:text-purple-400 uppercase tracking-wider" x-text="t('modal.analyzingPost')"></span>
                        <span class="text-xs font-bold text-gray-900 dark:text-gray-100 line-clamp-1" x-text="currentPost ? currentPost.title : ''"></span>
                    </div>

                    <!-- Read Status Filters -->
                    <div class="px-4 py-2 bg-gray-50/50 dark:bg-gray-700/20 border-b border-gray-100 dark:border-gray-800/40 flex flex-wrap items-center gap-x-4 gap-y-2 text-xs">
                        <span class="font-semibold text-gray-500" x-text="t('modal.assistantFilters')"></span>
                        <label class="flex items-center gap-1.5 cursor-pointer select-none">
                            <input 
                                type="checkbox" 
                                x-model="assistantIncludeRead"
                                @change="loadRelatedPosts()"
                                class="rounded text-purple-600 focus:ring-purple-500 border-gray-300 dark:border-gray-600 dark:bg-gray-700"
                            >
                            <span class="text-gray-700 dark:text-gray-300" x-text="t('modal.assistantIncludeRead')"></span>
                        </label>
                        <label class="flex items-center gap-1.5 cursor-pointer select-none">
                            <input 
                                type="checkbox" 
                                x-model="assistantIncludeUnread"
                                @change="loadRelatedPosts()"
                                class="rounded text-purple-600 focus:ring-purple-500 border-gray-300 dark:border-gray-600 dark:bg-gray-700"
                            >
                            <span class="text-gray-700 dark:text-gray-300" x-text="t('modal.assistantIncludeUnread')"></span>
                        </label>
                        <label class="flex items-center gap-1.5 cursor-pointer select-none">
                            <input 
                                type="checkbox" 
                                x-model="assistantIncludeZeroCommonTags"
                                @change="loadRelatedPosts()"
                                class="rounded text-purple-600 focus:ring-purple-500 border-gray-300 dark:border-gray-600 dark:bg-gray-700"
                            >
                            <span class="text-gray-700 dark:text-gray-300" x-text="t('modal.assistantIncludeZeroCommonTags')"></span>
                        </label>
                    </div>

                    <!-- Body -->
                    <div class="flex-1 overflow-y-auto p-4 space-y-4">
                        <!-- Loading State -->
                        <div x-show="assistantLoading" class="flex flex-col items-center justify-center py-12 space-y-3">
                            <svg class="animate-spin h-8 w-8 text-purple-600 dark:text-purple-400"><use href="#icon-spinner"/></svg>
                            <span class="text-sm text-gray-500" x-text="t('app.loading')"></span>
                        </div>

                        <!-- Main Content (when not loading) -->
                        <div x-show="!assistantLoading" class="space-y-4">
                            <!-- Empty State -->
                            <div x-show="relatedPosts.length === 0" class="text-center py-8 text-gray-500 text-sm" x-text="t('modal.noRelatedPosts')"></div>

                            <!-- List of posts (when available) -->
                            <div x-show="relatedPosts.length > 0" class="space-y-2">
                                <!-- Selection actions -->
                                <div class="flex items-center justify-between text-xs pb-2 border-b border-gray-100 dark:border-gray-700">
                                    <button 
                                        @click="toggleAllRelatedPosts()" 
                                        class="text-purple-600 dark:text-purple-400 hover:underline font-medium"
                                        x-text="selectedRelatedPosts.size === relatedPosts.length ? t('settings.tagMerge.selectNone') : t('settings.tagMerge.selectAll')"
                                    ></button>
                                    <span class="text-gray-500">
                                        <span x-text="selectedRelatedPosts.size"></span> / <span x-text="relatedPosts.length"></span> <span x-text="t('posts.selected')"></span>
                                    </span>
                                </div>

                                <!-- Posts Scrollable List -->
